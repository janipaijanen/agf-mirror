project:
  codename: "foundry"
  description: >
    Next-generation governance framework for multi-agent software development.
    Builds on field evidence from two independent adopter projects to address
    known gaps: operational substrate (ownership queries, handoff state,
    coordination schemas), governance tightening (advisory consultation
    enforcement, digest tooling), and adoption experience improvements.
  started_adopting: "2026-06-11"

adoption:
  framework_id: "agents-govern"
  framework_version: "1.1.50"
  framework_commit: ""          # fill in after git init
  agent_definitions:
    - id: "agents-govern:planner-architect:0.4.0"
      local_path: "agents-govern/agents/planner-architect.yaml"
      customized: true
      customization_notes: "Purpose and design_principles updated for framework development context"
    - id: "agents-govern:coder-tester:0.3.2"
      local_path: "agents-govern/agents/coder-tester.yaml"
      customized: true
      customization_notes: "Jurisdiction updated for framework artifacts (framework.md, agents/*.yaml, rules-template, skills)"
    - id: "agents-govern:governor-reviewer:0.4.0"
      local_path: "agents-govern/agents/governor-reviewer.yaml"
      customized: true
      customization_notes: "Design principles extended with evidence-first and self-governing principles"
    - id: "agents-govern:contribution-auditor:0.3.0"
      local_path: "agents-govern/agents/contribution-auditor.yaml"
      customized: false
    - id: "agents-govern:infosec-sentinel:0.3.0"
      local_path: "agents-govern/agents/infosec-sentinel.yaml"
      customized: false
  upgrade_history: []

business_domain:
  primary: "developer-tools"
  secondary: ["framework", "ai-governance", "multi-agent-systems"]

regulatory_context:
  frameworks: ["CC-BY-SA-4.0"]
  data_residency: "no constraints"
  notes: "Open-source framework; no personal data processed"

team:
  size: 1
  roles: ["framework-author", "governor-reviewer"]
  ai_agents_used: ["claude-sonnet-4-6"]

lifecycle_state:
  current: "greenfield"
  target: "framework release — next major version of agents-govern"

customer_state:
  paying_customers: false
  notes: "Open-source; adopters are the users"

revenue_context:
  model: "open-source"

codebase:
  primary_language: ""
  secondary_languages: ["python", "yaml", "markdown"]
  test_coverage_estimate: "n/a — framework is documentation + tooling"
  ci_cd: false
  notes: >
    Framework artifacts: framework.md, agents/*.yaml, rules-template/**,
    skills/**, schemas/**, learnings/**, pyproject.toml, CHANGELOG.md.
    Python tooling (agov-* validators) lives in src/ and is tested via pytest.

environments:
  - name: "development"
    has_pii: false
    policy_level: "relaxed"
  - name: "release"
    has_pii: false
    policy_level: "strict"

# ---- Learning Records ----
# Format:
#   id: L001, L002, ...
#   date: YYYY-MM-DD
#   category: gap | overkill | validation | adaptation | tension
#   agents_involved: [agent-names]
#   summary: one sentence
#   detail: multi-line description
#   framework_impact: low | medium | high
#   status: proposed | active | resolved

learnings:

  - id: L001
    date: "2026-06-11"
    category: adaptation
    agents_involved: [planner-architect, coder-tester, governor-reviewer]
    summary: >
      Framework adopted to govern its own next-version development — a
      self-referential bootstrap that is both a proof-of-concept and a
      stress test.
    detail: >
      AGF-NG adopts agents-govern 1.1.50 (Layout B) to govern the development
      of the next version of agents-govern. This creates useful tension:
      every governance friction experienced during development is direct
      evidence for a proposal to fix. The project codename is "foundry".

      Initial assessment from five AI models (Lumo, Claude, Grok, ChatGPT,
      CoPilot, Claude Code, Codex) identified two independent adopter
      field adopter projects as the evidence base. All
      models converged on operational substrate gaps as the highest-priority
      improvement area.
    framework_impact: high
    status: active

  - id: L002
    date: "2026-06-11"
    category: adaptation
    agents_involved: [governor-reviewer]
    summary: >
      Coordination channel adopted as first-class protocol from day one,
      not discovered organically as in prior adopter projects.
    detail: >
      Prior adopter projects grew the coordination channel organically
      from need. AGF-NG adopts it explicitly from the start, encoding
      the pattern as a first-class governance artifact. This tests
      whether the channel is teachable without field discovery.

      The channel follows the field-validated convention: immutable
      Markdown files at docs/coordination/<seq>-<sender>.md, YAML
      front matter with kind/from/to/seq/artifacts_owned, append-only.
    framework_impact: high
    status: active

  - id: L003
    date: "2026-06-11"
    category: gap
    agents_involved: [coder-tester, governor-reviewer, planner-architect]
    summary: >
      Coder-tester implemented T2-5 while the plan was still in
      pending-gate1 status — Gate 1 approval was never formally issued.
    detail: >
      During T2-5 (advisory consultation gate enforcement), the revised plan
      was in pending-gate1 status awaiting governor-reviewer approval. The
      coder-tester (Codex, codex-gpt-5) proceeded to implement the full
      deliverable — PlanValidator, Mix task, test fixtures, plan retrofits —
      without a Gate 1 approval coordination message from the governor-reviewer.

      The implementation matched the revised plan exactly, all 25 tests passed,
      and all plan files validated. No harm resulted in this instance. The gap
      is structural: pending-gate1 is a status field in YAML front matter, but
      nothing in the tooling or protocol prevents a coder-tester from reading
      the plan and acting on it without checking the status field.

      Root cause: Gate 1 is a process gate only. There is no enforcement point
      that binds the coder-tester's jurisdiction to plan status. The coder-tester
      agent definition does not check plan status before claiming implementation work.

      Discovery: planner-architect noticed after reviewing seq 12 (coder-tester
      completion message) that no Gate 1 approval message existed in the
      coordination channel.

      Mitigation applied: retroactive acknowledgment; implementation accepted
      because it correctly matched the plan. Recorded as a learning candidate
      per seq 14 handoff.
    framework_impact: medium
    status: proposed
    recommendation: >
      Add a Gate 1 status check to the coder-tester's pre-implementation
      checklist: before starting implementation, verify the plan file's status
      is approved (not pending-gate1) and that a Gate 1 approval coordination
      message exists referencing the plan. Alternatively, the plan validator
      could warn (not block) when status is pending-gate1 and the invoking
      agent is coder-tester. The enforcement boundary is protocol-level, not
      schema-level.

  - id: L004
    date: "2026-06-11"
    category: gap
    agents_involved: [planner-architect, governor-reviewer]
    summary: >
      Coordination channel ownership claims from the pre-role-identifier era
      are permanently orphaned — no completion can ever release them.
    detail: >
      seq 3 (from: claude, 2026-06-11) posted a claim message asserting
      ownership over three artifacts:
        - spec/schemas/coordination-message.schema.json
        - docs/plans/T1-1-coordination-kind-schema.md
        - docs/coordination/README.md

      At the time, the project used model names (claude, human) as agent
      identifiers, before the role-identifier convention (planner-architect,
      coder-tester, governor-reviewer) was established. The role-identifier
      convention was adopted mid-project with no migration mechanism.

      ClaimTracker's release algorithm requires a completion message whose
      from field matches the claiming agent's from value. Because no agent
      will ever again send coordination messages as from: claude, no
      completion can match the seq 3 claim. The three artifacts will appear
      as permanently active (unreleased) ownership entries in
      mix agov.coord.status forever, even though all the work was completed
      and merged.

      The work itself is not impaired — all three artifacts are correct in
      master. The issue is cosmetic noise in the channel overview plus a
      gap in the ownership protocol: there is no administrative release
      mechanism for naming-convention migrations or agent-identifier renames.

      Root cause: ClaimTracker uses strict from-field matching for release.
      No override, alias, or administrative release kind exists in the protocol.

      Discovery: mix agov.coord.status (T1-2) showed three active ownership
      entries with from: claude that will never clear.

      Relationship to T2-6 follow-on: the deferred releases_artifacts feature
      (partial release) would not solve this case — it still requires the
      releasing message to have the same from value as the claiming message.
      A separate administrative-release mechanism or from-alias support
      would be required.
    framework_impact: low
    status: proposed
    recommendation: >
      Option A: Add an administrative-release message kind (e.g. admin-release)
      that may specify a target seq to release, bypassing from-field matching.
      Requires governor-reviewer authority to prevent misuse.

      Option B: Support a from-aliases field in a project configuration file,
      mapping retired identifiers (claude) to their successor role (planner-architect).
      ClaimTracker treats an alias match as equivalent to a direct match for
      release purposes.

      Option C: Accept the orphaned claims as permanent cosmetic noise and add a
      --ignore-seq N flag to mix agov.coord.status to suppress known orphans.
      Lowest implementation cost; does not close the protocol gap.

      Preferred: Option B (alias mapping), deferred to T2-6 follow-on scope.
      Option C acceptable as an immediate cosmetic fix if needed.

  - id: L005
    date: "2026-06-12"
    category: gap
    agents_involved: [planner-architect, governor-reviewer]
    summary: >
      Validated coordination and plan amendments were left uncommitted, making
      the handoff visible only in the working tree until another agent committed
      them.
    detail: >
      During the agents-govern-2.0 Gate 1 amendment sequence, Codex acting as
      planner-architect wrote and validated the amended plan and coordination
      messages (seq 90-100), then reported completion without ensuring the
      changed files were committed or otherwise made durable in git history.

      Claude later committed the files to master. No information was lost, but
      the gap is real: validation success and handoff visibility in the local
      working tree were treated as equivalent to durable project state. They
      are not equivalent in an asynchronous multi-agent workflow. A paused or
      resumed agent reads git history and coordination files on disk; if the
      work is uncommitted, it can be missed, overwritten, or misattributed.

      Root cause: the completion habit stopped at "file written and validator
      OK" rather than checking "is this intended to be committed now, and if
      not, has that been explicitly handed off?" The repo's branch discipline
      also makes this non-trivial: agents should not commit directly to master,
      but they must still surface uncommitted governance artifacts clearly.

      Discovery: governor-reviewer noticed after Claude committed the files
      that Codex had failed to commit or explicitly hand off the uncommitted
      state.
    framework_impact: medium
    status: proposed
    recommendation: >
      Add a handoff durability check to agents that create coordination
      messages, plans, or learning records: before declaring the task complete,
      run git status for touched artifacts and state whether the artifacts are
      committed, intentionally uncommitted for another agent, or blocked by
      branch discipline. For governance artifacts that must be consumed
      asynchronously, either commit on an appropriate branch or write an
      explicit handoff naming the uncommitted files and required next action.

  - id: L006
    date: "2026-06-12"
    category: gap
    agents_involved: [planner-architect, governor-reviewer, coder-tester]
    summary: >
      Handoff queue tools disagree after a decision-record resolves a handoff.
    detail: >
      After governor-reviewer approved the consolidated agents-govern-2.0
      Gate 1 plan in seq 103, `mix agov.coord.status` correctly treated the
      seq 98-100 handoffs as resolved because later messages referenced them.
      However, `mix agov.handoff.next governor-reviewer` still returned seq
      100 as the next handoff.

      The discrepancy is structural: `Agov.HandoffTracker` is resolution-aware
      and classifies handoffs as resolved when a later coordination message
      references the handoff file. `Agov.HandoffReader`, which backs
      `mix agov.handoff.next`, scans for the highest-seq handoff addressed to
      the role and does not consult the resolution model. The result is two
      official tools presenting different queue states.

      No governance decision was invalidated: seq 103 remains the durable Gate
      1 approval. The risk is operational confusion. A governor-reviewer or
      resumed agent may think already-approved work still awaits review if
      they use `handoff.next` rather than `coord.status`.
    framework_impact: medium
    status: proposed
    recommendation: >
      Make `mix agov.handoff.next` resolution-aware by using the same pending
      handoff model as `Agov.HandoffTracker`. Later decision-record, ack,
      completion, review, or note messages that reference a handoff should
      remove that handoff from the "next" queue. Until fixed, use
      `mix agov.coord.status` as the source of truth for whether a handoff is
      still pending.

  - id: L007
    date: "2026-06-12"
    category: gap
    agents_involved: [planner-architect, governor-reviewer, coder-tester]
    summary: >
      Agents repeatedly committed durable governance artifacts on the wrong
      branch because branch identity was assumed to remain stable across turns
      and concurrent sessions.
    detail: >
      Multiple incidents during the agents-govern-2.0 work showed that "I am on
      the intended branch" is not a durable fact in a shared multi-agent
      checkout. Codex committed the seq 105 tooling fix and completion on
      `feat/agents-govern-2.0-structure`, a feature branch claimed for the
      v2.0 structural work. Later, Codex wrote a curated-corpus coordination
      note as seq 106 from a stale branch view while master already contained
      Claude's seq 106, forcing a renumbering correction to seq 111.

      The existing branch-and-worktree rule already says to check the branch
      immediately before committing, but the failures show that a workflow rule
      is too easy to remember only at task start. Branch identity must be
      treated as volatile state and verified immediately before every durable
      write: commit, push, branch rewrite, merge, tag, or coordination entry
      intended for asynchronous consumption.

      Root cause: agents treated branch selection as session context rather
      than a precondition that must be re-read at the moment of action. In a
      shared checkout, another agent, an IDE, or a resume from stale context can
      invalidate that assumption.
    framework_impact: high
    status: proposed
    recommendation: >
      Promote branch/worktree preflight from workflow guidance to an always-on
      rule for LLM agents: immediately before every commit, push, merge, tag,
      branch rewrite, or coordination/learning/plan write, run
      `git branch --show-current` and `git status --short --branch`; compare
      the result to the intended branch and task scope; stop and ask for
      disposition if the branch differs, is shared/claimed by another agent, or
      would mix unrelated artifacts. Do not rely on earlier branch checks or
      remembered session state.

