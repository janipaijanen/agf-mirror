learnings:

  - id: L001
    date: "2026-06-11"
    category: adaptation
    agents_involved: [planner-architect, coder-tester, governor-reviewer]
    summary: >
      Framework adopted to govern its own next-version development — a
      self-referential bootstrap that is both a proof-of-concept and a
      stress test.
    detail: >
      AGF-NG adopts agents-govern 1.1.50 (Layout B) to govern the development
      of the next version of agents-govern. This creates useful tension:
      every governance friction experienced during development is direct
      evidence for a proposal to fix. The project codename is "foundry".

      Initial assessment from five AI models (Lumo, Claude, Grok, ChatGPT,
      CoPilot, Claude Code, Codex) identified two independent adopter
      field adopter projects as the evidence base. All
      models converged on operational substrate gaps as the highest-priority
      improvement area.
    framework_impact: high
    status: active

  - id: L002
    date: "2026-06-11"
    category: adaptation
    agents_involved: [governor-reviewer]
    summary: >
      Coordination channel adopted as first-class protocol from day one,
      not discovered organically as in prior adopter projects.
    detail: >
      Prior adopter projects grew the coordination channel organically
      from need. AGF-NG adopts it explicitly from the start, encoding
      the pattern as a first-class governance artifact. This tests
      whether the channel is teachable without field discovery.

      The channel follows the field-validated convention: immutable
      Markdown files at docs/coordination/<seq>-<sender>.md, YAML
      front matter with kind/from/to/seq/artifacts_owned, append-only.
    framework_impact: high
    status: active

  - id: L003
    date: "2026-06-11"
    category: gap
    agents_involved: [coder-tester, governor-reviewer, planner-architect]
    summary: >
      Coder-tester implemented T2-5 while the plan was still in
      pending-gate1 status — Gate 1 approval was never formally issued.
    detail: >
      During T2-5 (advisory consultation gate enforcement), the revised plan
      was in pending-gate1 status awaiting governor-reviewer approval. The
      coder-tester (Codex, codex-gpt-5) proceeded to implement the full
      deliverable — PlanValidator, Mix task, test fixtures, plan retrofits —
      without a Gate 1 approval coordination message from the governor-reviewer.

      The implementation matched the revised plan exactly, all 25 tests passed,
      and all plan files validated. No harm resulted in this instance. The gap
      is structural: pending-gate1 is a status field in YAML front matter, but
      nothing in the tooling or protocol prevents a coder-tester from reading
      the plan and acting on it without checking the status field.

      Root cause: Gate 1 is a process gate only. There is no enforcement point
      that binds the coder-tester's jurisdiction to plan status. The coder-tester
      agent definition does not check plan status before claiming implementation work.

      Discovery: planner-architect noticed after reviewing seq 12 (coder-tester
      completion message) that no Gate 1 approval message existed in the
      coordination channel.

      Mitigation applied: retroactive acknowledgment; implementation accepted
      because it correctly matched the plan. Recorded as a learning candidate
      per seq 14 handoff.
    framework_impact: medium
    status: accepted
    recommendation: >
      Add a Gate 1 status check to the coder-tester's pre-implementation
      checklist: before starting implementation, verify the plan file's status
      is approved (not pending-gate1) and that a Gate 1 approval coordination
      message exists referencing the plan. Alternatively, the plan validator
      could warn (not block) when status is pending-gate1 and the invoking
      agent is coder-tester. The enforcement boundary is protocol-level, not
      schema-level.

  - id: L004
    date: "2026-06-11"
    category: gap
    agents_involved: [planner-architect, governor-reviewer]
    summary: >
      Coordination channel ownership claims from the pre-role-identifier era
      are permanently orphaned — no completion can ever release them.
    detail: >
      seq 3 (from: claude, 2026-06-11) posted a claim message asserting
      ownership over three artifacts:
        - spec/schemas/coordination-message.schema.json
        - docs/plans/T1-1-coordination-kind-schema.md
        - docs/coordination/README.md

      At the time, the project used model names (claude, human) as agent
      identifiers, before the role-identifier convention (planner-architect,
      coder-tester, governor-reviewer) was established. The role-identifier
      convention was adopted mid-project with no migration mechanism.

      ClaimTracker's release algorithm requires a completion message whose
      from field matches the claiming agent's from value. Because no agent
      will ever again send coordination messages as from: claude, no
      completion can match the seq 3 claim. The three artifacts will appear
      as permanently active (unreleased) ownership entries in
      mix agov.coord.status forever, even though all the work was completed
      and merged.

      The work itself is not impaired — all three artifacts are correct in
      master. The issue is cosmetic noise in the channel overview plus a
      gap in the ownership protocol: there is no administrative release
      mechanism for naming-convention migrations or agent-identifier renames.

      Root cause: ClaimTracker uses strict from-field matching for release.
      No override, alias, or administrative release kind exists in the protocol.

      Discovery: mix agov.coord.status (T1-2) showed three active ownership
      entries with from: claude that will never clear.

      Relationship to T2-6 follow-on: the deferred releases_artifacts feature
      (partial release) would not solve this case — it still requires the
      releasing message to have the same from value as the claiming message.
      A separate administrative-release mechanism or from-alias support
      would be required.
    framework_impact: low
    status: proposed
    recommendation: >
      Option A: Add an administrative-release message kind (e.g. admin-release)
      that may specify a target seq to release, bypassing from-field matching.
      Requires governor-reviewer authority to prevent misuse.

      Option B: Support a from-aliases field in a project configuration file,
      mapping retired identifiers (claude) to their successor role (planner-architect).
      ClaimTracker treats an alias match as equivalent to a direct match for
      release purposes.

      Option C: Accept the orphaned claims as permanent cosmetic noise and add a
      --ignore-seq N flag to mix agov.coord.status to suppress known orphans.
      Lowest implementation cost; does not close the protocol gap.

      Preferred: Option B (alias mapping), deferred to T2-6 follow-on scope.
      Option C acceptable as an immediate cosmetic fix if needed.

  - id: L005
    date: "2026-06-12"
    category: gap
    agents_involved: [planner-architect, governor-reviewer]
    summary: >
      Validated coordination and plan amendments were left uncommitted, making
      the handoff visible only in the working tree until another agent committed
      them.
    detail: >
      During the agents-govern-2.0 Gate 1 amendment sequence, Codex acting as
      planner-architect wrote and validated the amended plan and coordination
      messages (seq 90-100), then reported completion without ensuring the
      changed files were committed or otherwise made durable in git history.

      Claude later committed the files to master. No information was lost, but
      the gap is real: validation success and handoff visibility in the local
      working tree were treated as equivalent to durable project state. They
      are not equivalent in an asynchronous multi-agent workflow. A paused or
      resumed agent reads git history and coordination files on disk; if the
      work is uncommitted, it can be missed, overwritten, or misattributed.

      Root cause: the completion habit stopped at "file written and validator
      OK" rather than checking "is this intended to be committed now, and if
      not, has that been explicitly handed off?" The repo's branch discipline
      also makes this non-trivial: agents should not commit directly to master,
      but they must still surface uncommitted governance artifacts clearly.

      Discovery: governor-reviewer noticed after Claude committed the files
      that Codex had failed to commit or explicitly hand off the uncommitted
      state.
    framework_impact: medium
    status: proposed
    recommendation: >
      Add a handoff durability check to agents that create coordination
      messages, plans, or learning records: before declaring the task complete,
      run git status for touched artifacts and state whether the artifacts are
      committed, intentionally uncommitted for another agent, or blocked by
      branch discipline. For governance artifacts that must be consumed
      asynchronously, either commit on an appropriate branch or write an
      explicit handoff naming the uncommitted files and required next action.

  - id: L006
    date: "2026-06-12"
    category: gap
    agents_involved: [planner-architect, governor-reviewer, coder-tester]
    summary: >
      Handoff queue tools disagree after a decision-record resolves a handoff.
    detail: >
      After governor-reviewer approved the consolidated agents-govern-2.0
      Gate 1 plan in seq 103, `mix agov.coord.status` correctly treated the
      seq 98-100 handoffs as resolved because later messages referenced them.
      However, `mix agov.handoff.next governor-reviewer` still returned seq
      100 as the next handoff.

      The discrepancy is structural: `Agov.HandoffTracker` is resolution-aware
      and classifies handoffs as resolved when a later coordination message
      references the handoff file. `Agov.HandoffReader`, which backs
      `mix agov.handoff.next`, scans for the highest-seq handoff addressed to
      the role and does not consult the resolution model. The result is two
      official tools presenting different queue states.

      No governance decision was invalidated: seq 103 remains the durable Gate
      1 approval. The risk is operational confusion. A governor-reviewer or
      resumed agent may think already-approved work still awaits review if
      they use `handoff.next` rather than `coord.status`.
    framework_impact: medium
    status: proposed
    recommendation: >
      Make `mix agov.handoff.next` resolution-aware by using the same pending
      handoff model as `Agov.HandoffTracker`. Later decision-record, ack,
      completion, review, or note messages that reference a handoff should
      remove that handoff from the "next" queue. Until fixed, use
      `mix agov.coord.status` as the source of truth for whether a handoff is
      still pending.

  - id: L007
    date: "2026-06-12"
    category: gap
    agents_involved: [planner-architect, governor-reviewer, coder-tester]
    summary: >
      Agents repeatedly committed durable governance artifacts on the wrong
      branch because branch identity was assumed to remain stable across turns
      and concurrent sessions.
    detail: >
      Multiple incidents during the agents-govern-2.0 work showed that "I am on
      the intended branch" is not a durable fact in a shared multi-agent
      checkout. Codex committed the seq 105 tooling fix and completion on
      `feat/agents-govern-2.0-structure`, a feature branch claimed for the
      v2.0 structural work. Later, Codex wrote a curated-corpus coordination
      note as seq 106 from a stale branch view while master already contained
      Claude's seq 106, forcing a renumbering correction to seq 111.

      The existing branch-and-worktree rule already says to check the branch
      immediately before committing, but the failures show that a workflow rule
      is too easy to remember only at task start. Branch identity must be
      treated as volatile state and verified immediately before every durable
      write: commit, push, branch rewrite, merge, tag, or coordination entry
      intended for asynchronous consumption.

      Root cause: agents treated branch selection as session context rather
      than a precondition that must be re-read at the moment of action. In a
      shared checkout, another agent, an IDE, or a resume from stale context can
      invalidate that assumption.
    framework_impact: high
    status: proposed
    recommendation: >
      Promote branch/worktree preflight from workflow guidance to an always-on
      rule for LLM agents: immediately before every commit, push, merge, tag,
      branch rewrite, or coordination/learning/plan write, run
      `git branch --show-current` and `git status --short --branch`; compare
      the result to the intended branch and task scope; stop and ask for
      disposition if the branch differs, is shared/claimed by another agent, or
      would mix unrelated artifacts. Do not rely on earlier branch checks or
      remembered session state.

  - id: L008
    date: "2026-06-13"
    category: gap
    agents_involved: [coder-tester, planner-architect]
    summary: >
      Plan files were written to `.claude/plans/` (an AI tool-config directory)
      rather than to `docs/plans/` (the VCS-tracked governance artifact location).
      Plan files in tool-config directories are invisible to other AI agents,
      external reviewers, CI, and any tool that is not the specific AI assistant
      that wrote them.
    detail: >
      The development-workflow-rule Phase 2 said "write a plan file FIRST" without
      specifying where. The documentation-audience-rule says `docs/plans/` is the
      canonical location for design decisions. In practice, all plan files were
      placed in `.claude/plans/` — Claude Code's own configuration directory.

      This is a governance artifact placement failure. Plan files are the Gate 1
      contract between the planner and the governor. They must be:
      (a) committed to VCS so they survive session boundaries,
      (b) accessible to all agents regardless of which AI tool created them,
      (c) reviewable by humans via standard git tooling, and
      (d) readable by CI or external validators.

      A plan file in `.claude/plans/` fails all four criteria for any agent that
      is not Claude Code. External AI agents (Codex, Gemini, Copilot), CI jobs,
      and human reviewers using other editors cannot reliably find or read it.
      The `.claude/` directory is a tool-config boundary — governance artifacts
      must not cross into it.

      Discovered when a plan file for the pedagogical docs restructure (seq 145)
      was written to `.claude/plans/` and the human governor-reviewer noticed it
      was invisible outside the Claude Code session.
    framework_impact: high
    status: proposed
    recommendation: >
      Update development-workflow-rule Phase 2 to require `docs/plans/` as the
      canonical location. Add an explicit MUST NOT for AI tool-config directories
      (`.claude/plans/`, `.cursor/`, `.copilot/`, and equivalent). The reason:
      plan files are VCS-shared governance artifacts; tool-config directories are
      session-scoped and agent-specific. Move the existing 14 plan files from
      `.claude/plans/` to `docs/plans/` and commit. Create `docs/plans/` if it
      does not exist.

  - id: L009
    date: "2026-06-13"
    category: gap
    agents_involved: [coder-tester, planner-architect]
    summary: >
      Coordination messages that are intended to route work between agents can
      be hidden from active agents when they are committed only on side
      branches that the receiving agent is not polling.
    detail: >
      Codex created seq 153, a handoff asking planner-architect / Claude to
      review and argue with a customer-success experience assessment of the
      v2.0 public documentation. The handoff was committed on
      `plan/public-docs-customer-success-review`, not on `master`. A separate
      Codex session or Claude session watching `master` would not see
      `docs/coordination/00153-coder-tester.md` through ordinary filesystem
      polling, even though the message was specifically meant to route work to
      another agent.

      The immediate workaround was seq 154, a visibility-bridge note written
      on `master`, pointing agents to the side branch and the exact `git show`
      commands needed to inspect seq 153 and the associated proposal. That made
      the hidden message discoverable, but the need for a bridge exposed the
      underlying rule gap.

      This is distinct from L005 (uncommitted governance artifacts) and L007
      (wrong-branch durable writes). A message can be committed and on the
      intended feature branch, yet still fail as coordination if the intended
      recipient's polling surface is `master`. Coordination messages are not
      ordinary implementation artifacts; they are asynchronous routing and
      shared-state artifacts. Their visibility requirements are therefore
      stricter than the visibility requirements of branch-local design or code
      changes.
    framework_impact: high
    status: proposed
    recommendation: >
      Add a coordination-visibility rule: any coordination message that creates
      an obligation for another agent or human must be visible on the branch
      that recipient is expected to poll, or must be paired immediately with a
      visible bridge note on that branch. Branch-local coordination is allowed
      only for messages whose audience is explicitly limited to that branch's
      reviewers and whose discovery path is named in an already-visible
      message. Gate handoffs, cross-agent review requests, and human decisions
      should not be hidden solely on side branches unless the recipient has
      been told where to look.

  - id: L010
    date: "2026-06-13"
    category: gap
    agents_involved: [coder-tester, planner-architect, governor-reviewer]
    summary: >
      Linked worktrees created outside the project root became hidden working
      surfaces that were difficult for humans and agents to discover from the
      AGF-NG checkout.
    detail: >
      During session-continuity and coordination-visibility work, linked git
      worktrees were created as siblings of the project directory, such as
      `/home/devi/src/AGF-NG-session-resume` and
      `/home/devi/src/AGF-NG-coord-visibility`, rather than under the project
      root `/home/devi/src/AGF-NG/`.

      The same pattern already existed for several older AGF-NG worktrees under
      `/home/devi/src/AGF-NG-*` and `/tmp/agf-ng-*`. Although these are valid
      git worktrees, they violate the operator's mental model that AGF-NG work
      should be discoverable from the AGF-NG project directory. They also make
      cleanup, ownership checks, and cold-start orientation harder: a human or
      AI agent inspecting `/home/devi/src/AGF-NG/` does not naturally see sibling
      or `/tmp` worktrees.

      This differs from L007, which is about committing durable artifacts on
      the wrong branch, and from L009, which is about coordination messages
      hidden on side branches. Here the branch may be correct and the
      coordination may be visible, but the filesystem location itself becomes a
      hidden working surface outside the agreed project boundary.

      The immediate correction was to move the two newest Codex-created
      worktrees into `/home/devi/src/AGF-NG/.worktrees/` and to add `.worktrees/`
      to the local `.git/info/exclude`. Older sibling and `/tmp` worktrees were
      not moved automatically because another active human, Claude, or Codex
      session might have absolute paths pinned.
    framework_impact: medium
    status: accepted
    recommendation: >
      Add a worktree-boundary rule for AGF-NG and future adopter guidance: new
      linked worktrees must be created under `.worktrees/<purpose>` inside the
      project root unless the governor-reviewer explicitly approves an external
      path for a temporary diagnostic task. Do not move or remove existing
      external worktrees until ownership and active-session risk are confirmed.
      Keep `.worktrees/` locally ignored so linked worktrees are discoverable
      from the project root without becoming tracked project content.

  - id: L011
    date: "2026-06-13"
    category: gap
    agents_involved: [coder-tester, planner-architect]
    summary: >
      A coordination polling timer that only reports changes after it is armed
      can miss important recently-created messages that already existed at
      startup.
    detail: >
      Codex armed a 180-second coordination polling timer after planner-architect
      had already written recent coordination files, including seq 202-205. The
      timer captured the existing files as its initial baseline and then reported
      "no new messages", which made it look as if the trigger was broken. In
      practice, the timer was technically watching for future file changes, but
      it failed the operator need: a newly armed watcher must orient the agent
      to recent coordination state, not only future deltas.

      The immediate correction was to restart the timer so that arming prints
      the current file count, maximum numeric sequence, and the last 20
      coordination files before entering the 180-second polling loop. Subsequent
      polls compare filename set, file size/mtime, and max sequence number.

      This is related to L009 but distinct. L009 is about messages hidden on
      branches. This issue is about messages that are visible in the watched
      directory but were already present before the polling baseline was taken.
      A cold-start or rearmed poller must show enough recent context to avoid a
      false "nothing happened" interpretation.
    framework_impact: medium
    status: accepted
    recommendation: >
      Coordination polling tools and session timers should print a startup
      baseline that includes at least the current max sequence and the last 20
      coordination files. Polling should then report future changes by filename
      set, file size/mtime, and max sequence number. A "no new messages" poll
      should always include the current max sequence so humans and agents can
      see which baseline is being held.
    superseded_by: >-
      Polling timers must be restarted immediately after session boundary events
      to avoid silent gaps in coordination visibility

  - id: L012
    date: "2026-06-13"
    category: gap
    agents_involved: [coder-tester, contribution-auditor, governor-reviewer]
    summary: >
      Informal approval language can blur advisory and binding governance
      authority.
    detail: >
      During the AGF v2.0 Layout S1 flow, Codex summarized the next state as
      "if contribution-auditor approves" even though contribution-auditor has
      advisory review authority, not binding Gate 2 approval authority. The
      underlying coordination records routed the work correctly, but the
      summary used ordinary engineering shorthand where "audit approved it"
      means "audit review passed." In AGF, that shorthand is unsafe: approval
      is role-authority-specific.

      The correction was recorded at seq 218: contribution-auditor reviews and
      recommends; governor-reviewer makes the binding Gate 2 approval and
      merge decision. This is a language precision failure, not a technical
      validator failure, but repeated imprecision could confuse state,
      authority, and accountability.
    framework_impact: medium
    status: accepted
    recommendation: >
      AGF coordination summaries and handoff prose should use authority verbs
      precisely. Advisory roles "review", "find", "recommend", or "block with
      findings" when their role definition allows it. Binding decision roles
      "approve", "reject", "waive", "merge", or "reopen" according to their
      authority. Documentation and tooling should prefer labels such as
      "recommend-ready-for-gate2" over "approved" for advisory outcomes.

  - id: L013
    date: "2026-06-13"
    category: gap
    agents_involved: [planner-architect, contribution-auditor, governor-reviewer, coder-tester]
    summary: >
      Supporting review records can be mistaken for authoritative gate
      disposition when several roles discuss the same branch.
    detail: >
      During AGF v2 Layout S1, seq 223 was filed by planner-architect as a
      Gate 2 review for `feat/agf-v2-layout`. Its technical assessment was
      useful and substantially correct, including the WARN about stale
      `.claude/rules/always/downstream-impact-rule.md` trigger paths. However,
      because contribution-auditor advisory participation was required, seq 223
      alone was not the required advisory review and was not the binding Gate 2
      disposition.

      The authoritative chain was seq 224 (contribution-auditor advisory
      review), seq 225 (governor-reviewer Gate 2 approval), and seq 226
      (merge/completion). Seq 234 later clarified this after the user asked how
      to interpret seq 223.

      This differs from L012. L012 is about imprecise authority verbs such as
      "approve" versus "recommend." This learning is about review provenance:
      even with mostly correct words, a coordination record can be misread if
      the role that filed it is not the role required for the current gate.
    framework_impact: medium
    status: proposed
    recommendation: >
      Gate summaries and resumed-session answers should name the authoritative
      disposition chain when multiple review records exist for the same branch:
      supporting reviews, required advisory reviews, binding governor decisions,
      and merge/completion records. Tooling could later expose this as a
      "gate disposition" view that groups records by topic or branch and labels
      each record by role authority rather than relying on newest-message order.


  - id: L014
    date: "2026-06-14"
    category: gap
    agents_involved: [coder-tester, governor-reviewer]
    summary: >
      Test suite created durable /tmp/agov* artifacts without cleanup handlers,
      leaving filesystem side-effects that outlive the test process and
      contradict the framework's own auditability claims.
    detail: >
      Inspection of /tmp on 2026-06-14 revealed multiple leftover artifact
      directories and files created by the pytest suite but never cleaned up:
      /tmp/agov_session_resume_*, /tmp/agov_token_roi_*.jsonl,
      /tmp/agov_config_test_*, /tmp/agov_dist_manifest_*, and
      /tmp/agov_test_empty_*. These were created during test runs and left
      on disk when the test process exited.

      The governance contradiction is direct: the framework's audit-log and
      data-trail rules require that every write leaves a traceable, scoped,
      and intentional record. Tests that silently deposit /tmp artifacts and
      do not remove them act outside their scope and produce durable side
      effects with no owner. Any /tmp/agov* path is also namespace-polluting:
      a later test run may read stale state or fail with a collision.

      Rule (user-stated): no AGF durable or audit-shaped artifacts may exist
      in /tmp except through cleanup-registered private temp helpers. Any
      /tmp/agov* leftover after a suite run is a test failure, not a warning.

      Root cause: tests used tempfile.mkdtemp() or ad-hoc path joins without
      registering atexit or pytest-fixture teardown handlers. pytest's
      built-in tmp_path fixture, which auto-removes after each test, was not
      used.
    framework_impact: medium
    status: proposed
    recommendation: >
      Enforce test hygiene: any test that creates a filesystem artifact must
      use pytest's tmp_path fixture (or a registered cleanup helper calling
      shutil.rmtree on teardown) rather than tempfile.mkdtemp(). Add a
      pytest session-scoped autouse fixture in conftest.py that asserts no
      /tmp/agov* paths exist at session end. A leftover path at session end
      is a test failure. Until shipped, the CI post-test teardown must
      include a /tmp/agov* cleanup step.

  - id: L015
    date: "2026-06-13"
    category: gap
    agents_involved: [coder-tester, planner-architect, governor-reviewer]
    summary: >
      Per-file coordination validation is insufficient when multiple worktrees
      or agents can allocate the same global sequence number.
    detail: >
      During the Tier 1 provenance-labels Gate 2 flow, `00241-coder-tester.md`
      and `00241-planner-architect.md` were both created with `seq: 241` on the
      same feature branch. Each file validated independently, but the channel
      invariant is global append-only sequencing, not merely schema-valid
      Markdown front matter.

      The same merge also exposed an older branch/worktree collision:
      `master` already contained a tooling-conformance handoff at
      `00236-coder-tester.md`, while `feat/tier1-provenance-labels` contained a
      different provenance Gate 2 handoff at the same path. The merge could not
      preserve both files at that filename. The repair preserved the tooling
      handoff as `00248-coder-tester.md`, resolved the path collision in favor
      of the provenance branch's `00236-coder-tester.md` so later references
      remained coherent, and recorded governor risk acceptance at seq 247.

      The incident shows that coordination safety requires channel-level and
      branch-level checks before filing and before merge. A file can be valid
      while the channel state is not.
    framework_impact: high
    status: proposed
    recommendation: >
      Before creating a coordination record, agents should check the current
      highest sequence in the intended target branch/worktree and re-check
      immediately before commit. Gate 2 review should include a channel-level
      invariant check for duplicate sequence numbers, path collisions against
      the base branch, and branch-local obligations. Tooling should distinguish
      active collisions from explicitly superseded/documented incidents, but
      should not silently ignore either class.

  - id: L016
    date: "2026-06-14"
    category: gap
    agents_involved: [coder-tester, governor-reviewer]
    summary: >
      Merged Gate 2 handoffs can remain pending unless a later resolver record
      explicitly references the handoff file.
    detail: >
      After GitLab MR !3 and MR !4 were merged and their source branches were
      deleted, `mix agov.session.resume --base-branch main` still reported
      seq 327 and seq 329 as pending governor-reviewer handoffs. The GitLab
      merge state was correct, and the implementation work had landed on
      `main`, but the coordination channel had no later `decision-record`,
      `completion`, or `ack` referencing `00327-coder-tester.md` or
      `00329-coder-tester.md`.

      The handoff tracker was behaving correctly according to its protocol:
      handoff resolution is a coordination-channel fact, not an inference from
      GitLab merge state. The process gap was that merge completion did not
      create a resolver record. Coder-tester filed seq 330 as a completion
      record referencing both handoffs; with that record present,
      `mix agov.session.resume --base-branch main` no longer reported seq 327
      or seq 329 as pending.

      This is distinct from L015. L015 concerns duplicate sequence numbers and
      branch-local coordination collisions before or during merge. L016
      concerns post-merge queue hygiene: a handoff can be schema-valid,
      correctly reviewed, and merged, yet remain operationally pending until a
      later resolver record closes it.
    framework_impact: medium
    status: proposed
    recommendation: >
      Add a lightweight merge/push guardrail for handoff closure. The first
      implementation should be warn-only: after merge, and before pushing a
      branch that adds Gate 2 handoffs, run `mix agov.session.resume
      --base-branch main` or a narrower handoff-resolution check and report
      any handoff whose MR has been merged but lacks a later resolver record.
      A future tracked git hook can implement this as a pre-push or post-merge
      check, but it must chain existing Git LFS hooks safely and remain
      advisory until the rule authority for blocking behavior is explicit.

  - id: L017
    date: "2026-06-14"
    category: gap
    agents_involved: [planner-architect, coder-tester, governor-reviewer]
    summary: >
      Sequential coordination sequence numbers cannot be safely allocated by
      concurrent agents without a shared counter; time-sortable unique identifiers
      eliminate the structural collision problem.
    detail: >
      On 2026-06-14, two agents independently chose seq 320 for different
      coordination messages during parallel sessions: coder-tester filed a
      Gate 1 handoff for the CI/CD adopter packaging plan; planner-architect
      filed a note on the two-tooling strategy decision. Both files were valid
      individually. When the local branch was rebased onto the remote, an
      add/add conflict on `00320-planner-architect.md` required manual
      intervention.

      The repair required: choosing which file to keep at the colliding
      filename, renumbering the other to seq 337, updating all `references-to`
      fields that cited the old filename, restoring the remote's version of
      `00320-planner-architect.md` that was accidentally deleted by the rename
      commit, and reverifying the channel state with `mix agov.session.resume`.
      Total cost: approximately one hour of careful git surgery.

      The existing design acknowledged this failure mode. `docs/coordination/README.md`
      stated "Sequence collisions are valid. When two agents write at the same
      sequence, both files are authoritative." The coordination visibility scanner
      (`mix agov.coord.visibility`) was built to detect collisions. L015 recommended
      that agents check the current highest sequence before filing.

      None of these mitigations prevent the collision. They detect it after the
      fact and require human repair. The root cause is structural: sequential
      integers require a shared counter to allocate safely. In an async
      multi-agent system with no shared counter, discipline-based collision
      avoidance is unreliable. Any two agents working from independently cached
      channel states will eventually converge on the same next integer.

      The structural fix is to replace sequential integers with time-sortable
      unique identifiers that agents generate independently without coordination.
      ULID (Universally Unique Lexicographically Sortable Identifier) was chosen:
      26-char Crockford base32, 48-bit millisecond timestamp prefix. Properties:
      - Collision-proof: probability of two agents generating the same ULID in
        the same millisecond is astronomically small (~1 in 2^80).
      - Sortable: lexicographic order = creation-time order; no loss of the
        temporal ordering the seq prefix provided.
      - Short: 26 chars, shorter than UUID (36 chars), embeds timestamp for
        human inspection of the first 10 chars.

      A secondary insight emerged: the `references-to` field in coordination
      front matter already uses filenames as stable node identifiers, not seq
      integers. The channel was already a directed graph in structure; the only
      missing property was that its node identifiers (filenames) needed to be
      collision-proof. ULID-based filenames complete the design that
      `references-to` began.

      This learning is related to L015 but proposes a different resolution.
      L015's recommendation (agents check highest seq before filing) addresses
      the symptom with process discipline. L017's recommendation addresses the
      cause with structural change.
    framework_impact: high
    status: proposed
    recommendation: >
      Replace sequential `seq`-based coordination filenames with ULID-based
      filenames (`<ulid>-<role>.md`). The `seq` field in front matter becomes
      optional (existing files stay valid); a new `id` field (ULID string)
      replaces it for new messages. Tooling sorts by the `timestamp` front
      matter field (ISO 8601 sorts lexicographically) rather than by filename
      prefix, unifying old and new formats in a single channel.

      The `references-to` field already uses filenames as references; no change
      to the graph protocol is needed. The "Sequence collisions are valid"
      documentation note becomes obsolete and should be removed.

      The collision detection in `mix agov.coord.visibility` should be retained
      for old-format files but will be structurally unreachable for ULID-named
      files. The `mix agov.coord.brief` template generator should emit `id: <ulid>`
      instead of `seq: <n>`. The session.resume display of pending handoffs
      should show the first 8 chars of the ULID (which encode the timestamp)
      rather than the seq integer.

      Implementation plan: `docs/plans/coordination-ulid-migration.md`.
      Gate 1 handoff: seq 341.

  - id: L018
    date: "2026-06-23"
    category: gap
    scope: framework
    title: >-
      Polling timers must be restarted immediately after session boundary events
      to avoid silent gaps in coordination visibility
    agents_involved: [governor-reviewer]
    summary: >
      After a session boundary — context compaction (/compact), session restart,
      or context-window exhaustion — all ScheduleWakeup timers are lost silently.
      Without explicit restart on resumption, coordination messages and MRs filed
      during the gap are missed.
    detail: >
      On 2026-06-23, Codex filed a handoff (requires-ack: true, to
      planner-architect) approximately 10 minutes after the governor-reviewer
      completed Gate 2 approval. The message was already on origin/main when
      the governor-reviewer polled, but was not detected because the polling
      fetch had already run and the 20-minute scan window was not re-checked
      in that cycle. The human user had to point it out.

      More structurally: after context compaction earlier in the same session,
      the governor-reviewer's ScheduleWakeup timers were silently dropped. The
      human user manually restarted the polling prompt each time (supplying the
      full context and steps), which is the correct workaround — but it places
      the continuity burden on the human rather than on the agent.

      This is distinct from L011, which describes a timer that misses files
      already present when the timer arms. This learning describes a
      session-boundary gap: the timer does not exist at all after /compact, so
      no baseline is printed and no future deltas are reported until the timer
      is explicitly re-armed. The two gaps compound: a session that ends mid-poll
      interval and resumes without re-arming silently drops both the baseline
      and the interval.

      In a multi-agent async system, the gap between session end and timer
      restart may span minutes to hours depending on human availability.
      Coordination messages filed during the gap are only discovered if a human
      intervenes.
    framework_impact: medium
    status: accepted
    severity: significant
    business_impact:
      type: cost_overhead
      description: >
        Missed coordination messages require human intervention to surface,
        adding latency to governance handoffs and increasing the human
        operator's monitoring burden.
    recommendation: >
      1. On every session resumption after /compact, restart, or compaction:
         immediately run a wide-window branch scan (--since="2 hours ago" or
         the time since the last known poll) and check open MRs before doing
         anything else.

      2. Restart a ScheduleWakeup timer as the final step of cold-start
         protocol, using the same polling prompt that was active before the
         session ended. Store the prompt text in persistent memory (e.g.,
         MEMORY.md) so it can be re-armed without reconstructing it from
         conversation history.

      3. Widen the lookback window in the first post-resumption poll. The
         standard interval window (e.g., 15-20 minutes) is appropriate for
         mid-session polls but too narrow for post-compaction re-orientation.
         Use at least 2× the session's scheduled interval as the first-poll
         lookback.

      4. The cold-start protocol must list timer restart as an explicit
         mandatory step, not implied by "check for new coordination messages."
         The distinction matters: checking once is orientation; scheduling a
         wakeup is continuity.

      5. Gate-review sessions with a named polling prompt should record that
         prompt in memory at the start of the session, so any future
         resumption can re-arm it without human-supplied context.

