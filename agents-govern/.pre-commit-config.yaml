# Pre-commit hooks for agents-govern.
# Install: pip install pre-commit && pre-commit install
# Manual:  pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: validate-learnings
        name: Validate learning record anonymization
        entry: uv run agov-validate-learnings
        language: system
        files: '^learnings/.*\.ya?ml$'
        exclude: '^learnings/_template\.yaml$'
        pass_filenames: true

      - id: validate-agents
        name: Validate agent definitions (structure + cross-agent consistency)
        entry: uv run agov-validate-agents
        language: system
        files: '^agents/.*\.ya?ml$'
        pass_filenames: false
        always_run: true

      - id: validate-acronyms
        name: Validate acronyms are expanded on first use per markdown file
        entry: uv run agov-validate-acronyms
        language: system
        files: '\.md$'
        pass_filenames: true

      - id: pytest
        name: Run unit tests
        entry: uv run --group test pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
