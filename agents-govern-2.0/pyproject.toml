[project]
name = "agents-govern"
version = "0.26.0"
description = "Validation and distribution tools for the agents-govern framework"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE-MIT"]
authors = [
    { name = "Jani Päijänen", email = "jani.paijanen@protonmail.com" },
]
maintainers = [
    { name = "Jani Päijänen", email = "jani.paijanen@protonmail.com" },
]
dependencies = [
    "pyyaml>=6.0",
    "graphviz>=0.20",
]

[project.scripts]
agov = "agents_govern.cli:main"
agov-validate = "agents_govern.orchestrator:main"
agov-validate-learnings = "agents_govern.validate_learnings:main"
agov-validate-infosec = "agents_govern.validate_infosec:main"
agov-validate-agents = "agents_govern.validate_agents:main"
agov-validate-readme-stats = "agents_govern.validate_readme_stats:main"
agov-validate-acronyms = "agents_govern.validate_acronyms:main"
agov-validate-adoption = "agents_govern.validate_adoption:main"
agov-validate-contributions = "agents_govern.validate_contributions:main"
agov-validate-binding = "agents_govern.validate_binding:main"
agov-validate-framework-config = "agents_govern.validate_framework_config:main"
agov-pre-tag-check = "agents_govern.pre_tag_check:main"
agov-validate-tag-push = "agents_govern.validate_tag_push:main"
agov-dist = "agents_govern.dist:main"
agov-bump = "agents_govern.bump_version:main"
agov-health = "agents_govern.health:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    # Schema-parity tests (C1 — issue #59) load each `schemas/*.schema.json`
    # via the jsonschema library and assert the framework's own artefacts
    # (agents/*.yaml, learnings/*.yaml) validate against them. Test-only
    # dependency: adopters consuming the schemas pick their own
    # validation library (editor plugins, OPA, alternative CI stacks).
    "jsonschema>=4.0",
]
docs = [
    # Pin major versions: MkDocs 2.0 is announced as backward-incompatible
    # (will break plugins, themes, and configs). Stay on 1.x until we've
    # evaluated the migration path on actual evidence rather than vendor
    # warnings (see also DISABLE_MKDOCS_2_WARNING in .gitlab-ci.yml pages job).
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocs-awesome-pages-plugin>=2.9,<3",
    "mkdocs-gen-files>=0.5,<1",
    "pymdown-extensions>=10.7,<11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_govern"]
