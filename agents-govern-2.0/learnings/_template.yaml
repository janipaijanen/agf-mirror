# =============================================================================
# Project Learning Record
# =============================================================================
# Copy this file to learnings/<codename>.yaml when a project adopts
# the framework. Fill in the context section once, update agent configuration
# and learnings as the project evolves.
#
# See LEARNINGS.md for how this feeds back into framework revisions.
# =============================================================================
#
# *** ANONYMIZATION POLICY (MANDATORY) ***
#
# Do NOT use real project, product, or organisation names anywhere in this
# file. Choose a codename (e.g., "blue-heron", "project-aurora") and use it
# consistently. This protects adopters' commercial interests and keeps the
# public learning corpus free of identifying information.
#
# What to mask:
#   - Project / product names
#   - Organisation / company names
#   - Internal tool or service names that reveal the adopter
#   - Customer or partner names
#   - URLs, hostnames, or infrastructure identifiers
#
# What to keep as-is (these are useful for cross-project analysis):
#   - Business domain (fintech, healthcare, etc.)
#   - Technology stack (Python, React, etc.)
#   - Regulatory frameworks (GDPR, SOC2, etc.)
#   - Team size ranges
#   - Generic architecture descriptions
#
# Keep a private mapping between the codename and the real project name
# in your own records. See learnings/.adopter-mapping.example for the format.
# =============================================================================

# ---- Project Context (set once, update if fundamentals change) ----

project:
  codename: ""                # MANDATORY: a pseudonym, NOT the real name (e.g., "blue-heron")
  description: ""             # one sentence: what the software does — no real names
  started_adopting: ""        # date the framework was adopted (YYYY-MM-DD)

# ---- Framework & Agent Identifiers (set at adoption, update on upgrades) ----

adoption:
  framework_id: "agents-govern"
  framework_version: ""       # version of framework.md adopted (e.g., "0.4.0")
  framework_commit: ""        # git commit hash of the framework repo at adoption
  agent_definitions:          # which agent definitions were copied, with versions
    - id: ""                  # e.g., "agents-govern:planner-architect:0.2.0"
      local_path: ""          # relative path only — do not reveal org-specific directory structures
      customized: false       # true if the project modified the definition
      customization_notes: "" # what was changed and why
  upgrade_history:            # record each time the project upgrades to a newer framework version
    - date: ""                # YYYY-MM-DD
      from_version: ""       # previous framework version
      to_version: ""          # new framework version
      agent_changes: []       # which agent definitions were updated
      notes: ""               # what changed, any migration steps taken

business_domain:
  primary: ""                 # e.g., fintech, healthcare, e-commerce, developer-tools, education
  secondary: []               # additional domains if applicable

regulatory_context:
  frameworks: []              # e.g., [GDPR, SOC2, HIPAA, PCI-DSS, none]
  data_residency: ""          # e.g., "EU-only", "multi-region", "no constraints"
  notes: ""                   # any relevant compliance context

team:
  size: 0                     # number of people involved
  roles: []                   # e.g., [developer, designer, ops, product-owner]
  ai_agents_used: []          # e.g., [Claude, GPT, custom-orchestrator]

lifecycle_state:
  current: ""                 # greenfield | early-development | scaling | legacy-migration | maintenance
  target: ""                  # where the project is heading (e.g., "SaaS launch", "enterprise rollout")

customer_state:
  current: ""                 # pre-customer | internal-only | beta | paying | enterprise
  user_count_range: ""        # e.g., "0", "1-100", "100-10k", "10k+"

revenue_context:
  stage: ""                   # pre-revenue | early-revenue | profitable | scaling
  model: ""                   # e.g., SaaS-subscription, usage-based, licence, open-core

codebase:
  languages: []               # e.g., [Python, TypeScript, Go]
  test_coverage_percent: 0    # rough estimate at time of adoption
  ci_cd: ""                   # e.g., "GitHub Actions", "GitLab CI", "none"
  documentation_state: ""     # minimal | adequate | comprehensive — see docs/concept/documentation-maturity.md for criteria
  pii_present: false          # does the codebase handle PII today?

