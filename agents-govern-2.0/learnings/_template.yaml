# ---- Agent Configuration (update as it evolves) ----

agent_configuration:
  # Record each configuration change as a dated entry
  history:
    - date: ""                # YYYY-MM-DD
      phase: 1                # which growth phase (1-5)
      active_agents:
        - name: ""            # e.g., "planner-architect"
          played_by: ""       # who or what plays this role
      combined_agents:
        - names: []           # e.g., ["planner", "architect"]
          reason: ""          # why still combined
      cross_cutting_active:
        - name: ""            # e.g., "data-guardian"
          activated_as: ""    # Activation modes (from least to most automated):
          #                   #   "manual-review"        — human applies ad-hoc (no trigger)
          #                   #   "checklist-in-governor" — governor applies at Gate 2 (relies on governor discipline)
          #                   #   "gate-triggered-review" — automated trigger at defined gate (MR creation, pre-merge hook)
          #                   #   "standalone-agent"      — dedicated agent with own jurisdiction (Phase 2+)
          #                   #
          #                   # Migration from prior values:
          #                   #   "per-change" (iron-gate) → use "checklist-in-governor" or "gate-triggered-review"
          #                   #   "standalone" → use "standalone-agent"
      skipped_agents:
        - name: ""            # e.g., "localizer"
          reason: ""          # why skipped (e.g., "single-locale product")

# ---- Environment Configuration ----

environments:
  - name: ""                  # e.g., "development", "staging", "production"
    exists: false             # does this environment exist?
    policy_level: ""          # relaxed | moderate | strict | maximum
    pii_allowed: false        # is real PII present in this environment?
    notes: ""

# ---- Learnings (accumulated over time) ----
# Each learning is a dated entry. Add new entries; do not modify old ones.
# Tag each with a category: gap | overkill | validation | adaptation | tension
#
# Categories at a glance:
#   gap          — the framework didn't catch a real failure mode
#   overkill     — the framework's discipline cost more than the value it delivered
#   validation   — empirical confirmation a framework rule worked
#   adaptation   — a project-specific tweak adopters apply locally
#   tension      — a resolved cross-layer conflict (rule vs agent, agent vs
#                  agent, learning vs rule)
#
# *** MANDATORY: cross-layer conflict resolutions are recorded with
# `category: tension` (action-plan item P2 / issue #70, shipped v1.1.47).
# When a rule and an agent definition conflict, when two agents claim
# overlapping jurisdiction, or when a learning's recommendation collides
# with a shipped rule, the resolution lands as a `tension` entry that
# names the layers involved and the precedence applied. See
# docs/concept/principles.md#tension-recording for the canonical home.
#
# Two optional fields are validated when present (issues L1, L2):
#   - superseded_by: forward-pointer to a later entry's title in this same
#     file. The superseding entry must appear AFTER this one in file order
#     (append-only invariant). Use when a later entry corrects, refines, or
#     supersedes this one without modifying its text.
#   - confidence: ordinal level + optional quantitative companions. See
#     the schema example after the entry block below.

learnings:
  - date: ""                  # YYYY-MM-DD
    category: ""              # gap | overkill | validation | adaptation | tension
    scope: "framework"        # framework = may inform framework changes; project = project-specific only
    title: ""                 # short summary (one line) — also serves as supersession key
    description: ""           # what happened, in enough detail to be useful
    agents_involved: []       # which agents were relevant
    framework_section: ""     # which framework.md section is relevant
    business_impact:
      type: ""                # prevented_loss | enabled_revenue | cost_overhead | neutral
      description: ""         # what the impact was, qualitatively
    recommendation: ""        # what should change in the framework, if anything
    severity: ""              # critical | significant | minor | informational

    # Optional: forward-pointer to a later entry's title that supersedes this
    # one. The target entry must appear AFTER this one in file order. The
    # text of THIS entry is never modified — only this metadata pointer.
    # superseded_by: "title of the later entry that corrects/refines this one"

    # Optional: confidence ordinal + quantitative companion. Operational
    # confidence ("in projects matching this learning's scope, how likely
    # is this guidance to apply correctly?") — distinct from severity
    # (impact) and from framework-level maturity (corpus-level evidence).
    # confidence:
    #   level: ""               # single-adopter | multi-adopter | longitudinal | industry-corroborated
    #   evidence_count: 0       # optional integer; required for multi-adopter / longitudinal
    #   evidence_refs:          # optional list of learning record IDs
    #     - "codename:YYYY-MM-DD"
    #
    # Consistency rule: levels multi-adopter and longitudinal require
    # either evidence_count >= 2 or evidence_refs of length >= 2.

# ---- InfoSec Sentinel Acknowledgments (add when required by CI) ----
# When the infosec-sentinel flags a potential information leak, the CI
# pipeline blocks until each finding has a corresponding entry here.
# Run: uv run agov-validate-infosec learnings/<codename>.yaml
#
# Finding IDs are per-file: ISEC-*-001 resets to 001 for each file.
# Adding or removing other files will NOT renumber your existing acks.
#
# sentinel_ack:
#   - finding_id: ""          # from CI output, e.g., "ISEC-CROSSFIELD-001"
#     acknowledged_by: ""     # name of the human who reviewed
#     date: ""                # YYYY-MM-DD
#     decision: ""            # accept_risk | apply_redaction | will_redact | false_positive
#     rationale: ""           # why this is acceptable / what was changed
#
# Decisions:
#   accept_risk      — human reviewed, safe to publish as-is
#   apply_redaction  — human approves sentinel's suggested redaction;
#                      artifact owner (submitter/documentation-writer/coder-tester) applies it
#   will_redact      — human will manually redact differently from the suggestion
#   false_positive   — the detection was wrong
#
# For credential findings (ISEC-CRED-*), accept_risk is NOT allowed.
# Credentials must be removed.
