# SPDX-License-Identifier: CC-BY-SA-4.0
# agents-govern v2.0 — documentation and validation pipeline
#
# Scope (structural phase, coordination seq 107):
#   - governance validators (agents, learnings)
#   - HTML site build (MkDocs, strict) + GitLab Pages publish
# Deferred to their own gated slices: figures-build (Graphviz),
# paper-pdf-build (Pandoc -> TeX -> latexmk).
#
# While v1.x is canonical, this file is NOT the repository root pipeline.
# It is promoted (or included from the root) only when v2.0 is promoted;
# until then it changes no v1.x release behaviour.

stages:
  - validate
  - build
  - deploy

# Pinned image per security-hardening rule (no floating tags).
default:
  image: python:3.14-slim

validate-governance:
  stage: validate
  script:
    - pip install --no-cache-dir .
    - agov-validate-agents
    - agov-validate-learnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "agents/**/*"
        - "learnings/**/*"
        - "schemas/**/*"
        - "src/**/*"
        - "pyproject.toml"
        - ".gitlab-ci.yml"
    - if: $CI_COMMIT_TAG

site-html-build:
  stage: build
  script:
    - pip install --no-cache-dir mkdocs==1.6.1
    - mkdocs build -f docs/build/mkdocs.yml --strict --site-dir ../../public
  artifacts:
    paths:
      - public/
    expire_in: 2 weeks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "docs/site/**/*"
        - "docs/build/**/*"
        - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - test -d public
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - site-html-build
