# Rule-trigger recall corpus (foundry-local).
# Plan: docs/plans/20261023T140050Z-rule-trigger-recall-corpus.md (Gate 1: 20261023T144257Z-governor-reviewer-zc0p).
#
# Each scenario states a situation. The agent is asked which rule file it reads first.
# `accept` lists the rule path for the scenario's rule. For kind `negative` the scenario
# PASSES when the answer is NOT in `accept` (the rule must not be chosen).
# `high` consequence = security, gate, release, delegation and coordination-integrity rules.
#
# Authors: planner-architect wrote the direct, paraphrase and negative scenarios below.
# The hold-out quarter (13 scenarios, kind near-boundary, one per rule, `holdout: true`,
# `author: coder-tester`) is authored by coder-tester and is not read when editing trigger
# lines. It is added by coder-tester in a separate commit on this MR.

