  ai_landing_loaders:
    disposition: not applicable
    reason: >-
      The obligation is operator and CI release procedure, not assistant
      cold-start behavior. No AGENTS.md, agf/templates/AGENTS.md,
      .claude/CLAUDE.md, or specialist agent definition changes. An
      assistant performing a release already reaches the owner rule and
      the release skill through the existing release workflow pointers;
      this change adds no new authority or duty an assistant must be told
      about at landing.
    not_applicable:
      - path: AGENTS.md
        reason: >-
          No cold-start behavior change; the release workflow is reached
          through the existing skill and rule, which are updated in place.
      - path: agf/templates/AGENTS.md
        reason: >-
          Same; the adopter loader inherits the updated owner rule and
          release skill without new landing prose.
      - path: .claude/CLAUDE.md
        reason: >-
          Imports root AGENTS.md; no copied prose and no new pointer
          needed for an operator/CI procedure.

  validation_drift_evidence:
    disposition: implemented
    paths:
      - tooling/rust/crates/agov/src/release_namespace.rs
      - tooling/rust/crates/agov/tests/release_namespace.rs
      - tooling/rust/crates/agov/tests/ci_needs_implication.rs
      - tooling/rust/scripts/release-namespace-check.sh
    reason: >-
      The canonical agov release namespace-check CLI and its read-only CI
      adapter share all namespace logic. The CLI tests use the actual OCI
      helper and an HTTP stub to prove the operator stop without live tags.
      The release:namespace-check CI job, placed on the
      release-metadata MR / pre-tag pipeline only (an absence check cannot
      block the tag pipeline it is itself triggered by — 7dba RUW4-F1),
      mechanically enforces the obligation and is the primary drift
      evidence. The gate-self-test-rule negative test in the implementation
      MR proves a pre-existing object in each governed namespace stops the
      standard path before any immutable tag, and exercises the operator
      pre-push stop as well as the CI stop. The operator's reversible-
      preflight run AND immediate pre-push recheck are MANDATORY workflow
      obligations, not advisory — a non-absence or ambiguity result at
      either stops tag publication (3dkt RUW4-CA2). There is no automated
      enforcement at the tag-push moment, which is a mechanism gap, not a
      requirement-strength downgrade. Any post-tag CI job verifies
      consistency / non-overwrite, not namespace absence. Named authority:
      the CI check's blocking clause added to
      release-via-merge-request-rule.md.

  distribution:
    disposition: updated
    paths:
      - agf/rules/workflow/release-via-merge-request-rule.md
      - agf/skills/release/SKILL.md
      - agf/docs/site/docs/operate/review-and-release.md
    reason: >-
      The owner rule, the release skill, and the operator release page all
