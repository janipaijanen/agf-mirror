plan_id: 20260907T172745Z-issue120-standard-path-namespace-absence
issue: 120

changed_pages_or_runbooks:
  - agf/docs/site/docs/operate/review-and-release.md
  - agf/skills/release/SKILL.md

surfaces:
  normative_owner:
    disposition: updated
    stage: existing
    path: agf/rules/workflow/release-via-merge-request-rule.md
    reason: >-
      The existing release rule is the single owner. The change adds one
      checklist item to "## What the MR MUST verify" and a new
      "Pre-tag namespace-absence obligation (standard path)" subsection
      stating the four-namespace absence-proof set (Git tag, GitLab
      Release, generic package across every status paginated fully, exact
      helper-derived OCI reference), its fail-closed semantics, and the
      explicit clause granting the new CI check blocking authority per
      always/tool-authority-boundary-rule.md. No new owner file is
      created; the maintenance-line and frozen-scope-reconstruction
      exceptions are unchanged.

  adopter_facing_explanation:
    disposition: updated
    path: agf/docs/site/docs/operate/review-and-release.md
    reason: >-
      The operator release page gains a short paragraph explaining that
      every release now proves the four target namespaces are unoccupied
      before an immutable tag is pushed, that a pre-existing object stops
      the release, and links the owner rule. It does not restate the
      normative requirement in rule language.

  runbook_situation_map:
    disposition: updated
    paths:
      - agf/skills/release/SKILL.md
    reason: >-
      The release skill gains one step: run the namespace-absence check
      in the reversible preflight and again immediately before the tag
      push, expecting result=ABSENT for all four namespaces. Expressed as
