surfaces:
  normative_owner:
    disposition: updated
    stage: planned
    path: agf/rules/always/improvement-propeller-rule.md
    reason: >-
      One new rule owns the improvement-propeller operating contract. MR
      !2405's universal-polling-and-autonomous-continuation rule separately
      owns the all-assistant 10-to-15-new-learning capability-review trigger;
      the Propeller rule carries only a pointer to it. The role definition,
      startup loaders, Pages, runbook, and skill point to this owner and do not
      become competing authorities. The
      owner does not exist before Gate 1, so its lifecycle is explicitly
      planned and must transition to existing before strict Gate 2 validation.

  adopter_facing_explanation:
    disposition: updated
    path: agf/docs/site/docs/adopt/applicability-catalog.md
    reason: >-
      The applicability catalog is where adopters decide which optional roles
      to instantiate. It will explain when improvement-propeller is useful,
      distinguish it from capability-developer and planner-architect, state
      that activation is optional and human-governed, and point to the
      canonical rule rather than restating its full contract.

  runbook_situation_map:
    disposition: updated
    paths:
      - agf/docs/site/docs/operate/day-to-day.md
      - agf/docs/site/docs/operate/runbook.md
      - agf/skills/capability-review/SKILL.md
    reason: >-
      Day-to-day guidance will expose the safe-boundary 10/15-learning check;
      the runbook will cover weekly propulsion, bounded friction synthesis,
      quiet/no-change runs, cursor recovery, and pause/deactivation; and the
      capability-review skill will record the terminal learning cursor/count
      that defines the next threshold window. Each is procedural guidance with
      a pointer back to the single normative owner.

  ai_landing_loaders:
    disposition: updated
    paths:
      - AGENTS.md
      - agf/templates/AGENTS.md
    reason: >-
      Root and adopter AGENTS.md gain concise role-discovery pointers to the
      canonical Propeller rule. MR !2405 exclusively owns the separate compact
      10/15-learning startup duty in both AGENTS.md files and every shipped
      specialist definition; this manifest deliberately does not duplicate
      those specialist paths. The new propeller role and its Claude rule
      projection do not yet exist and therefore are added to this paths list
      only at Gate 2, when strict projection validation must resolve them.
    not_applicable:
      - path: .claude/CLAUDE.md
        reason: >-
          This project loader is a one-line import of root AGENTS.md and will
          inherit the updated startup obligation without copied prose.
      - path: agf/templates/CLAUDE.md
        reason: >-
          The adopter Claude template imports its sibling AGENTS.md, so the
          distributable obligation is projected through that canonical loader.

  validation_drift_evidence:
    disposition: advisory only
    reason: >-
      Existing assistant-loader and strict agent validation are the named
      mechanical authorities for loader integrity, role identity, verb
      uniqueness, and communications. MR !2405 separately owns any fixture
      needed to prove that every shipped specialist contains its compact
      learning-trigger pointer. Proposal quality, deduplication, anti-ceremony
      reasoning, and whether a learning is valid remain human-review judgments
      exercised by this plan's table-top cases, not new blocking heuristics.

  distribution:
    disposition: updated
    paths:
      - agf/templates/AGENTS.md
      - agf/docs/site/docs/adopt/applicability-catalog.md
      - agf/docs/site/docs/operate/day-to-day.md
      - agf/docs/site/docs/operate/runbook.md
      - agf/skills/capability-review/SKILL.md
    reason: >-
      The listed adopter-facing template, Pages, runbook, and skill already
      ship under the AGF distribution manifest and
      will be changed in place. Before Gate 2 this row must also name and prove
      distribution of the newly created role, canonical rule, and Claude rule
      projection. Root AGENTS.md is project-local and intentionally does not
      ship; it is validated as an AI landing surface above.
