      One new rule owns both the improvement-propeller operating contract and
      the universal 10-to-15-new-learning capability-review trigger. The role
      definition, startup loaders, specialist definitions, Pages, runbook, and
      skill point to this owner and do not become competing authorities. The
      owner does not exist before Gate 1, so its lifecycle is explicitly
