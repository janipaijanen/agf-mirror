      via `agov plan validate` is the existing, already-named blocking
      mechanism; there is no separate new-check-authority question to
      resolve.

  adopter_facing_explanation:
    disposition: not applicable
    reason: >-
      Internal governance tooling (a schema enum value and a schema-level
      allOf/if/then conditional; no Rust validator change -- corrected
      per round-2 audit pgsh, which caught this reason still describing
      the withdrawn Rust-check design). No adopter-facing Pages page
      describes advisory-consultation status semantics at this level of
      detail.

