      decision exists, the separate release plan is Gate 1-approved,
      the diff is truly metadata-only, all four namespaces are
      independently absent, retained refs are proven post-merge via
      live API reads — is semantic, evidence-based governor/reviewer
      judgment at each future release, not something a validator can
      decide from this manifest. No new mechanical validator is
      introduced by this plan; none is claimed here.

  distribution:
    disposition: confirmed
    paths:
      - agf/rules/workflow/release-via-merge-request-rule.md
      - agf/rules/workflow/branch-and-worktree-rule.md
      - agf/docs/site/docs/operate/review-and-release.md
