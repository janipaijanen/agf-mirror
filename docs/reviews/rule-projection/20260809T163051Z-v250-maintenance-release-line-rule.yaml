  ai_landing_loaders:
    disposition: updated
    paths:
      - .claude/rules/workflow/release-via-merge-request-rule.md
      - .claude/rules/workflow/branch-and-worktree-rule.md
    reason: >-
      Foundry's own active local projections of the two canonical
      rules updated with the same maintenance-line contract and
      contradiction fix as their agf/rules/ owners, each carrying an
      explicit "Canonical owner" pointer line so the projection is not
      mistaken for a second, competing normative source.
    not_applicable:
      - path: AGENTS.md
        reason: >-
          Already points generically to `agf/rules/workflow/` for
          "branching, releases, code review" content (line 85 of
          agf/templates/AGENTS.md's role-directory table, mirrored in
          this repo's own AGENTS.md) without enumerating individual
          rules. A new section inside an existing rule file needs no
          new pointer.
      - path: agf/templates/AGENTS.md
        reason: >-
          Same generic directory-level pointer as AGENTS.md; ships
          unchanged to adopters, who reach this rule's content the
          same way they reach every other workflow rule.
      - path: .claude/CLAUDE.md
        reason: >-
          Does not exist in this repository. Foundry's own
          assistant-loading path is AGENTS.md plus .claude/rules/
          (loaded directly by the tool), not a CLAUDE.md pointer file.

  validation_drift_evidence:
    disposition: not mechanically decidable
    path: agf/rules/workflow/release-via-merge-request-rule.md
    reason: >-
      `agov plan projection-check --base-ref origin/main` mechanically
      validates this manifest file's own shape: all six rows present,
      every actually-changed Pages/runbook file declared, every
      declared path resolves. Whether the maintenance-line eligibility
