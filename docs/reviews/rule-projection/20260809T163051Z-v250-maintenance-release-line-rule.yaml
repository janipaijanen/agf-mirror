      target/source requirements, tag/publication rules, and
      metadata-forward synchronization procedure. The standard
      workflow section above it is unchanged. All other surfaces below
      point to or summarize this contract; none redefine it.

  adopter_facing_explanation:
    disposition: updated
    path: agf/docs/site/docs/operate/review-and-release.md
    reason: >-
      Added a "Releases: the maintenance-line exception" section
      immediately after the standard immutability-discipline section,
      explaining when the exception applies (a previously published
      immutable candidate promoted after the default branch has moved
      on) and linking to the canonical rule for the mechanical
      contract rather than restating it. States plainly that most
      adopters will never need this path.

  runbook_situation_map:
    disposition: updated
    path: agf/skills/release/SKILL.md
    reason: >-
      Added "Step 0 — Confirm topology (fail-closed to standard)"
      before the existing Step 1. It lists the three preconditions
      (binding governor decision, separately Gate 1-approved release
      plan, metadata-only change set) and explicitly instructs
