# Six-surface projection evidence for issue #132 (export the Improvement
# Propeller method as a skill), per
# agf/rules/workflow/documentation-rule-projection-rule.md.
#
# Gate 1 stage: agf/skills/improvement-propeller/SKILL.md does not exist yet
# (implementation follows Gate 1 approval), so this manifest lists only
# currently-existing paths. Per documentation-rule-projection-rule.md's own
# "plan or Gate 2 review" framing, the SKILL.md path itself is added to
# changed_pages_or_runbooks and surfaces.distribution.paths in a Gate 2
# revision of this same file, once the file exists.

plan_id: 20260918T185610Z-issue132-improvement-propeller-skill
issue: 132
changed_pages_or_runbooks:
  - agf/skills/README.md

surfaces:
  normative_owner:
    disposition: existing pointer sufficient
    path: agf/rules/always/improvement-propeller-rule.md
    reason: >-
      Unchanged by this plan. The new skill is a thin, human-invoked
      operational wrapper around this rule's Weekly opportunity lane and
      Slow governance-friction lane evidence/ranking shape. It states the
      rule as its single normative owner in its first paragraph and does
      not restate the rule's activation contract, cursor/recovery
      semantics, or role-boundary text.

  adopter_facing_explanation:
    disposition: not applicable
    reason: >-
      The skill file itself is the operational artifact an adopter reads
      and runs; there is no separate adopter-facing Pages explanation of
      "what the Improvement Propeller skill is" distinct from the skill
      file and the rule it points to. No existing Pages page describes
      Propeller skill usage that would need updating.

  runbook_situation_map:
    disposition: updated
    path: agf/skills/README.md
    reason: >-
      Adds one row to the "Available skills" table naming
      improvement-propeller/SKILL.md and a one-line description, following
      the existing table's format exactly. Does not duplicate the skill's
      procedure content. The table's pre-existing staleness is explicitly
      not backfilled by this plan (see the plan's "Pre-existing gap
      observed" section) -- only the new row is added.

  ai_landing_loaders:
    disposition: not applicable
    reason: >-
      Skills are discovered by an agent reading agf/skills/ directly, per
      agf/skills/README.md's own "Adoption" section ("Ask your assistant
      to read the skills it needs from agf/skills/"). No AGENTS.md,
      agf/templates/AGENTS.md, or .claude/CLAUDE.md pointer text names
      individual skills by path today, so none requires a new entry for
      this one skill.

  validation_drift_evidence:
    disposition: advisory only
    reason: >-
      No automated content validator exists for any of the eight current
      skills (all are Markdown procedure definitions, not executable
      code or schema-governed files). This plan does not introduce one,
      consistent with existing skills. The check is contribution-auditor's
      Gate 2 review, confirming the skill does not restate or fork the
      rule's normative text and correctly attributes its disclaimer
      language. Named authority: this plan and its Gate 2 review.

  distribution:
    disposition: implemented
    paths:
      - agf/skills/README.md
    reason: >-
      agf/skills/** is a listed glob in agf/dist/release-manifest.yaml,
      so agf/skills/README.md ships in the AGF distribution archive as
      part of the framework tree; no skill-specific packaging step
      exists today for any of the eight current skills. The new skill
      ships the same way once merged to main. Repository-root README.md
      is NOT a distribution surface (it is not matched by any glob in
      agf/dist/release-manifest.yaml; per
      docs/documentation-audience-rule.md it targets developers working
      in this checkout, not adopters of the shipped distribution). Its
      "8 skills" count (line 164) still needs updating to 9 as ordinary
      repo maintenance -- tracked in the plan's Affected files table --
      but that update is out of this six-surface screen's distribution
      row, which concerns only what ships in the release archive.
