# Six-surface projection evidence for the gate-change-discipline plan
# (docs/plans/20260829T211252Z-gate-change-discipline.md), per
# agf/rules/workflow/documentation-rule-projection-rule.md.
#
# The governed change: gate mechanics become ineligible for the general
# fast-track waiver, and modifying a gate -- not only introducing one --
# carries a negative-test obligation. Both extend existing rules rather than
# adding a new owner.

plan_id: gate-change-discipline

changed_pages_or_runbooks:
  - agf/docs/site/docs/concepts/roles-and-gates.md
  - agf/docs/site/docs/operate/day-to-day.md
  - agf/docs/site/docs/adopt/tooling-and-tokens.md
  - agf/docs/site/docs/advanced/contracts-and-validators.md

surfaces:
  normative_owner:
    disposition: updated
    paths:
      - agf/rules/always/gate-self-test-rule.md
      - agf/rules/workflow/simplicity-rule.md
    reason: >-
      Two existing owners are extended; no new rule is created, per the
      standing preference for extending over adding ceremony.
      gate-self-test-rule.md:12 currently fires only on "introducing a new
      gate", so modifying an existing gate carries no negative-test
      obligation -- the trigger widens to introduction OR modification, and
      the same rule grants the slice-C check its blocking authority as
      required by tool-authority-boundary-rule.md.
      simplicity-rule.md:191's general fast-track waiver lists ineligibility
      as "PII, security boundaries, architecture, data model changes", with
      gate mechanics absent; it gains them, aligning it with the disqualifier
      list the same rule already applies to its narrow research fast path.

  adopter_facing_explanation:
    disposition: updated
    paths:
      - agf/docs/site/docs/concepts/roles-and-gates.md
      - agf/docs/site/docs/adopt/tooling-and-tokens.md
      - agf/docs/site/docs/advanced/contracts-and-validators.md
    reason: >-
      Line 95 states fast-track eligibility to adopters in its own words --
      "small, low-risk work (<=3 files, no shared interface, data model, or
      security boundary change, no claim conflict)". That list carries the
      identical gap as simplicity-rule.md:191: gate mechanics are absent.
      Leaving it unchanged would leave the adopter-facing page contradicting
      the rule it explains, which is the exact drift
      documentation-rule-projection-rule.md exists to catch. The page gains
      gate mechanics in that list and points at the rule rather than
      restating its body.

      Added after independent review finding GCD-4 (phe4): tooling-and-tokens.md
      and contracts-and-validators.md publish four CI sketches that copy the
      exact defective commands slice B fixes in foundry's own CI. Leaving them
      unchanged would fix foundry while continuing to instruct adopters to
      install the defect, so they are a direct impact of B rather than
      unrelated documentation work. Verifying that finding surfaced a second,
      more severe defect in the same lines that the review did not name: the
      three GitLab sketches use an unguarded
      "$CI_MERGE_REQUEST_TARGET_BRANCH_SHA" as the diff base, which foundry's
      own CI removed and documents at .gitlab-ci.yml:832-834 as empty in
      common pipeline shapes. With an empty base the range degenerates to
      HEAD...HEAD, xargs -0r declines to run, and the job exits 0 -- an
      adopter governance gate that silently validates nothing and reports
      success. Both defects are corrected in all four sketches.

      Generated site output needs no disposition: agf/site-html/ is untracked
      and rebuilt by the site-html-build job, so correcting the Markdown
      source is sufficient and nothing generated is hand-edited.

  runbook_situation_map:
    disposition: updated
    path: agf/docs/site/docs/operate/day-to-day.md
    reason: >-
      Line 88 is the session checklist item where an operator actually
      chooses between fast track and the full gate path. "Existing pointer
      sufficient" was considered and rejected: this is the surface at which
      the wrong decision gets made, so a pointer elsewhere does not reach the
      reader in time. It gains one short clause naming gate mechanics as
      never fast-track eligible, not a copy of the rule text.

  ai_landing_loaders:
    disposition: updated
    paths:
      - .claude/rules/always/gate-self-test-rule.md
      - .claude/rules/workflow/simplicity-rule.md
    reason: >-
      Both foundry-local loader projections mirror their canonical owners in
      agf/rules/ and are updated in step, so an assistant reading the
      .claude/rules/ corpus sees the same obligation as a reader of the
      canonical rule.
    not_applicable:
      - path: AGENTS.md
        reason: >-
          AGENTS.md already routes rule authority to agf/rules/ and states
          the tool-authority boundary generally; it names no fast-track
          eligibility list of its own, so there is nothing here to drift out
          of sync and nothing to project.
      - path: .claude/CLAUDE.md
        reason: >-
          This file exists but contains only "@../AGENTS.md" -- it is a
          pointer, not a content surface. It inherits any AGENTS.md change
          automatically and holds no independent statement to update.
      - path: agf/templates/AGENTS.md
        reason: >-
          The shipped adopter template routes rule authority the same way and
          states no fast-track eligibility list of its own. The adopter-facing
          statement of eligibility lives in the Pages explanation row above,
          which is updated.

  validation_drift_evidence:
    disposition: implemented
    # No paths: array at Gate 1. Every artifact below is created by this
    # plan's implementation and does not exist yet, and
    # documentation-rule-projection-rule.md limits the stage: planned marker
    # to normative_owner -- it explicitly does not relax any other surface.
    # Declaring unresolvable paths here would make the manifest assert
    # evidence that is not there. The artifacts are named in prose instead,
    # and the paths: array is added at Gate 2, when the strict
    # projection-check (without --allow-planned) must pass against them:
    #   agf/gates.yaml
    #   agf/schemas/gate-registry.schema.json
    #   tooling/rust/crates/agov-validators/src/gate_change.rs
    #   tooling/rust/crates/agov/tests/gate_change_check.rs
    #   .gitlab/scripts/governance-validate.sh
    reason: >-
      Slice C is the mechanical check, revised after independent review
      findings GCD-1, GCD-2 and GCD-3 (phe4). A declared registry
      (agf/gates.yaml, schema agf/schemas/gate-registry.schema.json) names
      each gate's exact surface paths, exact test paths, and its invocation
      (file, job name, required invocation string). The checker
      (agov gate change-check --base-ref, implemented in
      agov-validators/src/gate_change.rs) makes three assertions: a diff
      touching a registered surface must also touch that gate's declared
      tests; each registered job must still exist and still contain its
      invocation string; and every registered path must resolve, with gate
      retirement requiring an explicit retired: marker rather than deletion.

      The first draft proposed mapping git diff -U0 hunks to registered
      .gitlab-ci.yml job blocks. That is removed from blocking authority
      entirely. GCD-2 established real bypasses in this repository, which
      already uses extends, YAML anchors and aliases, !reference, hidden
      jobs, and top-level variables, so effective gate behavior can change
      with no hunk intersecting the registered block. Instead the inline
      governance script is extracted to .gitlab/scripts/governance-validate.sh,
      following the existing .gitlab/scripts/check-rust-cache-policy.sh
      convention; the script path is the registered surface and .gitlab-ci.yml
      keeps only a stable invocation covered by the invocation assertion. This
      also resolves the over-blocking risk: routine CI edits touch no
      registered surface.

      Self-protection per GCD-3: the registry, its schema, the checker, and
      the extracted script are themselves registered surfaces of a
      gate-change-check entry, so weakening the detector or deregistering a
      gate requires a test change and cannot be done silently.

      Blocking authority is granted by gate-self-test-rule.md per
      tool-authority-boundary-rule.md and is deliberately narrow: only the
      objectively decidable omissions above. Whether a test is a genuine
      negative test stays human judgment, mirroring this rule's own
      mechanical/human split.

      Stated as a limit rather than overclaimed: the check is a proxy, not
      proof. An author can satisfy the test-accompaniment assertion with an
      unrelated test-path touch, and acceptance criterion 9 requires that
      exact case to be demonstrated as a known limit rather than hidden. What
      it removes is the silent single-line path. Per gate-self-test-rule.md
      applied to itself, slice C ships with its own negative fixtures for
      deregistration, job rename, job deletion, checker mutation, and the
      unrelated-test-touch limit, plus positive cases proving it does not
      block a gate change accompanied by a real test nor a non-gate
      .gitlab-ci.yml change.

      Slices A1 and A2 are rule-text changes with no mechanism to self-test;
      their proof is slice C's demonstrations plus slice B's negative tests.

  distribution:
    disposition: updated
    paths:
      - agf/rules/always/gate-self-test-rule.md
      - agf/rules/workflow/simplicity-rule.md
      - agf/docs/site/docs/concepts/roles-and-gates.md
      - agf/docs/site/docs/operate/day-to-day.md
      - agf/docs/site/docs/adopt/tooling-and-tokens.md
      - agf/docs/site/docs/advanced/contracts-and-validators.md
    reason: >-
      Both canonical rules and all four Pages surfaces live under agf/ and
      ship in the AGF distribution artifact, so an adopter receives the rule,
      its explanation, and the corrected CI examples together -- which is the
      point of including B2 here rather than deferring it.

      agf/gates.yaml and agf/schemas/gate-registry.schema.json will also ship
      under agf/, but are deliberately absent from the paths: array above for
      the same reason given on validation_drift_evidence: they do not exist
      yet, and this manifest must not assert distribution evidence for files
      that are not there. Both are added to paths: at Gate 2, when the strict
      projection-check must pass against them. The slice-C checker ships with the
      Rust tooling under tooling/rust/, and .gitlab/scripts/governance-validate.sh
      is foundry CI infrastructure rather than shipped adopter content. The
      .claude/rules/ projections are foundry-local by design and are not
      claimed as shipped adopter content.
