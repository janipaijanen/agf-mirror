# =============================================================================
# Agent Manifest — AGF-NG project (foundry)
# =============================================================================
# This manifest records the AGF-NG/foundry project's own active roles.
# It is included as a live dogfooding example, not as a neutral adopter
# template. Adopters should create their own local role-status record before
# relying on manifest-driven tooling.
#
# Framework version: 2.5.0  |  Layout: B
# Governor-Reviewer approval required for all status changes.
# Run: agov validate agents
# =============================================================================

agents:
  planner-architect:
    status: active
    played_by: "claude (AI, claude-sonnet-4-6)"

  coder-tester:
    status: active
    played_by: "claude (AI, claude-sonnet-4-6)"

  governor-reviewer:
    status: active
    played_by: "human (Jani)"

  contribution-auditor:
    status: active
    played_by: "human (Jani) + claude (AI, at plan review)"
    notes: >
      Audits incoming proposals from AI assessment synthesis and future
      contributors. Also audits any upstream framework upgrade diffs.

  infosec-sentinel:
    status: active
    played_by: "ci (agov validate infosec, on commit)"

  build-engineer:
    status: active
    played_by: "claude (AI, CI/build and release-build work)"
    notes: >
      Activated by governor-reviewer on 2026-07-22 after duplicate branch and
      merge-request pipelines consumed avoidable runner resources. Owns CI
      configuration, build automation, build artifacts, caching, trigger
      rules, pipeline efficiency, and release-build stages. Release approval,
      tag authority, deployment, and rollback remain outside this role;
      deployment-engineer remains skipped.

  fact-checker:
    status: active
    played_by: "human (Jani) + AI advisory, for factual/docs claim review"
    notes: >
      Activated by governor-reviewer for v2.0 documentation lanes: marketing
      and evaluation copy, end-user docs, and paper/manual claims require
      explicit factual review before Gate 2.

  capability-developer:
    status: suspended
    reason: "fewer than 10 learnings; activate when patterns emerge"
    resume_when: "10+ learnings with recurring themes in foundry.yaml"

  documentation-writer:
    status: skipped
    reason: "coder-tester owns framework docs in Phase 1"

  deployment-engineer:
    status: skipped
    reason: "release process: manual version bump + changelog + git tag"

  academic-peer-reviewer:
    status: active
    played_by: "human (Jani) + AI advisory, for academic/manual review"
    notes: >
      Activated by governor-reviewer for the v2.0 paper/PDF lane and any
      academic-style claims, references, definitions, and survivability review.

  academic-visual-reviewer:
    status: skipped
    reason: "no academic publications in this project"

  web-ux-reviewer:
    status: active
    played_by: "human (Jani) + AI advisory (any model independent of the session that implemented the change under review), for public Pages site changes"
    notes: >
      Activated by governor-reviewer 2026-08-08, per
      20260808T161743Z-planner-architect-kpdj.md finding 4a (Claude/
      planner-architect Pages-rework staffing assessment): no active role
      covered web-UX/visual review of the public GitLab Pages site
      (agf/docs/site/), distinct from academic-visual-reviewer's
      compiled-PDF scope. Independence from the implementing session is a
      role requirement, not advisory -- see
      agf/agents/web-ux-reviewer.yaml's boundaries.forbidden_actions.

  independent-implementation-reviewer:
    status: suspended
    reason: >
      Provisionally inactive effective 2026-08-09 per governor decision
      20260809T073516Z-governor-reviewer-2gbg.md, accepting review
      20260809T063108Z-independent-implementation-reviewer-12nr.md's six
      blocking findings against the role definition itself (incomplete
      both-gates prohibition at forbidden_actions; missing infosec
      detection/escalation route for sensitive material; an
      unreproducible-as-written validation claim; a Gate 2 handoff
      missing the mandatory adopter-docs-parity outcome; a live MR
      description that violated the MUST description rule; and a
      required-review-sequence bypass at merge time). No work may rely
      on or commission this role until a corrective MR resolves the
      findings, an independent exact-head review returns COMPLETE/CLEAR,
      and a fresh binding governor Gate 2 decision reactivates it. This
      is an authority/status correction, not a rejection of the role
      program -- the corrected role may still be reviewed while
      suspended.
    resume_when: "A corrective MR resolves 12nr's B1-B6, an independent exact-head review of the corrected head returns COMPLETE/CLEAR, and governor-reviewer records a fresh binding Gate 2 decision reactivating the role."
    played_by: "any model/session distinct from the implementer (Codex, codex-gpt-5, for Claude-implemented changes; the reverse when Codex implements), named by governor-reviewer or an approved plan for specific non-trivial Gate 2 candidates -- while active"
    notes: >
      Activated by governor-reviewer, Gate 1 approved
      20260808T193155Z-governor-reviewer-get2.md, per
      docs/plans/20260808T181423Z-independent-implementation-reviewer.md.
      Evidence: 20260808T161743Z-planner-architect-kpdj.md finding 4b and
      20260808T171050Z-contribution-auditor-q1ge.md's independent
      concurrence identified that contribution-auditor's real jurisdiction
      (agf/agents/contribution-auditor.yaml) covers contribution/governance
      guidance, not exact-head implementation-diff review -- yet
      contribution-auditor was repeatedly used for exactly that during MR
      !1224's four review rounds. This role gives that function a distinct,
      audit-legible identity. Not a mandatory gate for every change --
      named per Gate 2 candidate when additional independent review
      separation is warranted. Never approves Gate 2, merges, or holds
      mechanical blocking authority; CLEAR/BLOCK is advisory evidence for
      governor-reviewer, per tool-authority-boundary-rule.md. Suspended
      2026-08-09; see `reason` above for the active corrective-work trail.
