# Copy this file to agf/agents/MANIFEST.yaml and edit it to record YOUR
# project's own active roles. It is never read as adopter state itself --
# agov only reads agf/agents/MANIFEST.yaml (or the path set by
# AGOV_MANIFEST_PATH).
#
# Every role below starts "skipped" with a placeholder reason. Set each
# role you actually use to "active" (or "suspended" if temporarily paused)
# and record who or what plays it. Delete roles your project does not use,
# or leave them skipped -- agov does not require every role to be present.
#
# Run: agov validate agents
# =============================================================================

