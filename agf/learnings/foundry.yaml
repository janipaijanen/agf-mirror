      awaiting-governor, and execute approved forge closures in the same
      bounded cycle. Require each close to cite the canonical replacement or
      falsifying fact, never age alone. Batch stale coordination carriers into
      one reviewed closure record instead of merging one historical record per
      MR. For plan MRs, wait for or reuse the canonical lifecycle
      supersession-provenance contract so the ledger and plan status cite the
      same replacement identifier, governor decision, and UTC timestamp.
    severity: significant
    confidence:
