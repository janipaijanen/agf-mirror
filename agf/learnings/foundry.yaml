  - id: L008
    date: "2026-06-13"
    category: gap
    agents_involved: [coder-tester, governor-reviewer]
    summary: >
      Branch preflight existed as a rule, but was not adjacent enough to the
      commit that resolved academic-paper handoffs.
    detail: >
      After the academic paper was explicitly marked WIP and low priority,
      Codex prepared a governor-reviewer decision record resolving seq 121,
      seq 124, and seq 126. Earlier in the turn, Codex checked the branch and
      observed `docs/academic-paper-draft`. The decision record was then
      written, validated, and committed. The commit landed on `master` as
      `f97c2ed` rather than on the expected paper branch.

      The existing L007 learning and `active-branch-preflight-rule` already
      required checking branch identity immediately before durable writes. This
      incident shows that the rule was still too easy to satisfy mentally with
      an earlier branch check. In a shared multi-agent checkout, "earlier in
      the same turn" is not adjacent enough: another agent, worktree operation,
      resume, or local branch movement can invalidate the branch state between
      validation and commit.

      No content loss occurred, and the decision record itself was valid. The
      governance problem is process reliability: a valid coordination decision
      traveled on an unexpected branch, creating review-scope ambiguity and
      requiring another human reminder.

      Root cause: branch preflight was treated as situational awareness rather
      than as a required final gate in the exact command sequence that performs
      `git add`/`git commit`.
    framework_impact: high
    status: implemented
    recommendation: >
      Strengthen the active-branch preflight habit and tooling requirement:
      the final command group before every `git add`/`git commit` must include
      `git branch --show-current` and `git status --short --branch`, and the
      agent must compare that output to the intended branch in the same
      reasoning step as staging. If the branch is unexpected, stop before
      staging. Commit summaries or coordination completions for branch-sensitive
      work should state the branch observed immediately before commit. Future
      tooling should consider a wrapper/pre-commit check that records or
      enforces the intended branch for governed commits.

  - id: L009
    date: "2026-06-13"
    category: gap
    agents_involved: [coder-tester, governor-reviewer]
    summary: >
      Learning records are still too manual and should be recordable through
      dedicated governance tooling rather than another sidecar tool.
    detail: >
      While recording L008, Codex used the legacy Python learning validator
      directly from the vendored bootstrap framework. That worked, but it
      exposed a tooling mismatch in AGF-NG: coordination validation, plan
      validation, handoff reading, and usage reporting are now surfaced through
      the Rust `agov` binary, while learning capture still depends on manual
      YAML editing plus Python-era validation habits.

      This fragments the operational surface. Agents and humans should not
      need to remember a separate toolchain to record the exact learning
      records that are supposed to drive continuous improvement. Learning
      capture should be a first-class AGF-NG capability in the same tooling
      family as the rest of the governance workflow.

      The desired direction is not "add another script". It is to add `agov`
      support, for example `agov learning validate` and eventually
      `agov learning record`, using the existing learning schema/contract
      and preserving append-only semantics. The task should be able to compute
      the next learning id, validate required fields, preserve YAML structure,
      and make it hard to accidentally edit historical learning entries.

      This also improves agent ergonomics: when a coordination record says
      "Learning Review: Triggered", the same `agov` toolchain should support
      converting that trigger into a structured learning record or confirming
      the disposition.
    framework_impact: high
    status: proposed
    recommendation: >
      Plan an `agov learning` subcommand slice before adding any new standalone
      learning tool. Minimum viable scope: `agov learning validate <file>`
      for learning records and a documented design for
      `agov learning record` that appends a new record safely. Later scope:
      connect coordination-message Learning Review sections to learning-record
      creation/disposition, and add tests that preserve append-only behavior.

  - id: "20260624T120000Z-q7wj"
    date: "2026-06-24"
    category: adaptation
    agents_involved: [governor-reviewer, coder-tester, infosec-sentinel, contribution-auditor, fact-checker]
    summary: >
      AGF v1-to-v2 switchovers need a migration checklist and role-reviewed
      learning cleanup; friction comes from finding every active instruction
      surface still teaching the old layout, not from copying files.
    detail: >
      An adopter project replaced a v1-style agents-govern layout with AGF
      v2.2.3 in one working change. The successful end state used one visible
      agf/ authority tree, moved project-specific role definitions and assistant
      command sources under that tree, retired old live agents/ and
      agents-govern/ paths, changed cold-start instructions to use
      `agov session resume`, and changed new coordination records from numeric
      sequence files to AGF readable IDs generated by `agov coord brief`.

      The main friction was not copying files; it was finding every active
      instruction surface that still taught the old layout, old numbering
      scheme, or local machine-specific tool paths. A later role review also
      caught that the adopter learning record itself could pass YAML validation
      while still carrying stale v1 framework metadata and retired role paths.

      Evidence ref: harbor-workshop:2026-06-24:agf-v2-switchover.
    framework_impact: high
    status: implemented
    recommendation: >
      Add an upstream AGF v1-to-v2 switchover checklist covering: retiring old
      live agents/ and agents-govern/ paths; copying or adapting project roles
      into agf/agents/; moving assistant commands or skill sources under an
      AGF-owned location; updating every root loader and cold-start instruction;
      replacing max-sequence coordination instructions with readable IDs from
      `agov coord brief`; pointing colleagues to the public AGF release page for
      framework archives and agov binaries; running `agov validate adoption`,
      `agents`, `learnings`, and `infosec`; validating new coordination notes;
      scanning active docs for old path and numbering references; and finally
      reviewing learning records through infosec-sentinel, contribution-auditor,
      and fact-checker lenses so valid YAML does not still contain stale v1
      identity, retired paths, or over-specific adopter details.
    confidence:
      level: single-adopter
      evidence_count: 1
      evidence_refs:
        - "harbor-workshop:2026-06-24:agf-v2-switchover"

  - id: "20260624T214609Z-30gz"
    date: "2026-06-24"
    category: adaptation
    agents_involved: [governor-reviewer, coder-tester]
    summary: >
      External LLM fit assessment of AGF 2.2.4 confirmed strong docs and authority
      model but surfaced eight actionable improvement proposals, primarily around
      versioning clarity and missing operational checklists.
    detail: >
      An LLM evaluator reviewed AGF 2.2.4 documentation (GitLab issue #17)
      after manually copying the /evaluate/ page and subsequent content pages.
      The review covered all main documentation sections but not the actual
      rule/schema/contract files.

      Strengths cited (ten items): sharp problem definition and fit boundary;
      strong human-accountability authority model; two-gate model is legible and
      operationally useful; low-infrastructure coordination protocol; daily
      operating model not just setup ceremony; AI context hygiene and externalized
      state coverage; evidence discipline as a differentiator; tooling correctly
      subordinate; contract philosophy is excellent; Gate 2 and release discipline
      are unusually strong.

      Risks cited (seven items): not a universal framework; depends on real
      governor capacity; behavioral discipline still required alongside
      structural discipline; artifact-level implementation quality not verified
      directly; versioning language slightly confusing; strongest at project
      level not org scale; customization model introduces customization risk.

      Eight improvement proposals, all actionable:
      (1) Clarify "v2.1 documentation" vs framework content version 2.2.4 —
      add an explanatory note in release information.
      (2) Add compact visual table for free/marked/contracted customization zones.
      (3) Add compact Gate 2 review checklist to review-and-release.
      (4) Add compact daily operation checklist to day-to-day.
      (5) Add visual validator surface matrix (shipped/contract-target/blocking/advisory).
      (6) Add miniature end-to-end coordination thread example.
      (7) Add first-week adoption checklist to FAQ or install page.
      (8) Add configuration drift review step to upgrade guidance.

      Final verdict: "Adopt now" for the validated core (single repo, single governor,
      AI in the loop, long-lived work). "Wait" for org-scale federation, broader
      validator maturity before piloting, or teams without real governor capacity.
    framework_impact: medium
    status: implemented
    recommendation: >
      Implement improvement proposals 1, 3, 4, and 7 as priority (quick doc changes
      with high adoption impact). Proposals 2, 5, and 6 require layout work (visual
      elements) — defer to a follow-up. Proposal 8 is a small addition to
      customizing-the-framework. Update status to implemented when proposals
      1/3/4/7 are merged. Record the two-concept versioning model (documentation
      line vs framework content version) in a canonical explanation so it can be
      cited consistently.
    confidence:
      level: single-adopter
      evidence_count: 1

