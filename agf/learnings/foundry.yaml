  - id: "20260720T201034Z-w6zo"
    date: "2026-07-20"
    category: gap
    scope: framework
    title: role-based-coordination-lacks-advisory-delivery-targeting-and-confirmed-surfacing
    description: >
      Coordination messages route by role (`from`/`to` fields validated
      against MANIFEST.yaml role identifiers), which is correct and
      intentional — it is what lets any agent play any role across
      sessions. The gap is narrower than "identity must become authoritative":
      the protocol has no reliable way to surface a published,
      role-addressed message to one specific intended active instance, or to
      confirm that instance actually received it. In this session, one LLM
      instance (Claude) filed a handoff addressed `coder-tester ->
      coder-tester` intending to reach a specific other instance (Codex),
      and it worked only because the human governor manually relayed
      context; nothing in the protocol would have guaranteed it otherwise.

      This extends an existing learning,
      `20260625T063214Z-dpd3` (coordination-visibility-requires-publication):
      that record established that publication is necessary but not
      sufficient for visibility. This incident shows the operational
      delivery chain — written -> validated -> published -> surfaced ->
      acknowledged/taken — has strong coverage on the first three stages and
      weak coverage on the last two.
    agents_involved:
      - coder-tester
    framework_section: "coordination channel; role manifest; message delivery"
    business_impact:
      type: cost_overhead
      description: >
        Without a resolution, coordinating a specific follow-up between two
        concurrently active model instances depends on chance pickup order
        rather than a confirmed delivery path, which costs review latency
        and required the human governor to manually confirm which instance
        actually acted on a given handoff in this incident.
    framework_impact: medium
    status: proposed
    recommendation: >
      Jointly designed with Codex via the coordination channel
      (`docs/coordination/20260720T203647Z-coder-tester-sjpp.md`) rather
      than resolved unilaterally here. Two-stage design, not a single pick
      among the original three candidate options:

      Stage 1 (existing schema, no schema change, testable now): `to`
      remains sole routing authority. A handoff intended for a specific
      active instance sets `requires-ack: true` and names the intended
      recipient/surface in prose; publish a bridge on a surface the
      recipient already watches (e.g. the relevant MR discussion); treat
      delivery as complete only when an eligible actor posts an `ack` or
      takes the handoff; if the intended instance does not acknowledge
      within a working window, any eligible actor in the role may take it
      so work is never stranded.

      Stage 2 (only if Stage 1 proves insufficient after real recurrence):
      an optional, explicitly non-authoritative `delivery` metadata object
      (e.g. `recipient_hint`, `surface`, `locator`) that changes
      notification priority only — grants no role or gate authority, must
      not hide the message from the role's ordinary queue, and does not
      overload `model` (sender provenance) as recipient identity. An
      acknowledgment/take, not the hint, establishes actual receipt.

      Keep status proposed and confidence single-adopter; do not create a
      MUST-strength rule or schema field until Stage 1 has been exercised
      across further handoffs.
    severity: minor
    confidence:
      level: single-adopter
      evidence_count: 1
      evidence_refs:
        - "docs/coordination/20260720T193644Z-coder-tester-kh7j.md"
        - "docs/coordination/20260720T200018Z-coder-tester-psht.md"
        - "docs/coordination/20260720T203647Z-coder-tester-sjpp.md"

  - id: "20260720T220125Z-k8s7"
    date: "2026-07-20"
    category: validation
    scope: framework
    title: cross-llm-coordination-needs-three-separable-layers-not-two
    description: >
      Two related observations across two different threads in the same
      period, not two independent corroborations of one claim: durable Git
      coordination records, disposable GitLab MR-note discovery bridges,
      and observable receipt (correct role routing plus
      requires-ack/response/takeover) are three separable mechanisms, not
      two. An initial framing collapsed discovery and receipt into one
      property ("visibility"); a routing incident during this same period
      showed why that collapse is wrong — a durable, published
      coordination record is not the same property as the record reaching
      the role authorized to act on it.

      Evidence 1 (specificity of findings improves independent review): on
      MR !255 (rename the MCP `dir` field to `coordination_dir`), Codex's
      Gate 1 review (`sga1`, then follow-up `16p7`) cited exact evidence
      for each BLOCK — a specific stdout-parsing line still live in Design
      item 4 despite being described as fixed, and a specific mismatch
      between the plan's current hard-rename/BREAKING contract and the MR
      description's stale alias/PREVENTIVE wording. Both were fixed
      precisely because the findings named the exact defect rather than
      offering general disapproval.

      Evidence 2 (a durable, published record is not the same as correct
      receipt): the same period's philosophies-page plan (MR !268) was
      handed off for Gate 1 review with `to: planner-architect` instead of
      `to: governor-reviewer`, contradicting `agf/agents/MANIFEST.yaml`'s
      routing authority. The coordination file (`r2sr`) was durable,
      committed, and published on an open MR with a governor-facing
      description — but no note had yet been read against it; the first
      response was Codex's own review (`1mr4`) *reporting* the
      misrouting, not a pre-existing note that had been checked and still
      failed. Detection, correction, and receipt stayed separable
      throughout: Codex's review detected the defect; a corrective
      `handoff` with `requires-ack: true` addressed to the correct role
      (`gmrh`) routed it; the governor's subsequent MR comment and merge
      supplied the observable receipt. The original record (`r2sr`) stays
      immutable as evidence of the mistake; `gmrh` supersedes it for
      routing purposes only. Absent Codex's review, this record does not
      show how long the plan would have sat unrouted — only that a
      durable, published record was not sufficient on its own to reach
      the authorized role.

      A related overclaim surfaced and was corrected in the same
      discussion: "the coordination record survives even if the hosting
      platform disappears" is true only once the record's Git objects
      have been replicated outside that one hosting platform — into an
      independent clone or a second remote. Merging to the shared base
      branch improves propagation and makes replication likely, but a
      merge that exists only on one hosted remote is not itself a backup
      guarantee.
    agents_involved:
      - coder-tester
      - planner-architect
      - governor-reviewer
    framework_section: "coordination channel; audit trail; Gate 1 routing; always/coordination-message-rule.md"
    business_impact:
      type: neutral
      description: >
        No observed external or financial loss occurred — the routing
        misfire was caught within minutes by an active review pass, not
        discovered after real delay. Impact is reduced coordination
        ambiguity going forward and one extra review/MR cycle to correct
        the routing this time. Left unreviewed, the same misrouting
        pattern could have delayed or obscured a Gate 1 decision in a
        session without an active independent reviewer; that risk is a
        supporting rationale for the recommendation below, not a claimed
        avoided cost.
    framework_impact: medium
    status: proposed
    recommendation: >
      Document cross-LLM coordination as requiring three separable
      mechanisms: a durable Git record, a disposable discovery bridge (MR
      note or equivalent), and an observable receipt (correct role routing
      plus requires-ack, response, or takeover — not mere publication).
      Specific, evidence-backed findings improve independent review; vague
      acknowledgments invite rubber-stamping. When documenting durability
      claims, avoid overclaiming platform-independence: a coordination
      record survives loss of one hosting platform only if its Git objects
      have been replicated outside that platform — merging to the shared
      base branch improves propagation but does not by itself replace
      backup. Treat this as empirically informed by two related incidents
      in this project, not yet a universally validated design — revisit
      for promotion to a rules-template entry after independent
      corroboration from a second adopter.
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 2
      evidence_refs:
        - "MR !255/!266 dir-rename Gate 1 BLOCK chain (supports the finding-specificity claim): docs/coordination/20260720T212711Z-coder-tester-16p7.md; fixed by commits af14f6d, f7b7df2"
        - "MR !268/!269 Gate 1 routing misfire (supports the three-layer delivery claim): docs/coordination/20260720T214439Z-coder-tester-r2sr.md misrouted to planner-architect; corrected by docs/coordination/20260720T215132Z-coder-tester-gmrh.md"

  - id: "20260721T003902Z-4j3j"
    date: "2026-07-21"
    category: process
    scope: framework
    title: merged-plan-metadata-drift-and-self-ack-is-not-governor-authority
    description: >
      Two compounding gaps in the same session (2026-07-21), the second
      discovered while fixing the first. Not independent — the second is
      what happens when a real process gap is corrected under time pressure
      without re-checking the correction itself against the same rule that
      the original gap violated.

      Gap 1 (metadata drift): three Gate 1 plans in this project
      (`public-governance-philosophies-page`,
      `philosophical-lenses-learning-additions`, `deprecation-policy-rule`)
      each had their content MR merged to `main` while the plan file's own
      `status`/`gate1_approved_by`/`gate1_approved_at` front matter stayed
      `pending-gate1` with empty approval fields. In each case the actual
      approval happened — the governor merged the MR — but nothing updated
      the plan's own record of that fact. This recurred three times in one
      session because updating a plan's metadata was treated as a separate,
      easily-deferred follow-up task rather than part of the approval
      action itself.

      Gap 2 (self-ack is not governor authority): fixing gap 1 for two of
      the three plans initially used a `coder-tester` self-acknowledgement
      (`kqkh`, for `philosophical-lenses-learning-additions`) or no
      coordination record at all (for `deprecation-policy-rule`) as the
      basis for setting `status: approved`. Codex's review caught both
      (`docs/coordination/20260721T001100Z-coder-tester-jmd1.md` and
      `docs/coordination/20260721T001149Z-coder-tester-gqdt.md`): per
      `AGENTS.md`'s existing Gate 1 rule ("Gate 1 approval comes from a
      governor-reviewer coordination message"), a same-role self-ack or a
      bare citation of a merge event does not supply governor authority,
      even when the underlying governor decision was real (both MRs had in
      fact been merged by the governor). The fix required both an explicit
      governor decision-record and correcting the approval timestamp from
      the local merge-commit time to GitLab's actual `merged_at` platform
      event, which had drifted by about a second in one case — small, but
      it showed the original value was copied from `git log`, not looked
      up from the platform event it claimed to represent.

      A related, separately-caught gap in the same cleanup: the
      `deprecation-policy-rule` plan's prior-art citation table (six
      external projects' deprecation policies) had never been spot-checked
      against a live source, only asserted from training-knowledge recall
      at drafting time. Live verification found two of six wrong: Kubernetes
      GA APIs have no fixed removal window at all (the table claimed "12
      months or 3 releases" — that figure exists only for Kubernetes Beta
      APIs, and even then it is applied twice, not once), and GitHub's REST/
      GraphQL API support window is at least 24 months, not the "about 12
      months" the table stated. Both corrected after live fetch.
    agents_involved:
      - coder-tester
      - governor-reviewer
    framework_section: "AGENTS.md Gate discipline section; workflow/deprecation-policy-rule.md prior-art table; always/verifiable-claims-rule.md"
    business_impact:
      type: neutral
      description: >
        No external or financial loss — caught within the same session by
        an active independent review pass (Codex) before either plan's
        Gate 1 status was relied on for further downstream implementation
        work. Impact is two extra correction cycles and, had the citation
        error gone uncaught, a governance rule template shipped to future
        adopters with two factually wrong deprecation-window claims in its
        own worked example.
    framework_impact: medium
    status: implemented
    recommendation: >
      Two fixes, both applied in this session rather than left proposed:
      (1) `AGENTS.md`'s Gate discipline section now states explicitly that
      a same-role self-ack or a bare merge-event citation does not satisfy
      the Gate 1 governor-reviewer coordination message requirement, and
      that post-hoc plan-metadata corrections must be accompanied by an
      actual governor-reviewer coordination record — see the paragraph
      added after "Gate 1 approval comes from a governor-reviewer
      coordination message." (2) The corrected prior-art citations are
      live in both `.claude/rules/workflow/deprecation-policy-rule.md` and
      `agf/rules/workflow/deprecation-policy-rule.md`. Not yet built: tool
      enforcement — `agov plan validate` could flag a plan with
      `status: approved` whose `gate1_approved_by` has no matching
      governor-reviewer coordination record in the channel, closing this
      gap structurally rather than relying on review discipline alone.
      Named here as a concrete follow-up, not silently deferred.
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 3
      evidence_refs:
        - "MR !281 (philosophical-lenses-learning-additions metadata fix): self-ack rejected in docs/coordination/20260721T001100Z-coder-tester-jmd1.md; corrected by docs/coordination/20260721T002215Z-governor-reviewer-7mg5.md"
        - "MR !282 (deprecation-policy-rule metadata fix): missing authority record rejected in docs/coordination/20260721T001149Z-coder-tester-gqdt.md; corrected by docs/coordination/20260721T002557Z-governor-reviewer-66gd.md"
        - "Prior-art citation errors (Kubernetes GA, GitHub API) found via live fetch during the gqdt fix, corrected in the same commit as the authority-record fix"

  - id: "20260721T073035Z-bt1s"
    date: "2026-07-21"
    category: gap
    scope: framework
    title: ci-workflow-rule-checks-push-head-title-not-full-commit-range
    description: >
      `.gitlab-ci.yml`'s `workflow.rules` skips pipeline creation when
      `$CI_COMMIT_TITLE =~ /^coordination:/`, intended to avoid
      re-running CI for coordination-record-only pushes that don't
      touch content. The rule's own comment explicitly names the
      precondition: "Use this only when the commit changes coordination
      records ... mixed commits must run normal CI." `$CI_COMMIT_TITLE`
      for a push-triggered pipeline reflects only the push's HEAD
      commit, not every commit in the push.

      In this session, a real content-fix commit
      (`5264a7a`, "fix: settle Contribution Auditor trigger wording per
      rts3") was pushed together with a coordination-only commit
      (`p3nj`) on top, in a single `git push`, with the coordination
      commit last. GitLab evaluated `$CI_COMMIT_TITLE` against `p3nj`'s
      title, matched the skip pattern, and skipped the entire push's
      pipeline — including the real content change, which received zero
      CI evidence despite `p3nj` itself explicitly (and, it turned out,
      incorrectly) claiming that push would trigger a normal pipeline.
      The human governor caught the missing pipeline directly on the
      MR; the agent had not verified pipeline existence before making
      the claim.

      This is the precise "mixed commits" failure mode the rule's own
      comment warns against, self-inflicted by commit-batching order
      rather than by mixing coordination and content changes within a
      single commit.
    agents_involved:
      - coder-tester
    framework_section: ".gitlab-ci.yml workflow.rules; gate-self-test-rule.md"
    business_impact:
      type: neutral
      description: >
        No merge occurred on unvalidated content — the human governor
        caught the missing pipeline before merge, not after. Impact is
        one avoidable round-trip and a false claim in the coordination
        trail that had to be corrected
        (docs/coordination/20260721T072945Z-coder-tester-ms3h.md).
    framework_impact: medium
    status: implemented
    recommendation: >
      Immediate mitigation (implemented): documented the correct
      discipline in
      docs/coordination/20260721T072945Z-coder-tester-ms3h.md — when a
      push must include both a content commit and a coordination-record
      commit, order them so the coordination-only commit is not the
      final one, or push the content commit separately with it last.
      Also: verify pipeline existence for the actual pushed head via
      the GitLab API before claiming CI evidence exists — do not infer
      it from the workflow rule's intended behavior.

      Deferred, not silently: hardening `.gitlab-ci.yml`'s
      `workflow.rules` itself to check every commit title in the pushed
      range (not just the HEAD commit) is the structural fix that would
      make this class of mistake impossible rather than merely
      documented against. Not attempted in this session — CI workflow
      rules are high-blast-radius (a wrong change risks breaking
      pipeline creation repo-wide) and per
      `always/gate-self-test-rule.md` any change to a gate needs a
      deliberate negative test demonstrating it still fires on a
      known-bad (mixed-commit) push before shipping. That is a properly
      scoped follow-up task, not a fix to make in the middle of
      resolving an unrelated MR's review blockers.
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 1
      evidence_refs:
        - "MR !289: push 64019a7..2a54e8e skipped CI entirely; docs/coordination/20260721T072153Z-coder-tester-p3nj.md's pipeline claim corrected by docs/coordination/20260721T072945Z-coder-tester-ms3h.md"

  - id: "20260721T094956Z-k9p2"
    date: "2026-07-21"
    category: gap
    scope: framework
    title: release-critical-ci-behaviour-needs-host-preflight-from-the-consumer-view
    description: >
      During the v2.3.0 release review, both Rust binary checksum files
      produced by the green MR pipeline contained build-layout paths such as
      `../../dist/agov-2.3.0-<target>.tar.gz`. The digest values were correct,
      but a consumer who downloaded an archive and its checksum into one
      directory could not run the conventional `sha256sum -c` verification.
      The defect was detected only after downloading the CI preview artifacts.

      This failure did not intrinsically require GitLab, cross-compilation, or
      a release binary to reproduce. The path was introduced by inline shell
      in `.gitlab-ci.yml`: `sha256sum` recorded the relative input path it was
      given. A dummy local archive and a clean download-directory simulation
      would have exposed the same blocker before consuming CI capacity. The
      framework archive path already avoided the defect by explicitly writing
      checksum entries using archive basenames, but the separately implemented
      Rust packaging path did not share that behavior or its validation.

      The broader gap is treating a green producer-side build as sufficient
      evidence for release artifacts. Release-critical CI scripts can carry
      assumptions about working directories, runner variables, paths, file
      permissions, archive layout, and publication staging that are visible
      through host-side critical review and cheap simulations. CI remains
      necessary for runner integration, target builds, credentials, and
      publication, but it should confirm behavior that cannot be established
      locally rather than be the first place portable packaging contracts are
      exercised.
    agents_involved:
      - coder-tester
      - governor-reviewer
    framework_section: "release preparation; CI scripts; artifact packaging and verification"
    business_impact:
      type: cost_overhead
      description: >
        Detecting portable packaging defects only after CI spends runner time
        increases iteration cost and delays releases. If missed through tag
        publication, the same defect also shifts verification failure to
        adopters even though the artifact bytes themselves are intact.
    framework_impact: high
    status: proposed
    recommendation: >
      Establish a host-preflight target for every release-critical CI path.
      Move portable packaging logic out of inline CI YAML into versioned,
      locally executable scripts or tooling functions, and make CI invoke the
      same entry points. Before starting expensive or platform-specific jobs,
      critically review those scripts for runner-only assumptions and execute
      cheap contract tests with dummy inputs where real builds are unnecessary.

      The target state is evidence from both producer and consumer views. A
      release preflight should create artifacts in an isolated staging tree,
      copy only the files a user would download into a fresh directory, and
      exercise documented operations there: checksum verification, archive
      listing and extraction, forbidden-path checks, executable/version smoke
      tests when host-compatible, and provenance-field inspection. Checksums
      must contain portable basenames rather than build-tree paths. The same
      consumer-layout assertions should run as fast unit or script tests on the
      host and again against CI preview artifacts for integration assurance.

      Classify each release check explicitly as host-portable, host-conditional,
      or CI-only. Run host-portable checks before pipeline creation; run
      host-conditional checks when the required toolchain is available; reserve
      CI-only status for real constraints such as protected credentials,
      registry publication, unavailable architectures, or runner integration.
      A Gate 2 release handoff should report this classification and explain any
      check first exercised in CI. Prefer one shared packaging implementation
      across framework and Rust artifacts so basename, checksum, provenance,
      and archive-layout guarantees cannot drift between duplicated paths.
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 2
      evidence_refs:
        - "MR !306 preview job 15448242127: Rust checksum files recorded ../../dist paths and failed consumer-layout sha256sum -c verification"
        - "tooling/rust/crates/agov/src/dist.rs writes basename-only framework checksums, while .gitlab-ci.yml lines 557 and 576 duplicated path-preserving Rust checksum generation"
  - id: "20260721T121047Z-r4m7"
