  - id: "20260726T232934Z-pnxo"
    date: "2026-07-26"
    category: process
    scope: framework
    title: same-session-gate1-block-response-fixes-findings-not-premises
    description: >
      MR !654 (`.claude/rules/` and `agf/rules/` canonicalization) was blocked
      at Gate 1 three consecutive times in the same session, and each response
      repeated the same shape of mistake: it fixed exactly the findings named
      in the block, without asking whether those findings were symptoms of a
      wrong design premise. Pass one to two fixed arithmetic (shared-file and
      divergent-file counts were undercounted). Pass two to three answered a
      previously-punted adopter-impact question with real evidence
      (`agf/dist/release-manifest.yaml` confirms `agf/rules/` ships verbatim
      to every adopter) — a genuine improvement, but that same evidence is
      exactly what exposed a deeper problem nobody had asked about yet: the
      plan's core mechanism (symlink every `.claude/rules/` file to
      `agf/rules/`) is architecturally incompatible with `agf/rules/` also
      being a generic, `<!-- CUSTOMIZE -->`-templated distribution artifact,
      because a symlink cannot serve both "adopter-neutral shipped template"
      and "this project's own working instantiated rule" simultaneously for
      the same file. An independent fourth review (Codex,
      `20260726T232326Z-coder-tester-kgkh`) caught this; three prior
      same-session passes did not, because each treated the block's named
      findings as the complete scope of what needed fixing rather than as
      evidence that the design itself needed re-examination. A related
      pattern in the same session: a "contribution-auditor self-critique"
      section in a different plan (MR !661) was presented as satisfying an
      independent-review requirement while being performed by the same model
      in the same session — the weakest tier on this project's own
      verification-independence scale (`docs/radar.md`: "different-session <
      different-model < different-vendor"), not a substitute for it.
    agents_involved:
      - planner-architect
      - coder-tester
      - governor-reviewer
    framework_section: "framework.md — Gate 1 review response discipline; docs/radar.md — verification independence tiers"
    business_impact:
      type: cost_overhead
      description: >
        Three Gate 1 cycles (each involving a fresh diff/grep/code-inspection
        pass, a plan rewrite, and a new coordination handoff) were spent
        before the architectural question was even identified, let alone
        resolved. No irreversible harm — Gate 1 discipline correctly refused
        to let any of the three passes proceed to implementation — but the
        cost was avoidable iteration, not caught earlier because each pass
        treated the review as a checklist to satisfy rather than a signal to
        re-examine the design.
    framework_impact: medium
    status: proposed
    recommendation: >
      When a plan is blocked at Gate 1 a second time in the same session (not
      the first — a single block is normal review, not a pattern), the
      response should explicitly ask, before touching any specific finding:
      "do these findings share a common root cause in the design itself, not
      just in this artifact's execution of it?" If yes, address the root
      cause directly and say so, rather than patching findings one at a time
      across further passes. Separately: a same-session, same-model
      "self-critique" or "contribution-auditor self-consult" does not satisfy
      an independent-review requirement and should be labeled `waived`, not
      `consulted`, in `advisory_consultation` — reserve `consulted` for
      review that is actually independent by this project's own tiering.
      Consider adding a Gate 1 review-response checklist item: "if this is
      the second or later block on the same artifact this session, has the
      root design premise been re-examined, not just the cited findings?"
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 1
      evidence_refs:
        - "MR !654 three-pass block sequence: docs/coordination/20260726T225814Z-coder-tester-hmh4.md, docs/coordination/20260726T231147Z-governor-reviewer-mqej.md, docs/coordination/20260726T232326Z-coder-tester-kgkh.md"
        - "MR !661 same-session self-critique: docs/plans/v2.5.0-portfolio-discovery.md (\"Self-critique, honestly labeled\" section) and docs/coordination/20260726T231147Z-governor-reviewer-3ess.md"

  - id: "20260729T113947Z-dzy7"
    date: "2026-07-29"
    category: gap
    scope: framework
    title: plan-drafting-cited-retracted-issue-finding-from-description-only
    description: >
      Drafting the v2.4.6 recovery patch plan (MR !774), Claude/planner-
      architect cited issue #78 finding 1 (a top-level `docs/` directory
      shipping outside `agf/` in the v2.4.5 archive) as a verified
      adopter-boundary regression and made its relocation mandatory scope.
      The finding had already been explicitly retracted by its own reporter
      in a comment on the issue, and a separate governor canonical-triage
      record had independently confirmed the retraction and directed that
      the declared paths not be relocated. Neither was consulted before
      drafting.

      The mechanism: `glab issue view <n>` prints only the issue's
      description, not its comment thread. The command's own header output
      shows a `comments: N` count, which was seen (`comments: 3`) but not
      treated as a signal requiring a further fetch
      (`glab api projects/:id/issues/<n>/notes`) before citing the issue's
      content as current. The plan's own text additionally claimed
      "re-reading #67 and #78 in full rather than trusting the SoW's
      characterization" — that claim was false as written: only the
      descriptions, not the comment threads, were read in full. This is a
      specific, checkable overclaim, not merely an omission.

      Caught by contribution-auditor and fact-checker review in MR !774
      (`20260729T112856Z-contribution-auditor-h3hr`,
      `20260729T112857Z-fact-checker-n2bq`), both independently reaching the
      same DISSENT/BLOCK disposition before any implementation or release
      action occurred.
    agents_involved:
      - planner-architect
      - contribution-auditor
      - fact-checker
    framework_section: "Verification over Assumption; boundary-shape-testing-rule.md's sibling principle applied to issue-tracker evidence rather than API payloads"
    business_impact:
      type: cost_overhead
      description: >
        A Gate 1 plan drafting/review cycle was spent on scope that had to
        be fully retracted before re-review. No implementation, version,
        tag, or release action was taken on the incorrect scope — the gate
        held — but the correction cost a full review round for both
        contribution-auditor and fact-checker.
    framework_impact: medium
    status: proposed
    recommendation: >
      When citing a GitLab (or equivalent) issue as evidence for a plan,
      always fetch and read its full comment thread
      (`glab api projects/:id/issues/<n>/notes` or equivalent), not only the
      description returned by a summary view command, before citing any
      finding from it as current or verified. Treat a nonzero comment count
      in a summary view's header as a required-fetch signal, not an
      informational aside. Separately: before drafting new disposition for
      an issue, search the coordination channel for an existing canonical
      triage or decision record for that exact issue and treat it as
      controlling if found, rather than re-deriving disposition from
      scratch.
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 1
      evidence_refs:
        - "MR !774: docs/coordination/20260729T112856Z-contribution-auditor-h3hr.md, docs/coordination/20260729T112857Z-fact-checker-n2bq.md"

