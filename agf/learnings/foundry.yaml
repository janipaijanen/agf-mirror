  - id: 20260829T192500Z-4vn8
    date: '2026-08-29'
    category: process
    scope: framework
    title: single-instance-fix-without-class-generalization-left-input-graph-incomplete
    status: proposed
    description: >-
      While implementing v2.9.0 A1 (an MR-stage OCI build-and-scan job),
      coder-tester enumerated the paths that can change the container image
      and, during implementation, found that `agf/VERSION` was in the new
      job's trigger anchor but absent from its producer
      `rust:tooling:preview`. A VERSION-only change would have started the
      scan job with its `needs` dependency unbuilt. The gap was fixed and
      recorded prominently in the commit and merge request as "one
      dependency bug found and fixed".


      The fix was correct and the disclosure was complete. The failure was
      that finding one instance of the class did not trigger a search for
      the class. The implementer did not then ask the general question the
      instance implied: what else determines the bytes of the binary
      embedded in this image, and does its producer trigger on those
      inputs too?


      Independent review `20260829T184713Z-coder-tester-ngje` answered that
      question in minutes and found five further omissions:
      `tooling/rust/crates/agov/build.rs` (outside both
      `tooling/rust/**/Cargo.toml` and `tooling/rust/crates/**/src/**`),
      two `tooling/rust/crates/agov/schemas/*.json` files embedded via
      `include_str!`, and -- through `build.rs` invoking
      `tooling/rust/scripts/agov-source-fingerprint.sh`, which hashes
      `tooling/agov`, `tooling/rust`, `agf/schemas` and
      `agf/agents/MANIFEST.yaml` into `AGOV_SOURCE_FINGERPRINT` -- three
      further tracked inputs outside the anchor. `rust:tooling:preview`
      triggers on none of the last three either, so widening the consumer
      alone would have reproduced the exact `needs` defect that had just
      been fixed once.


      Prominent disclosure of a single fix can make a class-level gap look
      handled. The commit message and merge request both drew a reviewer's
      eye to the one instance that had been closed, which is honest but is
      not the same as coverage. The reviewer nevertheless found the class,
      which is why the independent review is the control that caught this
      rather than self-review.
    agents_involved:
      - coder-tester
      - governor-reviewer
    framework_section: workflow/ci-trigger-scoping-rule.md
    business_impact:
      type: prevented_loss
      description: >-
        A path anchor that misses image-affecting inputs silently provides
        no CVE coverage for changes routed through those paths, which is
        the exact defect the work item existed to close -- pre-tag
        container CVE coverage, after `v2.7.0-rc.1` was burned by a CVE
        that could only surface once the tag was immutable. An incomplete
        anchor is worse than a visibly absent gate, because it reads as
        coverage. The independent review caught this before merge, so the
        loss was prevented rather than realised.
    recommendation: >-
      When a defect of the form "input X affects artifact Y but does not
      trigger Y's producer or consumer" is found, do not fix the instance
      and continue. Enumerate the complete input closure of the artifact
      first -- for a compiled binary this means build scripts, embedded
      assets referenced by macros such as `include_str!`, and any
      fingerprint or codegen script together with every path that script
      reads -- then reconcile producer and consumer triggers against that
      closure as one change. State the closure and its derivation in the
      merge request so a reviewer checks the class rather than the
      instance. `ci-trigger-scoping-rule.md`'s existing "when in doubt,
      include the path" guidance is necessary but insufficient: it governs
      a path already under consideration, and says nothing about how to
      discover the paths not yet considered.
    severity: major
    confidence:
      level: single-adopter
      evidence_count: 3
      evidence_refs:
        - 'docs/coordination/20260829T184713Z-coder-tester-ngje.md: independent review finding B1, enumerating five omitted image-affecting inputs at exact head 01b3268c.'
        - 'tooling/rust/crates/agov/build.rs and tooling/rust/scripts/agov-source-fingerprint.sh: build.rs invokes the fingerprint script, which hashes tooling/agov, tooling/rust, agf/schemas and agf/agents/MANIFEST.yaml into the compiled binary.'
        - '.gitlab-ci.yml at merge request !2198 head: the A1 anchor and rust:tooling:preview trigger set, neither covering those inputs.'

  - id: 20260830T085245Z-p2xk
    date: '2026-08-30'
    category: process
    scope: framework
    title: design-change-left-stale-prospective-instructions-in-projection-manifest
    status: proposed
    description: >-
      Across three consecutive review rounds on two Gate 1 plans, the same
      failure recurred: a design element was removed or renamed in the plan
      prose, and the corresponding rule-projection manifest was updated only
      in the row that motivated the change, leaving other rows still
      describing the removed design. Each occurrence was caught by
      independent review, never by the author or by `agov plan
      projection-check`, which validates manifest shape and path resolution
      but cannot detect a semantically stale row.


      Occurrence 1 (`8mar` GDAB-1): slice C was split into its own plan; the
      parent manifest's `paths:` array and the plan's screen table were
      updated, but the distribution row's prose still claimed the slice-C
      registry and schema would ship, including a path a prior review had
      already rejected. Occurrence 2 (`br41` GME-R1): assertion 3 was
      withdrawn; the manifest's adopter-facing row still instructed the page
      to document the GitLab API dependency and cross-forge gap that belonged
      only to that assertion. Occurrence 3, found while fixing occurrence 2:
      splitting assertion 2 into 2a and 2b was applied to the plan and one
      manifest row, while two further rows still referenced the undivided
      assertion.


      The reframing that makes this matter came from the reviewer in
      occurrence 2. A projection manifest row is not a description of what was
      done; it is prospective instruction for what an implementer will do. A
      stale row therefore does not merely record obsolete history -- it
      directs implementation to build the thing the design removed, and it
      does so inside the structured artifact Gate 1 review treats as evidence.
    roles_involved:
      - coder-tester
      - governor-reviewer
    framework_section: workflow/documentation-rule-projection-rule.md
    business_impact:
      type: prevented_loss
      description: >-
        Each stale row would have directed an implementer to build a removed
        design: shipping a registry and schema assigned to a different plan,
        or publishing an adopter page documenting an API dependency and a
        cross-forge coverage gap that the approved design does not have. The
        second is the more damaging, because adopter-facing pages are copied
        into adopters' own repositories. All three were caught before
        implementation, so the loss was prevented rather than realised, but
        none was caught by the author or by mechanical validation.
      details: >-
        This record also corrects an evidence reference in learning
        `20260829T192500Z-4vn8`. That record's second evidence_ref states that
        `agov-source-fingerprint.sh` hashes `tooling/agov`, `tooling/rust`,
        `agf/schemas` and `agf/agents/MANIFEST.yaml` "into the compiled
        binary". Review `20260829T204615Z-coder-tester-k5dq` subsequently
        disproved that on the canonical packaging path by downloading the
        cross-built artifact and observing `source_fingerprint: unknown`:
        `Cross.toml` does not pass the fingerprint variable into `cross
        build`, and the container has no Git checkout. The lesson `4vn8`
        records is unaffected; only that evidence reference is wrong, and it
        is corrected here rather than by editing the append-only record.
    recommendation: >-
      When a design element is removed, renamed, or split, do not edit only
      the artifact section and the manifest row that motivated the change.
      Search every governed artifact for the element's name -- each of the six
      projection rows, the acceptance criteria, the risks section, and the
      front-matter consultation fields -- and reconcile them in the same
      commit. Treat a projection row as an instruction to a future
      implementer, not as a record of the past: the test is not "is this row
      still true?" but "if someone implemented only from this row, would they
      build the current design?" Mechanical projection checks validate shape,
      path resolution, and row presence; they cannot answer that question, so
      it stays an author obligation verified by review.
    severity: major
    confidence:
      level: single-adopter
      evidence_count: 3
      evidence_refs:
        - 'docs/coordination/20260830T075132Z-coder-tester-8mar.md: finding GDAB-1, stale slice-C distribution claims surviving the plan split at head 0fa3a5cd.'
        - 'docs/coordination/20260830T084415Z-coder-tester-br41.md: finding GME-R1, adopter-facing row still specifying the withdrawn assertion 3 at head 343e19ba.'
        - 'docs/reviews/rule-projection/gate-change-mechanical-enforcement.yaml: two further rows referencing the undivided assertion 2 after the 2a/2b split, found by the author while fixing GME-R2 and corrected in the same commit.'


  - id: 20260830T114500Z-tw3s
    date: '2026-08-30'
    category: process
    scope: framework
    title: negative-test-suite-passed-in-ci-while-its-validators-could-not-run
    status: implemented
    description: >-
      A gate self-test suite, written specifically to prevent green-looking
      wrong evidence, produced green-looking wrong evidence five times in one
      session. The third instance passed in CI and was cited as Gate 2
      evidence; the fourth was in the class-level control written to close
      the third; the fifth was in the meta-test written to prove the fourth
      control fires. Each fix was real and each was strictly stronger than
      the last, yet every round of independent review found the next
      instance one level further up. Each instance had a different surface cause and the same
      shape: an assertion reached its intended verdict for an unintended
      reason.

      First, a shallow-clone fixture used `git clone --depth`, which implies
      `--single-branch`; the remote-tracking ref was never created, so the
      pattern under test failed on `rev-parse` rather than on the missing
      merge base the test existed to demonstrate. Second, a "MODIFY"
      assertion added a file and edited it within one comparison range, which
      Git classifies as an addition, so it proved the ADD path twice. Third
      -- and the reason this record exists -- every validator rejection
      assertion used a bare non-zero exit check, which cannot distinguish
      "the validator rejected the content" from "the validator could not
      run". The suite ran validators inside throwaway repositories with no
      AGF root, and the CI job invoked the built binary directly rather than
      through the wrapper that exports AGOV_SCHEMA_DIR, so the validator
      exited non-zero with `Io("No such file or directory")` on every input,
      valid or invalid. Four assertions passed while nothing was validated.
      The CI transcript reporting "17 passed" was offered as gate evidence.
      The defect surfaced only because a later revision added a POSITIVE
      assertion -- that a renamed destination must still be valid -- which a
      non-functional validator cannot satisfy.

      Fourth: the control written to close the third was itself an instance.
      It inferred content rejection from a non-zero exit unless the output
      matched one of three blocklisted infrastructure-error strings. Since
      each guarded assertion is a composite command -- derive the input feed,
      then run the validator -- a FEEDER failure exits non-zero before the
      validator runs, matches none of those strings, and was reported as a
      successful content rejection. Independent review constructed that case
      and reproduced it; the author had flagged the blocklist as the weak
      point in the same handoff that shipped it, and still shipped it.

      Fifth: the meta-test proving the fourth control fires was itself an
      instance. It stored its fixture command as a STRING and ran it through
      `eval`, then inferred both of its conclusions from bare non-zero exits
      -- so a missing or malformed command satisfied both assertions while
      the intended path never ran. The mutation `command-that-does-not-exist`
      produced 2 passed / 0 failed. The lesson is recursive: writing a test
      for a control does not escape the pattern, because the test of the
      control is itself a test and inherits the same failure mode. Only
      positive, specific evidence terminates the regress -- an assertion that
      names what it expects to see cannot be satisfied by an absence.
    roles_involved:
      - coder-tester
      - governor-reviewer
    framework_section: always/gate-self-test-rule.md
    business_impact:
      type: prevented_loss
      description: >-
        The gate being tested was a governance validator feed that had been
        silently reporting success without validating anything. Had the suite
        shipped as it stood, the replacement gate would have carried a green
        CI transcript asserting it fired correctly, while its own evidence was
        produced by a validator that never ran -- a stronger false assurance
        than the original defect, because it would have come with a passing
        test. All three instances were caught by independent review before
        merge, so the loss was prevented rather than realised. None was caught
        by the author, and none by shell syntax checks, `git diff --check`,
        projection validation, or the suite's own result line.
      details: >-
        Disclosing the pattern did not prevent its recurrence. The author
        documented two instances of it in the Gate 2 handoff and explicitly
        asked reviewers to assume more were present; review `13rh` then found
        a third and fourth, and after a class-level control was claimed in
        `vq7n`, review `2shr` found that the control itself rested on
        assertions incapable of detecting the class. Self-disclosure and
        author vigilance are therefore not mitigations for this failure mode.
        Only an assertion that can fail for the specific wrong reason is.
    recommendation: >-
      A negative-test suite must be able to fail for the reason it claims to
      test, and must prove it can still pass for the right one. Four
      controls, all implemented in `tests/changed-files-failclosed.sh`:

      (1) Assert the PRECONDITION mechanically before trusting the outcome.
      Where a test depends on a specific state -- a Git status of M rather
      than A, a rename reported as R, a remote-tracking ref existing -- assert
      that state and fail loudly when it differs, rather than inferring it
      from the setup commands.

      (2) Never accept a bare non-zero exit as proof that a checker rejected
      content, and do not try to fix this with a blocklist of
      infrastructure-error strings. That was attempted here and became the
      fourth instance of the very pattern: the assertions being guarded are
      COMPOSITE commands -- derive an input feed, then run the checker -- so a
      feeder failure exits non-zero before the checker runs, matches no
      blocklisted string, and reads as a clean content rejection. The set of
      ways a composite command can fail early is open, so enumeration
      relocates the blind spot rather than closing it. Require POSITIVE,
      fixture-specific evidence instead: the assertion passes only when the
      command fails AND its output contains the specific finding that fixture
      must provoke, such as a schema error naming the offending field. No
      infrastructure failure can forge that string, because only the checker
      emits it and only for that content.

      (3) Include a canary that proves the checker ACCEPTS known-good input
      under the same environment the rejection assertions use. Every
      rejection assertion is meaningless if the canary fails, and a canary is
      the cheapest way to detect a broken harness before reading any other
      result.

      (4) Test the CONTROL, not only the thing it guards -- and apply
      controls (1) to (3) to that test too, because it is a test and inherits
      the same failure mode. A control asserted in prose is an unverified
      claim of exactly the kind it exists to prevent. Add assertions that the
      control refuses a deliberately broken case AND still accepts a genuine
      one; the second half matters, since a control that rejects everything is
      useless rather than safe. Invoke fixtures as real functions, never as
      strings through `eval`, and require the broken case to produce its own
      specific diagnostic rather than merely a non-zero exit. Then add a
      MUTATION assertion proving a missing or malformed fixture cannot satisfy
      the meta-test -- without it, the meta-test can pass while the path it
      claims to exercise never runs.

      The regress terminates here, and the reason is structural rather than a
      matter of adding one more layer. Pair each mutation assertion with a
      POSITIVE invocation of the same helper, in the same suite run. A broken
      or always-failing helper makes its mutation assertion appear to pass,
      but it simultaneously fails the paired positive assertion and raises the
      suite's failure count, so it cannot leave the suite green. A helper that
      always passes fails the mutation assertion. No state of a single helper
      satisfies both, which is why the pair needs no meta-test of its own --
      and why the answer is a pairing rather than another level of nesting.
      This argument was supplied by the independent reviewer, not the author,
      on the sixth round.

      Verify the controls in both directions: run the suite with the
      dependency broken and confirm the previously-passing assertions now
      fail. Here, breaking schema discovery moved the result from 21 passed /
      1 failed to 17 passed / 7 failed, and those four newly-failing
      assertions are the ones that had been passing while the validator was
      not running. A control that cannot be shown to fire is the same
      category of unverified claim as the gate it protects.

      Finally, run the suite with the EXACT invocation shape CI uses. The
      local wrapper exported an environment variable the CI job did not, so
      "passes locally" and "passes in CI" were testing different systems.
    severity: critical
    confidence:
      level: single-adopter
      evidence_count: 5
      evidence_refs:
        - 'docs/coordination/20260830T125924Z-coder-tester-gme3.md: finding GCD-G2-5, the eval-based meta-test accepting a missing command as proof the control fired, at head 81346b25.'
        - 'docs/coordination/20260830T120843Z-coder-tester-hna4.md: finding GCD-G2-4, the class-level rejection control accepting a feeder failure as a content judgment, at head 09e4e875.'
        - 'docs/coordination/20260830T110754Z-coder-tester-13rh.md: findings GCD-G2-1 (a MODIFY assertion that was an ADD over its own range) and GCD-G2-2 (rename-and-rewrite bypassing a D-only append-only guard), at head 7ca76d71.'
        - 'docs/coordination/20260830T113003Z-coder-tester-2shr.md: finding GCD-G2-3, the required self-test losing schema context in CI, reproduced deterministically in canonical job 16190308091 at head 37352cd6.'
        - 'tests/changed-files-failclosed.sh: the shallow-clone fixture bug found by the author during authoring, where --depth implied --single-branch and the test failed on rev-parse rather than on the missing merge base.'


  - id: 20260906T104942Z-ev5m
    date: '2026-09-06'
    category: gap
    scope: framework
    title: release-metadata-closure-must-precede-version-namespace-allocation
    status: proposed
    description: >-
      The v2.9.0 release draft reached changelog approval before its exact
      release-metadata closure had been validated. The approved plan derived
      current-version references with a grep that deliberately excluded the
      entire learning corpus so append-only learning entries would remain
      untouched. That exclusion also hid the live top-level
      adoption.framework_version field in agf/learnings/foundry.yaml. When the
      release draft changed agf/VERSION to 2.9.0 but preserved that field at
      2.8.0, the umbrella Rust validator correctly rejected the mismatch.
      The field is mutable adoption metadata rather than a learning entry, but
      the plan's path-level exclusion could not distinguish the two.

      This was caught before a release branch commit, tag, or public artifact,
      so v2.9.0 remains usable. The same class of late discovery previously had
      a higher cost: v2.7.0-rc.1 was tagged before its OCI vulnerability scan
      completed, the scan found a fixed HIGH-severity vulnerability, and the
      immutable candidate had to be abandoned permanently. A version or RC
      namespace should not be consumed merely to discover a failure that a
      reversible preflight could have found first.
    agents_involved:
      - coder-tester
      - governor-reviewer
    framework_section: workflow/release-via-merge-request-rule.md
    business_impact:
      type: prevented_loss
      description: >-
        The current mismatch was found before committing or publishing v2.9.0,
        preserving the intended stable version. Moving complete metadata,
        validation, build, security, and immutable-namespace checks ahead of
        tag creation prevents avoidable abandoned RCs, skipped stable version
        numbers, misleading release pages, and repeated operator work.
    recommendation: >-
      Add a release preflight phase that runs before an RC or stable version is
      treated as allocated and before any immutable tag is created. In a clean
      disposable worktree, apply the proposed version only as an uncommitted
      draft; derive current-version fields by schema/validator semantics rather
      than blanket path exclusions; run the umbrella validator, release asset
      build, negative security checks, and full tests; and author the changelog
      from the frozen candidate inventory. Require authoritative absence reads
      for the Git tag, GitLab Release, generic package, and derived OCI
      reference during this reversible phase. Only after that preflight is
      green should the governed release branch be committed and reviewed, and
      only after exact-head Gate 2 should the immutable tag be created. A
      failed preflight returns to an unversioned draft state and never burns an
      RC tag or stable version number.
    severity: significant
    confidence:
      level: longitudinal
      evidence_count: 2
      evidence_refs:
        - 'docs/plans/20260831T050110Z-v290-release-publication.md: the v2.9.0 metadata audit excluded agf/learnings wholesale and therefore omitted its live adoption.framework_version field.'
        - 'docs/coordination/20260828T061002Z-coder-tester-eqq3.md: v2.7.0-rc.1 publication stopped after the immutable tag because the OCI scan found a fixed HIGH vulnerability.'

  - id: 20260907T073424Z-rl9k
    date: '2026-09-07'
    category: gap
    scope: framework
    title: role-assumption-without-a-communicate-back-step-escalates-a-busy-peer-as-unreachable
    status: proposed
    description: >-
      The universal-polling rule's concurrent-session role-allocation
      handshake specifies proposal -> unanimous ack -> act, and routes an
      unreachable or disagreeing peer to the governor. It does not require the
      receiving assistant to say "I do not hold that role," and it lets the
      initiator treat a non-reply as an unreachable peer. A Codex session,
      assigned RUW/v2.10 planner work by the governor, published a
      temporary-allocation proposal (jqrm) that assumed a concurrent Claude
      session held planner-architect. That Claude session was active as
      contribution-auditor, jqrm was not addressed to that role, and it did
      not reply. Codex then escalated an "unreachable peer" via MR !2474 and
      asked the governor to authorize proceeding without the acknowledgement.
      The same shape recurred immediately afterward when the build-engineer,
      capability-developer, and infosec-sentinel reviews of MR !2478 were
      routed to "Claude" (232s, s1kq, 6hqm) and were only unblocked by a
      direct governor "proceed as proposed" assignment. In every case the
      missing steps were: the receiver explicitly communicating the role it
      actually holds, and the initiator then explicitly requesting a
      temporary allocation with a real accept/decline/counter window before
      escalating. The governor closed the gap with an immediate AGF-wide
      design decision (s5gs) and a Gate 1 rule/loader projection handoff
      (r3wc).
    agents_involved:
      - coder-tester
      - contribution-auditor
      - governor-reviewer
    framework_section: always/universal-polling-and-autonomous-continuation-rule.md
    business_impact:
      type: cost_overhead
      description: >-
        A reviewer session that was simply busy in another role was
        misclassified as an unreachable peer, producing an escalation MR and a
        governor decision where a one-line "not my role" reply plus an explicit
        temporary-allocation request would have resolved it. The governor had
        to manually short-circuit the same pattern a second time for the
        !2478 review routing. No unsafe merge, release, or data loss resulted;
        the cost is avoidable coordination volume and governor attention.
    recommendation: >-
      Add two steps to the concurrent-session role-allocation handshake, as
      decided in governor record s5gs and effective immediately: (1) a
      receiving assistant that does not recognize holding an assumed role MUST
      communicate that back through coordination, and silence or being busy in
      another role MUST NOT be treated as an unreachable peer; (2) the
      initiator MUST then explicitly propose a temporary allocation and give
      the receiver a real chance to accept, decline, or counter before
      escalating an unreachable-peer or disagreement to the governor. A direct
      governor assignment may still settle the allocation, with the affected
      sessions still acknowledging it. The canonical home is the
      universal-polling rule's Concurrent-session role allocation section,
      with a compact cold-start pointer in root and template AGENTS.md and
      every shipped specialist definition; the durable projection is Gate 1
      work order r3wc. Underlying session-level addressing is tracked in
      issue #121.
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 2
      evidence_refs:
        - 'docs/coordination/20260907T045703Z-coder-tester-jqrm.md and MR !2474: Codex assumed a concurrent Claude session held planner-architect, then escalated the non-reply as an unreachable peer.'
        - 'docs/coordination/20260907T061351Z-planner-architect-232s.md, 20260907T061356Z-planner-architect-s1kq.md, 20260907T061400Z-planner-architect-6hqm.md: build/capability/infosec reviews of MR !2478 routed to "Claude" without a communicate-back or explicit temporary-allocation step, unblocked only by a direct governor assignment.'


  - id: 20260906T124236Z-8487
    date: '2026-09-06'
    category: gap
    scope: framework
    title: mcp-startup-is-not-complete-until-the-active-agent-can-call-a-tool
    status: proposed
    description: >-
      A long-running AGF development session performed coordination and
      validation work through the agov CLI even though the repository-local
      agov-mcp server was configured and enabled in the Codex host. The
      configured server process was running, both release binaries existed,
      `codex mcp list` reported the server enabled, and a direct JSON-RPC
      initialize plus tools/list smoke test returned the expected tool catalog.
      Nevertheless, the active task had no callable `mcp__agov__*` tools. Its
      tool catalog had not acquired the server, so the session silently kept
      using shell calls. The configured binary was also repository-local but
      built from a root checkout 96 commits behind origin/main, showing that a
      path under tooling does not by itself prove a bleeding-edge build.

      The problem was detected only after the token ROI report showed little
      MCP use. Configuration presence, an enabled listing, a live process, and
      server protocol health therefore do not establish end-to-end capability
      in the agent that is expected to use it.
    agents_involved:
      - coder-tester
      - governor-reviewer
    framework_section: tooling/build-agov-first-and-use-it-heavily
    business_impact:
      type: cost_overhead
      description: >-
        The session spent avoidable context and operator attention on generic
        shell invocations and discovered the missing structured capability
        late in release work. Split telemetry and the absence of MCP transport
        attribution also made the resulting token ROI evidence incomplete.
    recommendation: >-
      Make AGF development cold start an end-to-end capability check. Build the
      repository-root release binaries from a source-compatible current
      checkout; register agov-mcp with an absolute command path and the matching
      AGOV_MCP_AGOV_BIN; configure the assistant-specific AGOV_TOKEN_ROI_LOG;
      restart or recreate the client/task surface as required; and call one
      read-only `mcp__agov__*` tool from the actual active task. Fail the MCP
      readiness check when only configuration, process, protocol-smoke, or
      `codex mcp list` evidence exists. Fall back visibly to the CLI when the
      callable-tool check fails, and record the gap rather than implying MCP
      use. Reverify source fingerprint or rebuild after the durable checkout
      advances so a repository-local path cannot mask a stale binary.
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 1
      evidence_refs:
        - '2026-09-06 Codex AGF release session: enabled repo-local agov-mcp passed initialize/tools-list while the active task exposed no mcp__agov__ tools.'


  - id: 20260909T021145Z-cd7k
    date: '2026-09-09'
    category: process
    scope: framework
    title: agent-advancement-proposal-reproposed-a-step-a-prior-governor-decision-had-already-completed
    status: proposed
    description: >-
      Asked as capability-developer to "propose propeller advancement
      steps", a Claude session authored an ordered path (drtp) whose first
      step P-0 was "the governor confirms or revises the Stage 4 activation
      parameter set". At authoring time the session had read the Propeller
      rule, the agent definition, the current manifest status, issue #131's
      title, and a companion coordination-protocol analysis, but had not
      fully read governor decision 20260907T151325Z-governor-reviewer-2emq.
      One message later, authoring the follow-on directive transcription
      (ssae), the session read 2emq in full and found its section 2b had
      already "confirmed and held ready" that exact parameter set weeks
      earlier, and had amended Stage 4 launch to a named v2.11 follow-up.
      P-0 was therefore already done; the proposal re-proposed a completed
      governor decision as pending. The header framing of P-2 as "Level 4
      to Level 5" was also loose against qkj2 and 2emq, which are explicit
      that only a genuine unattended scheduled wake after activation proves
      Level 5. No downstream effect: drtp was advisory, the error was
      corrected within the same session before any plan or manifest change,
      and issue #131 already carried the accurate picture. The structural
      enabler is the same coordination staleness this session filed
      separately (jprj CP references, issue #122): a reader of the current
      manifest and the immediate prompt cannot see that a prior decision
      already settled the question without walking the full decision chain.
    agents_involved:
      - capability-developer
      - planner-architect
      - governor-reviewer
    framework_section: agents/capability-developer.yaml
    business_impact:
      type: cost_overhead
      description: >-
        One advisory record proposed a step already taken, and the
        correction consumed part of the next work cycle. No wrong plan,
        manifest flip, gate, or release resulted because the proposal was
        advisory and self-corrected before execution. The cost is avoidable
        rework and a proposal that briefly misrepresented the governance
        state of an agent's activation.
    recommendation: >-
      Before authoring an agent evolution, maturity, phase, activation, or
      boundary proposal, the capability-developer session should walk the
      complete governor-decision and capability-review chain for that
      specific agent, not only its current manifest state plus the
      immediate prompt. In practice: resolve every governor decision-record
      and capability-review that names the agent, and confirm which
      required steps each already completed, before proposing a next-step
      path. This is cheap when the agent's decision history is short and
      necessary when it is not. It also strengthens the case for the
      self-announcing-supersession and decision-status tooling already
      tracked in issue #122 and jprj, which would let a reader see a
      settled question without reconstructing the chain by hand.
    severity: minor
    confidence:
      level: single-adopter
      evidence_count: 1
      evidence_refs:
        - 'docs/coordination/20260909T014426Z-capability-developer-drtp.md vs docs/coordination/20260907T151325Z-governor-reviewer-2emq.md section 2b: drtp P-0 proposed governor confirmation of Stage 4 parameters that 2emq had already confirmed; corrected in docs/coordination/20260909T015104Z-governor-reviewer-ssae.md.'


