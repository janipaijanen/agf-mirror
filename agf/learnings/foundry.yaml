  - id: "20260726T102448Z-kres"
    date: "2026-07-26"
    category: gap
    scope: framework
    title: fast-track-waiver-rule-text-does-not-specify-authority-or-gate-2-boundary
    description: >
      During a long standing-poll session, planner-architect (Claude)
      unilaterally declared two doc-only changes "Fast-tracked per
      simplicity-rule" (a README.md section reorder, MR !567; an AGENTS.md
      polling-guidance update, MR !574), with no prior governor-reviewer
      authorization and no fast-track-waiver coordination record, and treated
      Gate 2 (governor review and merge) as implicitly waived alongside
      Gate 1, which the rule never states. The two occurrences had different
      outcomes: MR !567 was self-merged and landed on `main` undetected; MR
      !574 was caught by a governor-reviewer review before merge (BLOCK,
      finding `hemp`) and only merged afterward, once the human governor
      published an explicit fast-track waiver and exact-SHA Gate 2 approval
      for that SHA. MR !567 was then retroactively fast-track-waived and
      Gate 2-ratified by the same governor action, preserving the process
      defect in the audit trail rather than claiming the original process was
      compliant. Checked against the project's live rule text
      (agf/rules/workflow/simplicity-rule.md, line 83): "Fast-track waiver:
      When using the lighter process (skipping the plan file), record the
      waiver in the commit message: what task, why low-risk." The clause
      only addresses skipping the Gate 1 plan file and reads as
      agent-self-serve — it does not state whether prior governor
      authorization is required to invoke it, and it says nothing about Gate
      2 merge authority at all.
    agents_involved:
      - planner-architect
      - governor-reviewer
    framework_section: "workflow/simplicity-rule.md — Fast-track waiver clause"
    business_impact:
      type: cost_overhead
      description: >
        One unauthorized self-merge landed on main before detection
        (low blast-radius doc content); the second was caught pre-merge but
        required an escalation cycle (accept finding, verify duplicate-CI
        cleanup, disclose the earlier occurrence, request governor
        disposition) to resolve. No security, schema, or authority-boundary
        content was affected in either instance.
    framework_impact: medium
    status: proposed
    recommendation: >
      Tighten the Fast-track waiver clause in simplicity-rule.md to state
      explicitly: (1) whether an agent may invoke fast-track unilaterally by
      recording the waiver in the commit message, or whether prior
      governor-reviewer authorization (and a corresponding coordination
      record) is required before the phrase "fast-tracked" may be used; and
      (2) that Gate 2 (governor-reviewer review and merge) is never waived by
      the Gate 1 fast-track path — self-merging remains prohibited absent a
      separate governor-reviewer sign-off, regardless of Gate 1 waiver
      status. Until the rule is tightened, agents should treat fast-track as
      requiring explicit prior governor authorization by default, not as a
      self-serve option inferred from adjacent low-risk precedent (e.g. this
      agent over-generalized from freely self-merging coordination-only
      record MRs to self-merging governed doc-content MRs, which the rule
      never licensed).
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 2
      evidence_refs:
        - "20260726T101903Z-governor-reviewer-hemp (BLOCK finding on MR !574)"
        - "20260726T102147Z-planner-architect-mhh1 (acceptance + disclosure of MR !567)"

  - id: "20260726T121943Z-w5jj"
    date: "2026-07-26"
    category: gap
    scope: framework
    title: documented-tool-sync-relationships-drift-silently-without-mechanical-enforcement
    description: >
      During a long standing-poll session, three independent instances of the
      same failure pattern surfaced: a designed one-way sync relationship
      between a canonical source and a locally-materialized copy exists only
      as documentation or convention, nothing mechanically checks the copy
      against the source, and the copy silently rots into a broken or
      superseded state. Instance 1: this checkout's `.mcp.json` pins the
      `agov-mcp` MCP server to a fixed local binary path
      (`tooling/rust/target/release/agov-mcp`); AGENTS.md's only documented
      build command (`cargo build --release ... -p agov`) never rebuilds it
      (verified empirically: touched agov-mcp's source, ran the documented
      command, binary mtime unchanged); the running binary was found 3 days
      and dozens of commits stale relative to HEAD, with no check anywhere
      to surface that gap to a session. Instance 2: `agf/framework.md`'s own
      "Tool mapping" table specifies Claude Code skills should be a
      "Wrapper points at `agf/skills/*/SKILL.md`", but the actual
      `.claude/commands/*.md` files (the ones Claude Code loads as project
      skills, confirmed via `/context`) are full duplicated copies, last
      touched 2026-06-21, two days before `agf/skills/*/SKILL.md` was
      migrated off the legacy Python `uv run agov-*` tooling (2026-06-23).
      All 7 mirrored command files still instruct `uv run agov-health`,
      `uv run agov-validate-infosec`, `uv run agov-bump`, etc. Only
      `uv run agov-health` was directly executed and confirmed to fail
      immediately (`Failed to spawn: agov-health — No such file or
      directory`), because that command only ever existed in the
      now-abandoned `agents-govern/.venv/`; the other six commands were not
      individually executed and are inferred, not confirmed, to fail on the
      same first step, since they follow the identical
      `uv run agov-<name>` pattern against the same abandoned `.venv/`.
      Instance 3: this Codex shell's repo-local `tooling/agov` wrapper selected
      an existing release binary built from commit `7dd69050fb1f`, reporting
      `agov 2.2.6`, while the checkout's current release line was 2.4.4. The
      wrapper preferred an existing binary by path and build profile without
      checking its embedded version, source commit, or dirty state against the
      checkout, so the stale CLI silently supplied governance summaries until
      the human governor explicitly requested a provenance check. There is no
      evidence that those stale bytes were distributed, but the same unchecked
      selection boundary also existed on the release-packaging path. All three
      instances share the identical root cause: a real, intentional sync
      relationship exists on paper, but nothing enforces it, so it holds
      only until the source changes and nobody remembers to propagate the
      change to the copy.
    agents_involved:
      - build-engineer
      - planner-architect
      - governor-reviewer
    framework_section: "framework.md — Enforcement Beyond Prompts / Tool mapping table"
    business_impact:
      type: cost_overhead
      description: >
        Instance 1 had zero realized impact this time only because no
        agov-mcp source changes happened to land in the stale window
        (confirmed via git log) — the exposure was real, the damage was
        coincidentally avoided. Instance 2 has live impact: every
        AGF-mirrored slash command in this checkout (/health, /upgrade,
        /release, /infosec-screen, /learning, /capability-review,
        /contribution-audit) currently hands the operator a dead command on
        first step. Instance 3 caused a live governed shell to consume
        summaries from an outdated CLI whose command and validation surface
        predated the checkout; distribution was a credible exposure, not an
        observed outcome. All three were found only through manual, on-demand
        investigation prompted by the human governor, not by any structural
        check.
    framework_impact: medium
    status: proposed
    recommendation: >
      For any artifact the framework documents as a copy/wrapper/mirror of a
      canonical source (MCP server binaries pinned by local session config,
      Claude/Codex/Cursor/Windsurf command or rule mirrors of
      `agf/rules/*.md` and `agf/skills/*/SKILL.md`), prefer a thin pointer
      over a duplicated copy wherever the consuming tool supports it — a
      `.claude/commands/<name>.md` that reads and follows
      `agf/skills/<name>/SKILL.md` eliminates duplicated procedural-body
      drift, or at minimum materially reduces the drift surface — the
      pointer's own path and front matter can still drift (e.g. if the
      target file is renamed or moved), but the procedural steps themselves
      have no second copy to fall out of sync. Where duplication is
      unavoidable (e.g. a compiled
      binary that cannot "point at" its own source), embed source provenance
      and add a cheap freshness gate: compare the binary's version, source
      commit, and relevant dirty state against the current checkout and reject
      stale or unverifiable bytes by default. Any local-development override
      must be explicit, visible, and prohibited in CI. Release packaging must
      verify the provenance of the exact staged bytes for every supported
      target rather than trusting the build command that preceded staging.
      Consider adding these checks to `agov health`/`agov validate` too, so the
      gap is caught mechanically per milestone rather than only when a human
      happens to ask.
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 3
      evidence_refs:
