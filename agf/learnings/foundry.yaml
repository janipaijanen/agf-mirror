# ---- Learning Records ----
# Legacy records L001–L017: see agents-govern/learnings/foundry.yaml
# Transitional records L018-L021 were created before the timestamp-ID
# convention for learning records. New learning IDs use YYYYMMDDThhmmssZ with
# an optional -<4-char> suffix for same-second disambiguation.

learnings:

  - id: L018
    date: "2026-06-20"
    category: gap
    agents_involved: [coder-tester, planner-architect, governor-reviewer]
    summary: >
      Multi-agent polling can silently diverge when agents watch different
      branches without an explicit branch-watch ownership protocol.
    detail: >
      During the Rust agov Phase 1 and readable-ID planning work, Codex and
      Claude both ran coordination polling loops, but they were watching
      different upstream branches: one on the Rust implementation MR branch and
      one on the readable-ID planning branch. Each timer was locally correct,
      yet the user had to reconcile which branch was being watched by whom.

      The friction is not a tool failure; it is an ownership ambiguity. Branch
      watch state is operational coordination state, but it was only present in
      ephemeral chat/timer output rather than in a durable coordination record.
      This makes it easy for agents to miss relevant messages, duplicate
      polling, or report stale confidence about "no new coordination" on the
      wrong branch.

      The useful pattern is to make branch watching explicit whenever multiple
      agents are active: record which agent is watching which branch/upstream,
      the polling interval, the expected duration, and whether the watch is
      active, passive, or handed off. A later agent can then decide whether to
      keep, move, or stop a timer without relying on session memory.
    framework_impact: medium
    status: proposed
    recommendation: >
      Add a lightweight branch-watch protocol to coordination guidance. When an
      agent starts or changes a polling timer, it should record the branch,
      upstream, interval, duration, purpose, and owner in coordination, or use a
      future `agov watch`/`agov session` helper that records the same state.
      One branch should have a named primary watcher; additional watchers should
      be marked passive or scoped to a different branch. Status replies should
      include the watched branch so "no new coordination" is never ambiguous.

  - id: L019
    date: "2026-06-20"
    category: bug
    agents_involved: [planner-architect, coder-tester]
    summary: >
      agov coord brief --id-format readable appended a redundant -<role> suffix
      to the output filename when the role is already embedded in the readable
      ID stem.
    detail: >
      The readable coordination ID format is
      YYYYMMDDThhmmssZ-<role-slug>-<4-char-suffix>. The filename for a
      readable-ID file should be <id>.md — the role is part of the ID itself
      and does not need to be appended again.

      agov coord brief --id-format readable was producing filenames of the form
      <id>-<role>.md (e.g. 20260620T214350Z-coder-tester-g66b-coder-tester.md)
      — doubling the role component. Two files committed with this wrong suffix
      are now permanent historical artifacts on main (they cannot be renamed
      once pushed). The bug was surfaced by the planner-architect during the
      polling loop and documented in coordination finding
      20260620T215403Z-planner-architect-8b8b.

      By contrast, ULID-format coordination IDs do NOT embed the role in the
      ID itself, so their filenames legitimately use the form
      <26-char-ulid>-<role>.md. The two formats have different filename rules,
      and the generator was applying the ULID rule to readable IDs.
    framework_impact: medium
    status: proposed
    recommendation: >
      Fix agov coord brief --id-format readable to output <id>.md (no appended
      role suffix). Add a validator advisory that detects the double-role
      suffix pattern and warns that the file was likely generated with the
      buggy version. Document the per-format filename rules in AGENTS.md and
      the coordination-id rule so future contributors know which format uses
      which filename convention.

  - id: L020
    date: "2026-06-21"
    category: process
    agents_involved: [planner-architect]
    summary: >
      When an agent resumes from a compacted context, it must file a
      coordination entry for the polling cycle even if no new branch activity
      was found — not only when new messages are present.
    detail: >
      On context-resume after compaction, the planner-architect (Claude)
      initially responded with text only, without first running git fetch or
      filing a coordination entry. The coordination-message-rule requires that
      any "action" — including a polling-cycle assessment — produces a
      coordination entry referencing the triggering state. A "no new activity"
      assessment is still an observable outcome that other agents and the human
      need to be able to reconstruct from the coordination trail.

      The failure mode: after compaction, the agent loses the session state
      that normally drives the polling discipline. The rule is context-
      independent, but the discipline is only reliable if explicitly re-
      derived on each resume rather than assumed to be covered by prior
      session behaviour.

      The user's correction: "did [you] send a coordination message? if not,
      why not? you MUST always send a coordination message for other LLMs to
      catch-up with your work and assessments."
    framework_impact: low
    status: proposed
    recommendation: >
      Add a cold-start checklist item to the coordination polling loop
      description: "on context-resume, always run git fetch and file a
      coordination entry for the current cycle status before responding in
      text." Consider adding this as a check in the session.resume guidance
      so agents explicitly re-derive the coordination discipline rather than
      assuming it carries over from the prior session state.

  - id: L021
    date: "2026-06-21"
    category: gap
    agents_involved: [coder-tester, governor-reviewer]
    summary: >
      AI agents must not claim durable timer coverage unless the timer is backed
      by a real persistence and notification mechanism visible outside the
      current chat turn.
    detail: >
      The governor asked Codex to start 300-second and 180-minute timers. Codex
      first attempted to create shell `sleep` processes and write their output
      to `tmp/`, then correctly recognized that this does not satisfy the
      operational need. A shell timer may continue in the local process table,
      but it does not wake the AI agent after the turn ends, does not produce an
      inter-agent coordination signal by itself, and can create false confidence
      if the agent later says "timers are running" without a durable watcher.

      The failure mode is a capability illusion: the user asks for an agent
      behavior ("remind yourself / resume after interval"), while the available
      mechanism only creates a local side effect ("a process may append to a
      log"). Treating those as equivalent weakens coordination because other
      agents cannot rely on the timer state and the human may assume work will
      resume automatically.

      The useful rule is to be explicit about timer semantics. During an active
      turn, an agent can poll, watch CI, and report status on a cadence. Across
      turns, it needs a durable mechanism: a coordination claim/watch record,
      external scheduler, issue/MR reminder, or future AGF watch/session
      command that records owner, branch, interval, expiry, and expected action.
      Without that mechanism, the honest answer is "I cannot start a timer that
      will wake me later; I can record the desired check and act when resumed."
    framework_impact: medium
    status: proposed
    recommendation: >
      Add explicit timer/watch semantics to session and coordination guidance.
      Agents should distinguish active-turn polling from durable timers, and
      must not report timers as active unless the mechanism can notify or be
      observed by future agents. A future `agov watch` or session-resume feature
      should record timer owner, branch or MR, interval, due time, expiry,
      notification target, and whether the watch is active, advisory, or
      expired.

  - id: "20260621T084900Z"
    date: "2026-06-21"
    category: gap
    agents_involved: [planner-architect, coder-tester]
    summary: >
      Coordination messages are only visible to other AI assistants after
      both git commit and git push — a local commit is invisible across
      sessions and environments.
    detail: >
      When a coordination message is committed locally but not pushed, other
      AI assistants in separate sessions or environments cannot see it, even
      if they run git fetch. The fetch only retrieves objects that have been
      pushed to the remote.

      This matters in multi-agent workflows where one AI (e.g., Claude in an
      interactive session) files a coordination note and another AI (e.g.,
      Codex in a separate environment) is expected to pick it up via the
      polling loop. If the author commits but does not push, the recipient's
      cold-start protocol (git fetch --all) returns nothing and the message
      is effectively dropped.

      The failure mode is silent: the author sees the file locally and assumes
      the channel is up to date; the recipient runs a clean fetch and sees
      nothing. No error is produced on either side.

      The constraint is architectural: AI assistants are isolated processes
      with no shared filesystem. The only shared state is the remote git
      repository. A commit that does not reach the remote does not reach other
      agents.

      Observed on 2026-06-21 when a coordination note to coder-tester was
      committed but not yet pushed; the user explicitly stated: "other AIs
      only can find coordination messages which are stored in the git and
      pushed."
    framework_impact: medium
    status: proposed
    recommendation: >
      Add an explicit rule to the coordination channel guidance: a coordination
      message is not filed until it is both committed and pushed to the remote.
      Committing without pushing is equivalent to not filing the message from
      the perspective of any other agent. The cold-start protocol and polling
      loop descriptions should state this requirement explicitly. Consider
      adding a push step to the coordination message checklist alongside the
      commit step, so the two actions are treated as a single atomic unit.

  - id: "20260621T084922Z"
    date: "2026-06-21"
    category: gap
    agents_involved: [planner-architect, coder-tester, governor-reviewer]
    summary: >
      Sequential learning IDs (L001, L002, ...) cause write conflicts when
      multiple agents or contributors add entries concurrently; timestamp-based
      IDs eliminate the collision surface.
    detail: >
      Learning entries were originally identified with sequential integers
      (L018, L019, L020, L021). Sequential IDs require a shared counter: the
      next ID is determined by reading the highest existing ID and incrementing
      it. When two agents or two contributors append a learning entry in
      separate sessions or branches without coordinating the counter, they
      produce entries with the same ID. The conflict is not detected until
      merge time, by which point the entries may have been referenced elsewhere.

      The coordination channel solved this same problem by using timestamp-based
      IDs in the format YYYYMMDDThhmmssZ (with an optional random suffix for
      sub-second disambiguation). A timestamp ID requires no shared counter:
      each agent generates the ID from the local clock at write time. Two
      entries filed in different sessions at different moments are structurally
      guaranteed to have different IDs.

      The same logic applies to learning IDs. Learning entries are appended
      independently by different agents across sessions and branches. The
      sequential integer format has no enforcement mechanism to prevent
      collisions; timestamp IDs have no collision surface under normal
      conditions (wall-clock second granularity is sufficient for the
      infrequent rate at which learnings are filed).

      Observed on 2026-06-21 when the user pointed out that L-number IDs
      would collide if multiple contributors added entries on different branches:
      "learning entries must not be sequential, but also time-based as the
      coordination ids are. Reason: prevent id conflicts."
    framework_impact: medium
    status: proposed
    recommendation: >
      Replace all sequential L-number learning IDs with timestamp IDs in the
      format YYYYMMDDThhmmssZ, matching the coordination channel convention.
      Update: (1) the learnings/_template.yaml to specify the timestamp format
      for the id field; (2) the LEARNINGS.md guidance; (3) the agov-validators
      learning record schema to accept the new format and reject bare integers
      or L-prefixed integers; (4) any documentation or rules that reference the
      sequential format. Existing sequential IDs in foundry.yaml should be
      migrated to timestamp IDs derived from their entry dates (or left in place
      with a note that they predate the timestamp convention — either approach
      is acceptable as long as the schema accepts both during a transition
      window).

  - id: "20260621T143908Z"
    date: "2026-06-21"
    category: gap
    agents_involved: [planner-architect]
    summary: >
      After context compaction, agents default to manual git and file reads
      for session orientation instead of calling agov session resume first,
      defeating the tooling's token-saving purpose at the highest-cost moment.
    detail: >
      On 2026-06-21, after a context compaction mid-session, the planner-architect
      resumed by reading the session state note, running git log, and directly
      inspecting coordination files — none of which were recorded in the token
      ROI log. The agov session resume command exists precisely for this moment:
      it compacts coordination state into a brief oriented summary at a fraction
      of the token cost of manual file reads.

      The ROI log only records a saving when the tool runs. Manual reads consume
      more tokens and record nothing. The cold-start guidance documents the
      session resume command but does not state that it must be the first
      substantive action before any manual reads. Without that constraint, agents
      default to familiar git and file reads on context-resume, assuming the
      agov invocation is optional or can come later.

      The failure mode is invisible: the agent arrives at the correct state
      either way, but the token-saving path goes unused at the most expensive
      moment of every session — resumption after compaction.

      The user surfaced the gap by noting no new ROI entries appeared in
      tmp/agov-token-roi.jsonl during the planner-architect's session.
    framework_impact: medium
    status: proposed
    recommendation: >
      Update the cold-start and session-resume guidance to make agov session
      resume the mandatory first substantive action — before any git log, git
      show, direct file reads, or coordination file inspection. Add a checklist
      item to the context-resume protocol: "run agov session resume before any
      manual reads; the tooling compacts what you would otherwise read at full
      token cost." Document that this applies equally to fresh sessions and to
      context-resume after compaction, since the failure mode is identical in
      both cases. Consider surfacing this as a validator warning when the ROI
      log shows a session with no session.resume entry.

  - id: "20260621T182100Z-9x4m"
    date: "2026-06-21"
    category: gap
    agents_involved: [coder-tester, governor-reviewer]
    summary: >
      Figure labels that include numeric counts must explain what the numbers
      count in both the embedded legend and the surrounding page text.
    detail: >
      The coordination map example used edge labels such as `handoff (22)` and
      `decision-record (9)`. The embedded legend said "Edge label = kind
      (message count)", but the text before the figure did not explicitly tell
      readers that the parenthesized numbers were observed message counts from
      the dated AGF foundry coordination sample. When viewed directly at
      `/reference/figures/coordination-map-example.svg`, the figure therefore
      depended on a compact legend phrase that was easy to overlook.

      This is a figure-quality failure because numbers inside a visual carry
      analytical authority. If the denominator, unit, sampling window, or
      source is unclear, readers can misinterpret the counts as priorities,
      weights, version numbers, sequence IDs, or requirements. Direct SVG URLs
      make the risk higher because the page prose may not be visible.
    framework_impact: medium
    status: proposed
    recommendation: >
      Extend the figure UX standard: any figure that displays numeric labels
      must explain the unit and sampling context inside the figure itself, and
      the page text immediately before or after the figure must repeat the
      meaning in plain language. For generated coordination maps, prefer
      wording such as "parenthesized numbers are message counts in this
      captured channel sample" in the legend or caption-equivalent prose.

  - id: "20260622T103839Z"
    date: "2026-06-22"
    category: validation
    agents_involved: [coder-tester, governor-reviewer]
    summary: >
      Assistant drift diagnostics in AGF 2.1.6 made a copied-loader upgrade
      from 2.1.4 actionable for an adopter.
    detail: >
      During an adopter upgrade from AGF 2.1.4 to AGF 2.1.6, the adopter
      discovered that older copied `.claude/rules/` and `.claude/skills/`
      trees could drift from canonical AGF-owned `agf/rules/` and `agf/skills/`
      content after the framework moved toward small assistant loader files.
      Before AGF 2.1.6, that drift created ambiguity about whether governed
      work would follow current AGF rules or stale copied instructions.

      After adopting AGF 2.1.6, `agov validate` reported the copied assistant
      drift directly and gave remediation guidance. The validator output also
      clarified that `agov validate` does not validate every historical plan or
      coordination record; those records still require explicit `agov plan
      validate` and `agov coord validate` checks.

      The adopter resolved the upgrade ambiguity by preserving intentional
      local project instructions separately, replacing copied command or skill
      bodies with small wrappers pointing to `agf/skills/`, deleting copied AGF
      `.claude/rules/` and `.claude/skills/` trees, and rerunning validation
      until the output was clean. The external learning was filed as GitLab
      issue #8 under adopter codename `amber-register`.
    framework_impact: medium
    status: proposed
    recommendation: >
      Keep the AGF 2.1.6 assistant drift and validation-coverage diagnostics.
      Add a short migration checklist or example cleanup diff for adopters
      moving from copied `.claude/rules/` and `.claude/skills/` trees to
      loader-only assistant files. The checklist should cover preserving local
      project rules outside copied AGF trees, replacing copied skill bodies
      with wrappers that point to `agf/skills/`, deleting copied AGF assistant
      rule and skill trees, and running `agov validate`, `agov plan validate`,
      and `agov coord validate`.

  - id: "20260622T111100Z"
    date: "2026-06-22"
    category: process
    agents_involved: [coder-tester, governor-reviewer]
    summary: >
      GitLab CI artifacts can dominate project storage unless `.gitlab-ci.yml`
      treats repeatable job outputs as short-lived handoff material.
    detail: >
      During release follow-up for AGF 2.1.x, GitLab project statistics showed
      unexpectedly high storage usage even though the repository itself was
      only a few megabytes and package registry uploads were modest. The large
      category was CI job artifacts: about 3.13 GB, compared with about 83.5 MB
      of packages and about 3 MB of repository data.

      The cause was not the durable release surface. It was repeatable job
      output retained too generously: preview distribution bundles, preview
      Rust tooling builds, generated docs/site artifacts, and release handoff
      artifacts configured with long or indefinite retention. These artifacts
      are useful for MR review and for passing files between release jobs, but
      they are not the durable user-archive of record once package
      registry uploads and GitLab Release links exist.

      The operational lesson is that CI configuration needs an explicit
      artifact-retention policy. Durable release assets should live in the
      package registry and release links. CI artifacts should expire quickly
      unless there is a documented reason to keep them. Preview artifacts and
      generated docs builds are especially easy to multiply across branches,
      MRs, retries, and release prep work.
    framework_impact: medium
    status: proposed
    recommendation: >
      Add CI hygiene guidance to AGF release and project templates: every
      artifact-producing job should declare whether its output is durable or
      ephemeral. Preview, docs-build, and review-only artifacts should normally
      expire within a day; release handoff artifacts should expire after a
      short grace period once `release:create` has uploaded durable package
      registry assets. Project maintainers should periodically check GitLab
      storage statistics and delete stale preview/docs-build job artifacts
      rather than deleting packages or release assets.

  - id: "20260622T111800Z"
    date: "2026-06-22"
    category: process
    agents_involved: [coder-tester, planner-architect, governor-reviewer]
    summary: >
      Coordination messages must be committed and pushed to git before they
      count as framework audit-log entries or as discoverable inter-LLM state.
    detail: >
      During multi-agent AGF-NG work, a governor-reviewer pointed Codex to a
      coordination message that another assistant expected Codex to read. The
      file was not visible in the active checkout, any linked worktree,
      `origin/main`, fetched remote refs, or GitLab blob search. From Codex's
      perspective the coordination message did not exist, even though it may
      have existed in another assistant's local workspace.

      This exposes a stricter version of the coordination visibility rule.
      Creating a Markdown file locally is not enough. A local coordination file
      is private scratch until it is committed and pushed to the shared git
      remote. Only pushed coordination records are part of the framework audit
      log, and only pushed records are discoverable by other LLMs that cold
      start by fetching git state.

      The failure mode is misleading because the author can see the file and
      may believe the handoff exists, while every other agent sees an empty
      channel. That breaks both governance reconstruction and practical
      collaboration: downstream agents cannot acknowledge, reference, validate,
      or act on a record they cannot fetch.
    framework_impact: high
    status: proposed
    recommendation: >
      Treat "write coordination message" as incomplete until the file is
      committed and pushed to the shared remote. Update coordination guidance
      and agent checklists to say that pushed git is the framework audit log
      and the inter-LLM discovery surface. Agents should verify that a
      coordination handoff intended for another LLM is visible after fetch, or
      include the record in the same pushed branch/MR that creates the
      downstream obligation. Local-only coordination records should be called
      drafts, not filed messages.

sentinel_ack:
  - finding_id: "ISEC-CROSSRECORD-001"
    decision: "false_positive"
    rationale: >
      agents-govern/ is the frozen 1.1.50 reference distribution,
      not project-authored content. The cross-project phrase is in
      the upstream framework's own documentation.
    acknowledged_by: "governor-reviewer"
    date: "2026-06-10"
