      to acknowledge on its next poll. The acknowledgement remained undone until
      the governor challenged the omission. The observable failure was a false
      completion criterion: no newly listed handoff was treated as no outstanding
      duty. This does not establish a defect in agov's query contract, a hidden
      model motive, or that every ignored historical record was actionable.
