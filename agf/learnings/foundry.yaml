  - id: "20260729T113947Z-dzy7"
    date: "2026-07-29"
    category: gap
    scope: framework
    title: plan-drafting-cited-retracted-issue-finding-from-description-only
    description: >
      Drafting the v2.4.6 recovery patch plan (MR !774), Claude/planner-
      architect cited issue #78 finding 1 (a top-level `docs/` directory
      shipping outside `agf/` in the v2.4.5 archive) as a verified
      adopter-boundary regression and made its relocation mandatory scope.
      The finding had already been explicitly retracted by its own reporter
      in a comment on the issue, and a separate governor canonical-triage
      record had independently confirmed the retraction and directed that
      the declared paths not be relocated. Neither was consulted before
      drafting.

      The mechanism: `glab issue view <n>` prints only the issue's
      description, not its comment thread. The command's own header output
      shows a `comments: N` count, which was seen (`comments: 3`) but not
      treated as a signal requiring a further fetch
      (`glab api projects/:id/issues/<n>/notes`) before citing the issue's
      content as current. The plan's own text additionally claimed
      "re-reading #67 and #78 in full rather than trusting the SoW's
      characterization" — that claim was false as written: only the
      descriptions, not the comment threads, were read in full. This is a
      specific, checkable overclaim, not merely an omission.

      Caught by contribution-auditor and fact-checker review in MR !774
      (`20260729T112856Z-contribution-auditor-h3hr`,
      `20260729T112857Z-fact-checker-n2bq`), both independently reaching the
      same DISSENT/BLOCK disposition before any implementation or release
      action occurred.
    agents_involved:
      - planner-architect
      - contribution-auditor
      - fact-checker
    framework_section: "Verification over Assumption; boundary-shape-testing-rule.md's sibling principle applied to issue-tracker evidence rather than API payloads"
    business_impact:
      type: cost_overhead
      description: >
        A Gate 1 plan drafting/review cycle was spent on scope that had to
        be fully retracted before re-review. No implementation, version,
        tag, or release action was taken on the incorrect scope — the gate
        held — but the correction cost a full review round for both
        contribution-auditor and fact-checker.
    framework_impact: medium
    status: proposed
    recommendation: >
      When citing a GitLab (or equivalent) issue as evidence for a plan,
      always fetch and read its full comment thread
      (`glab api projects/:id/issues/<n>/notes` or equivalent), not only the
      description returned by a summary view command, before citing any
      finding from it as current or verified. Treat a nonzero comment count
      in a summary view's header as a required-fetch signal, not an
      informational aside. Separately: before drafting new disposition for
      an issue, search the coordination channel for an existing canonical
      triage or decision record for that exact issue and treat it as
      controlling if found, rather than re-deriving disposition from
      scratch.
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 1
      evidence_refs:
        - "MR !774: docs/coordination/20260729T112856Z-contribution-auditor-h3hr.md, docs/coordination/20260729T112857Z-fact-checker-n2bq.md"

  - id: "20260801T123732Z-wtfl"
    date: "2026-08-01"
    category: gap
    scope: framework
    title: git-work-tree-flag-polluted-live-repo-index-during-mr-review-setup
    description: >
      While setting up an isolated location to inspect MR !894's content for
      an independent review, Claude/contribution-auditor ran
      `git --work-tree=<scratch-dir> checkout <ref> -- .` against the main
      AGF-NG checkout. `--work-tree` only redirects where files are written;
      it does not change which repository's index is used. The index of the
      live, in-use checkout was silently updated to match MR !894's entire
      tree (including files under a directory the reviewer's own earlier
      work had already relocated out of this repository), while the
      checkout's working-tree files on disk were left untouched. Discovering
      the target directory was not a real worktree (no `.git`), the reviewer
      abandoned that approach and used `git worktree add ... --detach`
      correctly for the actual review, but did not check whether the main
      repository's index had been left polluted by the earlier command.

      The stray staged state was not caught immediately. Git carries staged,
      non-conflicting changes across branch switches, so the pollution
      silently rode along through every subsequent `git checkout <branch>`
      in the main repo. Much later, when publishing the review as a
      coordination record, the reviewer ran a plain
      `git add docs/coordination/<one-file> && git commit`, believing it was
      a single-file commit. `git add <one-file>` only adds that file to
      whatever the index already contains — it does not clear prior stray
      staged entries. The commit captured the entire polluted index (79
      files) alongside the intended file and was pushed to origin before
      being caught.

      The reviewer self-detected the problem (the user did not report it)
      by noticing the pushed commit's unexpectedly large file count, then
      diagnosed the root cause methodically: `git worktree list`,
      `git status`, comparing `git diff --cached --stat` against
      `git diff --stat`, and `git reflog`. The fix was `git reset --hard`
      to the correct upstream tip, recovering the intended file's content
      from the corrupted remote branch, a clean single-file recommit, and a
      `--force-with-lease` push to the same not-yet-merged branch (never to
      `main`). `main` was confirmed unaffected throughout.
    agents_involved:
      - contribution-auditor
    framework_section: "branch-and-worktree-rule.md's AI-assisted branch state verification subsection covers IDE-vs-agent branch collisions from the same root cause class (stray state silently riding across a `git checkout`) but does not yet name `--work-tree` index pollution or a pre-commit `git diff --cached --stat` check as a required verification step."
    business_impact:
      type: cost_overhead
      description: >
        A corrupted 79-file commit was briefly pushed to an unmerged,
        not-yet-reviewed coordination branch before being caught and fixed.
        No shared/protected branch (`main`) was affected at any point, and
        no reviewer or CI cycle was spent evaluating the corrupted state
        before it was corrected. Cost was the reviewer's own diagnosis and
        recovery time, not a wasted review or release cycle.
    framework_impact: medium
    status: proposed
    recommendation: >
      Never use `git --work-tree=<dir> checkout <ref> -- .` (or any bare
      `--work-tree` override) against a repository whose index is also in
      active use for other work — it silently stages the target ref's
      entire tree into that live index without touching the substitute
      directory's own git metadata. Use `git worktree add <path> <ref>
      --detach` for any read-only inspection of another ref; it is the only
      form that gets both an isolated working tree and an isolated index in
      one step. Separately and independently of that specific command:
      before every commit intended to be single-file or otherwise narrowly
      scoped — especially a coordination-record commit, where an
      unexpectedly large diff is a governance-relevant signal, not just a
      hygiene one — run `git diff --cached --stat` and confirm the file
      list matches what was actually intended to change, before running
      `git commit`. Consider whether `branch-and-worktree-rule.md`'s
      AI-assisted branch state verification subsection should be extended
      to name this specific command pattern and pre-commit check
      explicitly; that would be a rule-content change requiring its own
      branch, scope classification under `downstream-impact-rule.md`, and
      review — not something to bundle into the branch that surfaced this
      learning.
    severity: significant
    confidence:
      level: single-adopter
      evidence_count: 1
      evidence_refs:
        - "MR !898 (branch coordination/mr894-review): corrupted commit e8b1f08a caught before governor review, corrected in 7ef4498f and again in b987dc75; docs/coordination/20260801T123434Z-contribution-auditor-6mkq.md"

  - id: "20260802T230821Z-sv7q"
    date: "2026-08-02"
    category: gap
    scope: framework
    title: seven-of-nine-agf-schemas-have-no-per-record-schema-version-field-despite-a-known-working-precedent
    description: >
      Answering a user question about whether `learning.schema.json` and its
      records carry version info (asked in the context of the NASA LLIS
      comparison's proposed schema changes — `status` becoming a real
      field, `superseded_by` switching from a title-pointer to an
      id-pointer), the immediate answer was no: neither the schema's own
      `$schema` field (a JSON-Schema meta-schema reference, not a content
      version) nor any individual record in `agf/learnings/foundry.yaml`
      carries a version marker.

      Generalizing the check across all nine files in `agf/schemas/*.json`
      surfaced a sharper finding than "one schema lacks versioning": this
      project has already built, and requires, the exact pattern needed —
      but only for one schema pair out of nine, and did not generalize it.
      `release-provenance.schema.json` requires a `schema_version` field
      (`const: "2.4"`) on every record in both its `fileRecord` and
      `ociImageRecord` definitions, and a sibling file,
      `release-provenance-legacy.schema.json`, exists specifically to
      recognize pre-v2.4 records that lack `schema_version` — its own
      description states such records are "handled by the validator's
      legacy code path, never upgraded implicitly." **Correction
      (contribution-auditor finding B-SV-2,
      `20260802T231224Z-contribution-auditor-nhrq.md`):** this pair is a
      real, shipped, working answer to *deterministic classification and
      dispatch* between current and legacy record shapes — `schema_version`
      present routes to the current schema, absent routes to the legacy
      recognizer, and a record matching the legacy schema is never
      reported as satisfying the current contract. It is **not** a
      migration mechanism: `provenance::validate_record()` classifies and
      validates, it does not transform a legacy-shaped record into a
      current-shaped one. Safe migration additionally needs retained
      versioned schemas/handlers, a defined transformation and
      compatibility policy, source-to-target conversion tests, and an
      explicit decision about whether historical records are ever
      rewritten at all — none of that follows from stamping a field alone,
      and this project has not built it for any schema, including
      `release-provenance` itself.

      **Correction (contribution-auditor finding B-SV-1, same review):**
      the gap cohort is not "eight of nine" — `release-provenance-legacy.schema.json`
      is not a gap alongside the others; it is the intentionally
      unversioned *half of the working precedent itself* (its entire
      purpose is recognizing records that lack `schema_version`), so
      counting it as an eighth schema that should also gain a version
      field contradicts its actual role. Excluding both halves of the
      `release-provenance` pair leaves **seven current, non-legacy schema
      files** without a dedicated per-record schema-version marker:
      `agent.schema.json`, `coordination-message.schema.json` (the
      highest-volume schema in the project, backing 1,600+ records in
      `docs/coordination/`), `framework.schema.json`, `gate1-plan.schema.json`,
      `learning.schema.json`, `rule-projection-manifest.schema.json`, and
      `rule.schema.json`. `framework.schema.json` belongs in this list
      despite having a `contract_version` property: per its own
      description that value "equals the framework version" — the
      framework's own semver echoed into the one `framework.yaml` record,
      not a marker of which shape of `framework.schema.json` that record
      was written against. It does not solve the same problem
      `release-provenance`'s `schema_version` solves.

      If any of these seven schemas changes shape — which
      `learning.schema.json` is a live, concrete candidate for right now,
      per the NASA LLIS comparison document
      (`docs/plans/nasa-llis-lessons-learned-comparison.md`) — the record
      itself contains no intrinsic, machine-readable discriminator of
      which shape it was authored against (correction, advisory A-SV-1,
      same review: git history, dates, or release boundaries may
      sometimes let an operator *infer* the authoring schema version
      externally; the gap is specifically the absence of a marker
      *inside the record itself*, not an absolute inability to ever know).
      Classifying old from new records would have to rely on heuristics
      (field presence/absence, ID format) or external history instead of
      a stamped version — and even with a stamped version, actually
      migrating a record to a new shape remains a separate, unsolved
      design problem this project has not built for any schema yet.

      This finding was self-detected during a user Q&A, not surfaced by
      any validator, review pass, or incident — the same "structurally
      invisible until someone asks the specific question" pattern this
      project's own `audit-log-completeness-rule.md` and
      `concept-modelling-rule.md` document for other cross-cutting gaps.
    agents_involved:
      - coder-tester
      - contribution-auditor
    framework_section: "agf/schemas/*.json (all nine schema files); agf/schemas/release-provenance.schema.json and release-provenance-legacy.schema.json as the existing classification/dispatch precedent (not a migration precedent); agf/schemas/learning.schema.json as the schema with a concrete, currently-proposed shape change (docs/plans/nasa-llis-lessons-learned-comparison.md) that would land into a corpus with no per-record version marker"
    business_impact:
      type: neutral
      description: >
        This finding predates any migration attempt and any migration
        failure — it is a proactive finding, not a realized cost. The
        exposure is forward-looking: `learning.schema.json` has a
        concrete, currently-proposed
        shape change in flight (the NASA LLIS comparison's `status` field
        and `superseded_by` id-vs-title correction) that would land into a
        corpus with zero version markers, making future classification of
        old-vs-new records heuristic-driven rather than deterministic, for
        that schema and the six others in the same position.
    recommendation: >
      Generalize the `release-provenance.schema.json` pair's
      classification/dispatch pattern, not a migration mechanism this
      project has not built for any schema: for each of the seven current
      schemas without per-record version info, decide (a) whether to
      require a `schema_version` field going forward (const-pinned per
      schema revision, matching `release-provenance`'s exact shape) and
      (b) whether pre-versioning records need their own explicitly-named
      legacy-shape schema (matching `release-provenance-legacy.schema.json`)
      or whether "absence of `schema_version` implies legacy" is safe to
      encode directly in the primary schema's validator logic instead,
      schema by schema — `coordination-message.schema.json`'s 1,600+
      existing records make an explicit legacy-schema split likely
      necessary there specifically, the same shape of decision
      `release-provenance` already made. Do not treat this as one
      blanket change across all seven; each schema's own record volume,
      churn rate, and change risk should independently decide whether it
      needs a legacy-split schema or a lighter validator-side rule.
      Actual record migration (transformation, compatibility policy,
      tests) is a separate, harder design problem this learning does not
      claim is solved by any existing AGF precedent, including
      `release-provenance` — any future plan that assumes stamping
      `schema_version` alone enables migration must design and test that
      separately. `learning.schema.json` is the most time-sensitive of
      the seven, given the NASA-LLIS-comparison shape change already
      proposed against it. This recommendation has been adversarially
      reviewed once (`nhrq`, findings B-SV-1/B-SV-2/A-SV-1/A-SV-2, all
      addressed above); a bounded renewed review of the corrections is
      requested before any schema change is proposed on the strength of
      this learning alone.
    severity: minor
    confidence:
      level: single-adopter
      evidence_count: 1
      evidence_refs:
        - "Direct inspection of all nine agf/schemas/*.json files, 2026-08-02: grep and python3 json.load() confirmed schema_version presence/absence and required-field status per schema, not inferred from documentation."

  - id: "20260803T205236Z-gt3x"
    date: "2026-08-03"
    category: gap
    scope: framework
    title: three-track-external-multi-model-review-of-v250-rc1-shows-gate1-gate2-authority-and-record-immutability-are-schema-unenforced
    description: >
      Following the project's own bounded three-track review methodology
      (documentation, artifact/tooling, adversarial governance — per the
      published ai-evaluation-dossier) against the real published
      `v2.5.0-rc.1` release, two independent AI systems (Grok, running
      real commands against downloaded release assets and a live
      GitLab Container Registry check; and this session, orchestrating
      sandboxed subagents that actually installed and exercised the
      release, plus hand-reproducing the most consequential claims a
      second time afterward) converged on the same structural finding
      via different attack surfaces.

      Grok's adversarial pass attacked the record/schema layer directly
      and found: `gate1-plan.schema.json`'s `status: approved` validates
      with an empty `gate1_approved_by`, and separately with
      `gate1_approved_by` set to a non-governor AI role
      (`coder-tester`) — both independently reproduced in this session
      against the real schema. It also found that editing an existing
      coordination record's body in place (leaving `id`, `timestamp`,
      and `immutable: true` untouched) still validates `OK` and is
      served live by `agov handoff next` as the current authoritative
      content — also independently reproduced. This session's own
      adversarial subagent attacked a different layer (raw git/CI) and
      found no `agov`-related git hooks exist anywhere in the tracked
      repository; a branch with zero Gate 1 plan and zero Gate 2
      approval records merged instantly in a sandbox with **no CI
      attached at all**. That sandbox condition shows the absence of any
      local technical backstop; it does not by itself describe this
      project's actual hosted configuration. Separating the three
      layers precisely: human procedural authority (who is entitled to
      approve a gate) is unaffected by either finding; this project's
      hosted merge backstop (`coord publication-check`,
      `only_allow_merge_if_pipeline_succeeds`) blocks merge on pipeline
      success and validates record shape; neither layer authenticates a
      governor, requires a Gate 1 plan or Gate 2 decision to exist for
      every substantive MR, or proves a validated approval record is
      binding. The two passes are complementary, not redundant: one
      shows the schema layer accepts forged authority; the other shows
      a workspace with zero local backstop and no CI attached would not
      have stopped the underlying merge regardless.

      A separate Track 1 (documentation) pass by a third model (Lumo)
      contained fabricated technical specifics — schema filenames and
      CLI flags that do not exist in the actual repository, plus
      "governance-policy endpoint" language suggesting partial
      conflation with an unrelated hosted-service product — verified
      directly against the downloaded release archive and flagged
      separately as a reviewer-reliability concern rather than a
      documentation defect.

      After this session raised the point that "a human will own Gate
      1/Gate 2" is not one adoption checkbox among several but is
      functionally the framework's entire enforcement mechanism given
      the above, Grok independently revised its own initial framing to
      match, producing the same corrected line from its own reasoning:
      the tooling gives schema, vocabulary, and a place to put the
      record, not identity binding or tamper-evidence. Cross-model
      convergence on the corrected framing, reached collaboratively
      rather than asserted unilaterally, is itself part of the evidence
      here.
    agents_involved:
      - contribution-auditor
      - governor-reviewer
      - coder-tester
      - fact-checker
      - planner-architect
    framework_section: "agf/schemas/gate1-plan.schema.json (gate1_approved_by not required non-empty or role-bound when status:approved); agf/schemas/coordination-message.schema.json (from: is unauthenticated free text; immutable:true is an asserted label, not a content-hash-enforced guarantee); tooling/rust agov handoff (to: all handoffs invisible to agov handoff next <role>, tested separately in the same review); .gitlab-ci.yml (structural checks — publication-check, pipeline-success-required merge — run in hosted CI and there is zero local git-hook backstop; this is a delivery-context observation, not a claim that CI itself authenticates or grants Gate 1/Gate 2 authority)"
    business_impact:
      type: prevented_loss
      description: >
        This finding directly corrected the "Evidence and maturity"
        framing being actively drafted for the v2.5.1 README/Pages hero
        copy in the same session
        (docs/plans/20260803T192952Z-pages-readme-visual-refresh-v251.md)
        before any of it shipped publicly — without this review, that
        copy risked describing Gate 1/Gate 2 in language a reader could
        reasonably take as mechanically enforced, when the published
        tooling does not enforce approval identity, non-emptiness, or
        record immutability. The correction was reached collaboratively
        with an independent external AI reviewer, which also revised its
        own initial framing after seeing the same evidence, rather than
        being asserted unilaterally.
    recommendation: >
      Give the four Track 3 findings
      (docs/coordination/20260803T204257Z-planner-architect-sjqm.md) an
      explicit disposition rather than letting them sit as review output:
      (1) require gate1-plan.schema.json's gate1_approved_by to be
      non-empty and match an active governor-equivalent MANIFEST role
      when status:approved — treated as structural hygiene against the
      exact-role-string case, not as identity proof; the fix itself
      needs a separately governed cross-record validator (a new check
      alongside the existing advisory_consultation MANIFEST lookup in
      agov-coord's plan validator) and a defined missing-MANIFEST
      policy that fails closed (blocking, not silently skipped) for
      this specific field, distinct from the existing
      advisory_consultation check's current fail-open-on-missing-
      MANIFEST behavior, plus an explicit migration path for existing
      approved/active/complete plan records rather than an
      undocumented breaking change; (2) decide whether
      coordination-message from: identity binding is in scope for agov
      at all, or explicitly document it as unauthenticated and
      human/CI-trust-dependent everywhere the framework currently
      implies an audit trail; (3) add at minimum a lightweight
      content-hash-on-first-reference check so a record's body can't
      silently diverge from what a later references-to pointed at —
      this narrows but does not close the gap: it does not detect
      mutation that happens before the first reference, and it does not
      by itself identify which historical version is the canonical
      trusted one, so it should be described as raising the cost of
      undetected mutation, not as tamper-evidence; (4) state plainly, in
      adopter-facing docs and not only inferable from source, that
      agov's own enforcement boundary stops at schema shape and a small
      number of cross-record invariants — real Gate 1/Gate 2 authority
      is a human-and-CI-configuration property, not an agov validate
      guarantee. Until these are dispositioned, public copy describing
      Gate 1/Gate 2 should avoid language a reader could take as claiming
