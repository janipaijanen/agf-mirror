{% extends "base.html" %}

{% block htmltitle %}
  {% set title = page.meta.title if page.meta and page.meta.title else page.title %}

    <title>AGF — {{ title | striptags }}</title>
  {% else %}
    <title>AGF — Agent Governance Framework</title>
  {% endif %}
{% endblock %}
