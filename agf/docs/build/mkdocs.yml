# SPDX-License-Identifier: CC-BY-SA-4.0
# agents-govern v2.0 documentation site — MkDocs configuration
#
# Build from the repository's v2.0 directory:
#   mkdocs build -f docs/build/mkdocs.yml --strict
#
# Strict mode is deliberate: broken internal links fail the build,
# which is the docs pipeline's quality gate (gate-self-test: the
# negative case is a link to a missing page — see docs/build/README.md).

site_name: agents-govern
site_url: https://janipaijanen.gitlab.io/agents-govern-framework/
site_description: >-
  Governance for AI-assisted software development: defined roles,
  review gates, an append-only coordination channel, and an
  evidence-driven learning system.
site_author: Jani Päijänen
copyright: >-
  Copyright (c) 2026 Jani Päijänen.
  Framework content: CC BY-SA 4.0, with separate commercial licensing
  available for alternative terms. Tooling code: MIT.

docs_dir: ../site
site_dir: ../../site-html

theme:
  name: material
  custom_dir: ../site/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - content.code.copy

strict: true

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/agf.css

hooks:
  - hooks/release_info.py
  - hooks/ai_evaluation_dossier.py
  - hooks/figure_accessibility.py

# content-plan.md is a planning control artifact, not a site page.
exclude_docs: |
  content-plan.md

nav:
  - Home: index.md
  - Start here:
      - Documentation overview: docs/index.md
      - Should you adopt?: docs/start/should-you-adopt.md
      - Use cases: use-cases.md
      - Downstream impact: docs/adopt/downstream-impact.md
      - Set up AGF: docs/start/commission.md
      - Install and layouts: docs/adopt/install-and-layouts.md
      - Assistant loaders: docs/adopt/assistant-loader-configuration.md
      - First governed change: docs/start/first-governed-change.md
      - Adopter FAQ: docs/start/adopter-faq.md
  - Use AGF:
      - Operations runbook: docs/operate/runbook.md
      - Day-to-day operation: docs/operate/day-to-day.md
      - Session continuity: docs/operate/session-continuity.md
      - Poll and coordinate: docs/operate/poll-and-coordinate.md
      - Run AGF in real situations: docs/operate/run-agf-in-real-situations.md
      - Review and release: docs/operate/review-and-release.md
      - Upgrade from v1: docs/adopt/upgrade-from-v1.md
      - Exit and decommission: docs/adopt/exit-and-decommission.md
  - Tools and customization:
      - Tooling and token savings: docs/adopt/tooling-and-tokens.md
      - agov MCP server: docs/adopt/mcp-server.md
      - Third-party assistant tooling: docs/adopt/third-party-plugin-coexistence.md
      - Applicability catalog: docs/adopt/applicability-catalog.md
      - Customizing the framework: docs/advanced/customizing-the-framework.md
  - Reference:
      - Roles and gates: docs/concepts/roles-and-gates.md
      - AGF and agent runtimes: docs/concepts/position.md
      - Coordination protocol: docs/concepts/coordination-protocol.md
      - Learning loop and evidence: docs/concepts/evidence-and-learnings.md
      - Framework map: docs/start/framework-map.md
      - Contracts and validators: docs/advanced/contracts-and-validators.md
      - Environment variables: reference/environment-variables.md
      - Release artifacts: reference/release-artifacts.md
      - Maturity vocabulary: reference/maturity-vocabulary.md
      - Coordination graph index: reference/coord-graph-index.md
      - Review findings: reference/review-findings.md
      - Tooling conformance: reference/tooling-conformance.md
      - Release information: reference/release-info.md
      - Disclaimer: reference/disclaimer.md
  - About:
      - Evaluate: evaluate.md
      - AI evaluation dossier: ai-evaluation-dossier.md
      - Roadmap: roadmap.md
      - Licensing: docs/adopt/licensing.md
      - Commercial licensing: docs/adopt/commercial-licensing.md
      - Contribute: contribute.md
      - Influences and acknowledgements: acknowledgements.md
      - Philosophical lenses: docs/concepts/philosophical-lenses.md
      - Evolution: future/evolution.md
