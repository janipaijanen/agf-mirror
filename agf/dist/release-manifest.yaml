schema_version: 1
package:
  name: agf
  version_file: agf/VERSION
  output_dir: dist
  basename: agf-{{version}}
  formats:
    - tar.gz
    - zip

include:
  - path: agf/VERSION
  - path: agf/LICENSE
  - path: agf/LICENSE-MIT
  - path: agf/CHANGELOG.md
  - path: agf/ADOPTING.md
  - path: agf/framework.md
  - path: docs/reviews/agf-framework-assessment-codex-sol-high.md
  - path: docs/reviews/todo-and-sol-high-synthesis-prioritized-actions.md
  - glob: agf/agents/**
  - glob: agf/dist/**
  - glob: agf/docs/adopt/**
  - glob: agf/docs/adr/**
  - glob: agf/docs/build/**
  - glob: agf/docs/contracts/**
  - glob: agf/docs/figures/**
  - glob: agf/docs/governance/**
  - glob: agf/docs/reference/**
  - glob: agf/docs/site/**
  - glob: agf/docs/visual/**
  - glob: agf/project-specific-examples/**
  - glob: agf/rules/**
  - glob: agf/schemas/**
  - glob: agf/skills/**
  - glob: agf/templates/**
    optional: true

exclude:
  - agf/site-html/**
  - agf/docs/site/reference/release-info.md
  - "**/__pycache__/**"
  - "**/*.pyc"
  # This project's own live roster (issue #79, docs/plans/
  # v250-rc1-contract-core.md). Shipping it collided with an adopter's own
  # divergent agf/agents/MANIFEST.yaml on a plain archive re-extraction.
  # agf/agents/MANIFEST.example.yaml (a neutral template, matched by the
  # agf/agents/** include glob above) ships instead.
  - agf/agents/MANIFEST.yaml

forbidden:
  - .git/**
  - .worktrees/**
  - tmp/**
  - dist/**
  - public/**
  - agents-govern/**
  - .env
  - .env.*
  - agf/site-html/**
  - agf/docs/site/reference/release-info.md
  - "**/__pycache__/**"
  - "**/*.pyc"
  - tooling/elixir/**
  - "**/mix.exs"
  - "**/mix.lock"
  - "**/*.ex"
  - "**/*.exs"
