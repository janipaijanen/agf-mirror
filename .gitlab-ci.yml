# AGF v2.0 CI pipeline
#
# Jobs run from the repository root. Paths are prefixed with agf/,
# tooling/elixir/, or tooling/rust/ accordingly (local commands run from
# within those subdirectories instead — see agf/docs/build/README.md).
#
# Pipeline structure:
#   site-html-build   — MkDocs strict build; review artifact on MRs and branches
#   pages             — publish to GitLab Pages from the default branch
#   elixir:test       — legacy Elixir reference tests only when Elixir changes
#   agf:dist:validate — validate the manifest-driven framework package with Rust agov
#   agf:dist:preview  — build review-only framework archives with Rust agov
#   agf:dist:release  — tag pipelines only; Rust tag/VERSION guard then build archives
#   dependency:cve-scan — scan dependency lockfiles for known vulnerabilities
#   rust:tooling:*    — Rust tooling: validation, tests, clippy, parity, archives
#   release:create    — upload archives to package registry; create GitLab release entry

workflow:
  rules:
    # Coordination-only commits update the durable governance trail. They should
    # not invalidate the last green code pipeline for an MR.
    - if: '$CI_COMMIT_TITLE =~ /^coordination:/'
      when: never
    - when: always

# ── Shared templates ──────────────────────────────────────────────────────────

.rust-base:
  image: rust:1
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: rust-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .cargo/bin
      - tooling/rust/target
  before_script:
    - cd tooling/rust

.elixir-base:
  image: hexpm/elixir:1.20.1-erlang-29.0.2-debian-bookworm-20260610-slim
  variables:
    AGOV_ALLOW_ROOT: "1"
  cache:
    key: elixir-deps-$CI_COMMIT_REF_SLUG
    paths:
      - tooling/elixir/_build
      - tooling/elixir/deps
  before_script:
    - cd tooling/elixir
    - mix deps.get

.mkdocs-base:
  image: python:3.14-slim
  before_script:
    - >-
      pip install --quiet
      'mkdocs>=1.6,<2'
      'mkdocs-material>=9.5,<10'
      'mkdocs-awesome-pages-plugin>=2.9,<3'
      'mkdocs-gen-files>=0.5,<1'
      'pymdown-extensions>=10.7,<11'

# ── Dependency vulnerability scanning ─────────────────────────────────────────

# Scan committed dependency manifests and lockfiles for known CVEs.
# Trivy filesystem scanning detects language lockfiles, including Cargo.lock
# and mix.lock, without building project artifacts. The JSON report is kept for
# review; HIGH and CRITICAL findings with fixes available block the pipeline.
dependency:cve-scan:
  image:
    name: aquasec/trivy:0.66.0
    entrypoint: [""]
  stage: test
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths:
      - .trivy-cache/
  script:
    - trivy --version
    - >-
      trivy fs
      --scanners vuln
      --skip-dirs agents-govern/.venv
      --skip-dirs agf/site-html
      --skip-dirs tooling/elixir/_build
      --skip-dirs tooling/elixir/deps
      --skip-dirs tooling/rust/target
      --format json
      --output trivy-dependency-vulnerabilities.json
      .
    - >-
      trivy fs
      --scanners vuln
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --dependency-tree
      --skip-dirs agents-govern/.venv
      --skip-dirs agf/site-html
      --skip-dirs tooling/elixir/_build
      --skip-dirs tooling/elixir/deps
      --skip-dirs tooling/rust/target
      --exit-code 1
      .
  artifacts:
    name: "dependency-cve-scan-$CI_COMMIT_SHORT_SHA"
    paths:
      - trivy-dependency-vulnerabilities.json
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - mise.toml
        - tooling/rust/Cargo.lock
        - tooling/rust/**/*.toml
        - tooling/elixir/mix.lock
        - tooling/elixir/mix.exs
        - agents-govern/pyproject.toml
    - if: $CI_COMMIT_BRANCH
      changes:
        - .gitlab-ci.yml
        - mise.toml
        - tooling/rust/Cargo.lock
        - tooling/rust/**/*.toml
        - tooling/elixir/mix.lock
        - tooling/elixir/mix.exs
        - agents-govern/pyproject.toml
    - if: $CI_COMMIT_TAG

# ── Documentation ─────────────────────────────────────────────────────────────

# Build the MkDocs site on every push and MR for review.
# Strict mode fails on broken internal links.
site-html-build:
  extends: .mkdocs-base
  stage: build
  script:
    - mkdocs build -f agf/docs/build/mkdocs.yml --strict
  artifacts:
    name: "docs-$CI_COMMIT_SHORT_SHA"
    paths:
      - agf/site-html/
    expire_in: 1 day
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agf/docs/**/*
        - agf/VERSION
        - agf/CHANGELOG.md
        - agf/ADOPTING.md
        - agf/framework.md
        - mkdocs.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - agf/docs/**/*
        - agf/VERSION
        - agf/CHANGELOG.md
        - agf/ADOPTING.md
        - agf/framework.md
        - mkdocs.yml
        - .gitlab-ci.yml

# Publish to GitLab Pages from the default branch.
# The pages job must produce a public/ artifact.
pages:
  extends: .mkdocs-base
  stage: deploy
  script:
    - mkdocs build -f agf/docs/build/mkdocs.yml --strict --site-dir ../../../public
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - agf/docs/**/*
        - agf/VERSION
        - agf/CHANGELOG.md
        - agf/ADOPTING.md
        - agf/framework.md
        - mkdocs.yml
        - .gitlab-ci.yml

# ── Elixir tooling ────────────────────────────────────────────────────────────

# Compile and test the legacy Elixir reference only when Elixir sources change.
# Release and documentation CI should not depend on this job.
elixir:test:
  extends: .elixir-base
  stage: test
  script:
    - mix compile --warnings-as-errors
    - mix test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/elixir/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/elixir/**/*

# ── Framework package artifacts ───────────────────────────────────────────────

# Validate the manifest-driven framework package on merge requests, branches,
# and tags without writing archives.
agf:dist:validate:
  extends: .rust-base
  stage: test
  script:
    - cargo run --quiet -p agov -- dist validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agf/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - agf/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# Build preview archives for reviewers. These artifacts are not releases.
agf:dist:preview:
  extends: .rust-base
  stage: build
  script:
    - cargo run --quiet -p agov -- dist validate
    - cargo run --quiet -p agov -- dist build
  artifacts:
    name: "agf-preview-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/*.sha256
      - dist/*-provenance.json
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agf/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - agf/**/*
        - .gitlab-ci.yml

# Build release archives only on tag pipelines.
# The tag must match agf/VERSION or this job fails before any archive is written.
agf:dist:release:
  extends: .rust-base
  stage: deploy
  script:
    - cargo run --quiet -p agov -- dist check-tag
    - cargo run --quiet -p agov -- dist validate
    - cargo run --quiet -p agov -- dist build
  artifacts:
    name: "agf-$CI_COMMIT_TAG"
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/*.sha256
      - dist/*-provenance.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# Publish all release archives to the generic package registry and create the
# GitLab release entry with download links. Tooling links are Rust-only,
# platform-specific archives.
release:create:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: agf:dist:release
      artifacts: true
    - job: rust:tooling:release
      artifacts: true
  script:
    - apk add --no-cache curl
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKG_BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agf/$CI_COMMIT_TAG"
    # Upload every release artifact to the generic package registry.
    # The glob covers framework archives, Rust tooling archives, checksums, and provenance.
    - |
      for f in dist/agf-*.tar.gz dist/agf-*.zip dist/agov-*.tar.gz dist/agov-*.zip \
                dist/*.sha256 dist/*-provenance.json \
                dist/SHA256SUMS; do
        [ -f "$f" ] || continue
        fname=$(basename "$f")
        echo "Uploading $fname"
        curl --silent --fail --show-error \
             --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$f" \
             "$PKG_BASE/$fname"
      done
    # Create the GitLab release entry with links to the uploaded packages.
    - |
      set -- \
        --name "agents-govern $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "See [CHANGELOG](https://gitlab.com/$CI_PROJECT_PATH/-/blob/$CI_COMMIT_TAG/agf/CHANGELOG.md) for release notes." \
        --assets-link "{\"name\":\"agf-${VERSION}.tar.gz\",\"url\":\"${PKG_BASE}/agf-${VERSION}.tar.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"agf-${VERSION}.zip\",\"url\":\"${PKG_BASE}/agf-${VERSION}.zip\",\"link_type\":\"package\"}"
      for f in dist/agov-${VERSION}-*.tar.gz dist/agov-${VERSION}-*.zip; do
        [ -f "$f" ] || continue
        fname=$(basename "$f")
        set -- "$@" --assets-link "{\"name\":\"${fname}\",\"url\":\"${PKG_BASE}/${fname}\",\"link_type\":\"package\"}"
      done
      release-cli create \
        "$@"

# ── Rust tooling ───────────────────────────────────────────────────────────────
# Path-scoped per ci-trigger-scoping-rule.md: only fire when tooling/rust/ changes.

# Validate AGF framework content with the Rust agov CLI.
rust:agov:validate:
  extends: .rust-base
  stage: test
  script:
    - cargo run --quiet -p agov -- validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agf/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - agf/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# Scan dependency licenses and advisories. Blocks on GPL/AGPL/LGPL/SSPL and known
# vulnerabilities. deny.toml defines the allowed-license allow-list.
rust:tooling:deny:
  extends: .rust-base
  stage: test
  script:
    - cargo install cargo-deny --locked --version "^0.19" --force
    - cargo deny check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# Compile and test the Rust workspace on tooling changes and release tags.
rust:tooling:test:
  extends: .rust-base
  stage: test
  script:
    - cargo test --workspace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# Lint the Rust workspace on tooling changes and release tags. Warnings are
# treated as errors.
rust:tooling:clippy:
  extends: .rust-base
  stage: test
  script:
    - rustup component add clippy
    - cargo clippy --workspace -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# Parity test: diff Rust and Elixir CLI output on the same fixture set.
# Blocking CI check during the Phase 1 transition period.
rust:tooling:parity:
  image: hexpm/elixir:1.20.1-erlang-29.0.2-debian-bookworm-20260610-slim
  stage: test
  variables:
    AGOV_ALLOW_ROOT: "1"
    AGOV_SCHEMA_DIR: "$CI_PROJECT_DIR/agf/schemas"
    AGOV_MANIFEST_PATH: "$CI_PROJECT_DIR/agf/agents/MANIFEST.yaml"
  before_script:
    - apt-get update -qq && apt-get install -y -qq build-essential curl
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - source "$HOME/.cargo/env"
    - cd tooling/elixir && mix deps.get && cd ../..
  script:
    - (cd tooling/rust && cargo build)
    - bash tooling/rust/tests/parity/run.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml

.rust-tooling-package:
  extends: .rust-base
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    CROSS_REMOTE: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io zip
    - cd tooling/rust
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo install cross --git https://github.com/cross-rs/cross --force
  script:
    - VERSION="$(cat ../../agf/VERSION)"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_VERSION="${CI_COMMIT_TAG#v}"
        if [ "$TAG_VERSION" != "$VERSION" ]; then
          echo "Tag $CI_COMMIT_TAG does not match agf/VERSION $VERSION" >&2
          exit 1
        fi
      fi
    - mkdir -p ../../dist
    - |
      for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
        cross build --release --target "$target" -p agov
        archive="agov-${VERSION}-${target}.tar.gz"
        staging="$(mktemp -d)"
        mkdir -p "$staging/agov-${VERSION}-${target}"
        cp "target/${target}/release/agov" "$staging/agov-${VERSION}-${target}/agov"
        chmod 0755 "$staging/agov-${VERSION}-${target}/agov"
        printf "AGF agov Rust CLI\nVersion: %s\nTarget: %s\n\nInstall by placing the agov executable on PATH.\n" \
          "$VERSION" "$target" > "$staging/agov-${VERSION}-${target}/README.txt"
        tar -C "$staging" -czf "../../dist/${archive}" "agov-${VERSION}-${target}"
        sha256sum "../../dist/${archive}" > "../../dist/${archive}.sha256"
        printf '{"version":"%s","source_commit":"%s","tag":"%s","build_timestamp":"%s","pipeline_identity":{"pipeline_id":"%s","job_id":"%s"},"target_platform":"%s","implementation":"rust","packaging":"tar.gz"}\n' \
          "$VERSION" "${CI_COMMIT_SHA}" "${CI_COMMIT_TAG:-}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${CI_PIPELINE_ID:-}" "${CI_JOB_ID:-}" "$target" \
          > "../../dist/agov-${VERSION}-${target}-provenance.json"
        rm -rf "$staging"
      done
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        target="x86_64-pc-windows-gnu"
        cross build --release --target "$target" -p agov
        archive="agov-${VERSION}-${target}.zip"
        staging="$(mktemp -d)"
        dist_dir="$(cd ../../dist && pwd)"
        mkdir -p "$staging/agov-${VERSION}-${target}"
        cp "target/${target}/release/agov.exe" "$staging/agov-${VERSION}-${target}/agov.exe"
        printf "AGF agov Rust CLI\nVersion: %s\nTarget: %s\n\nInstall by placing agov.exe on PATH.\n" \
          "$VERSION" "$target" > "$staging/agov-${VERSION}-${target}/README.txt"
        (cd "$staging" && zip -qr "$dist_dir/${archive}" "agov-${VERSION}-${target}")
        sha256sum "../../dist/${archive}" > "../../dist/${archive}.sha256"
        printf '{"version":"%s","source_commit":"%s","tag":"%s","build_timestamp":"%s","pipeline_identity":{"pipeline_id":"%s","job_id":"%s"},"target_platform":"%s","implementation":"rust","packaging":"zip"}\n' \
          "$VERSION" "${CI_COMMIT_SHA}" "${CI_COMMIT_TAG:-}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${CI_PIPELINE_ID:-}" "${CI_JOB_ID:-}" "$target" \
          > "../../dist/agov-${VERSION}-${target}-provenance.json"
        rm -rf "$staging"
      fi
  artifacts:
    paths:
      - dist/agov-*.tar.gz
      - dist/agov-*.tar.gz.sha256
      - dist/agov-*.zip
      - dist/agov-*.zip.sha256
      - dist/agov-*-provenance.json

# Build preview Rust tooling archives for Linux platform targets. These
# artifacts are not releases.
rust:tooling:preview:
  extends: .rust-tooling-package
  artifacts:
    name: "agov-rust-preview-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml

# Build release Rust tooling archives only on tag pipelines.
rust:tooling:release:
  extends: .rust-tooling-package
  artifacts:
    name: "agov-rust-$CI_COMMIT_TAG"
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# Manual Windows x64 preview build. This is intentionally separate from the
# default Rust preview job so ordinary MRs do not pay the Windows cross-build
# cost, while release preparation can still request an agov.exe artifact.
rust:tooling:build:windows:preview:
  extends: .rust-base
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    CROSS_REMOTE: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io
    - cd tooling/rust
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo install cross --git https://github.com/cross-rs/cross --force
  script:
    - cross build --release --target x86_64-pc-windows-gnu
  artifacts:
    name: "agov-rust-windows-preview-$CI_COMMIT_SHORT_SHA"
    paths:
      - tooling/rust/target/x86_64-pc-windows-gnu/release/agov.exe
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
