# Throwaway evidence branch for docs/plans/20261028T194451Z-ci-reproducibility-pins.md.
# Not for merge. Runs the plan's Trivy scan and its two credential-free tool checks
# against the release-cli digest. No project token is passed into any container
# and no project file is mounted into the checked container.
stages: [test]

trivy:release-cli:
  stage: test
  image:
    name: aquasec/trivy:0.66.0
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
  script:
    - trivy --version
    - trivy image --image-src remote --severity HIGH,CRITICAL --scanners vuln --exit-code 0 --format table registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  rules:
    - if: $CI_COMMIT_BRANCH == "evidence/ci-pins-tool-check"

toolcheck:release-cli:
  stage: test
  tags: [podman, linux, amd64]
  image: quay.io/podman/stable:v5.6.0
  variables:
    STORAGE_DRIVER: vfs
    IMG: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  script:
    - echo "== step 1: pinned image alone provides release-cli and apk"
    - podman run --rm --entrypoint sh "$IMG" -c 'command -v release-cli && command -v apk && release-cli --version'
    - echo "== step 2: isolated install of the job package line, then command -v"
    - podman run --rm --entrypoint sh "$IMG" -c 'apk add --no-cache curl unzip tar gzip >/dev/null && command -v curl unzip tar gzip'
    - echo "== isolation: no token env inside the container"
    - podman run --rm --entrypoint sh "$IMG" -c 'env | grep -ci "CI_JOB_TOKEN\|CI_PROJECT_DIR" || true'
  rules:
    - if: $CI_COMMIT_BRANCH == "evidence/ci-pins-tool-check"
