# AGF v2.0 CI pipeline
#
# Jobs run from the repository root. Paths are prefixed with agf/ or
# tooling/elixir/ accordingly (local commands run from within those
# subdirectories instead — see agf/docs/build/README.md).
#
# Pipeline structure:
#   site-html-build   — MkDocs strict build; review artifact on MRs and branches
#   pages             — publish to GitLab Pages from the default branch
#   elixir:test       — compile + test Elixir tooling
#   agf:dist:validate — validate the manifest-driven framework package
#   agf:dist:preview  — build review-only framework archives on MRs/default branch
#   agf:dist:release  — tag pipelines only; tag/VERSION guard then build archives
#   agov:tooling:*    — build review/release linux-x86_64 AGOV tooling archives
#   agf:bundle:*      — build review/release framework + tooling bundles
#   release:create    — upload archives to package registry; create GitLab release entry
#   rust:tooling:*    — Phase 1 Rust tooling: test, clippy, parity, build:preview

workflow:
  rules:
    # Coordination-only commits update the durable governance trail. They should
    # not invalidate the last green code pipeline for an MR.
    - if: '$CI_COMMIT_TITLE =~ /^coordination:/'
      when: never
    - when: always

# ── Shared templates ──────────────────────────────────────────────────────────

.rust-base:
  image: rust:1
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: rust-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry
      - .cargo/bin
      - tooling/rust/target
  before_script:
    - cd tooling/rust

.elixir-base:
  image: hexpm/elixir:1.20.1-erlang-29.0.2-debian-bookworm-20260610-slim
  variables:
    AGOV_ALLOW_ROOT: "1"
  cache:
    key: elixir-deps-$CI_COMMIT_REF_SLUG
    paths:
      - tooling/elixir/_build
      - tooling/elixir/deps
  before_script:
    - cd tooling/elixir
    - mix deps.get

.mkdocs-base:
  image: python:3.14-slim
  before_script:
    - pip install --quiet mkdocs==1.6.1

# ── Documentation ─────────────────────────────────────────────────────────────

# Build the MkDocs site on every push and MR for review.
# Strict mode fails on broken internal links.
site-html-build:
  extends: .mkdocs-base
  stage: build
  script:
    - mkdocs build -f agf/docs/build/mkdocs.yml --strict
  artifacts:
    name: "docs-$CI_COMMIT_SHORT_SHA"
    paths:
      - agf/site-html/
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Publish to GitLab Pages from the default branch.
# The pages job must produce a public/ artifact.
pages:
  extends: .mkdocs-base
  stage: deploy
  script:
    - mkdocs build -f agf/docs/build/mkdocs.yml --strict --site-dir ../../../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Elixir tooling ────────────────────────────────────────────────────────────

# Compile and test the Elixir tooling on every push.
elixir:test:
  extends: .elixir-base
  stage: test
  script:
    - mix compile --warnings-as-errors
    - mix test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Framework package artifacts ───────────────────────────────────────────────

# Validate the manifest-driven framework package on merge requests, branches,
# and tags without writing archives.
agf:dist:validate:
  extends: .elixir-base
  stage: test
  script:
    - mix agov.dist.validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Build preview archives for reviewers. These artifacts are not releases.
agf:dist:preview:
  extends: .elixir-base
  stage: build
  script:
    - mix agov.dist.validate
    - mix agov.dist.build
  artifacts:
    name: "agf-preview-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/*.sha256
      - dist/*-provenance.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build release archives only on tag pipelines.
# The tag must match agf/VERSION or this job fails before any archive is written.
agf:dist:release:
  extends: .elixir-base
  stage: deploy
  script:
    - mix agov.dist.check_tag
    - mix agov.dist.validate
    - mix agov.dist.build
  artifacts:
    name: "agf-$CI_COMMIT_TAG"
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/*.sha256
      - dist/*-provenance.json
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG

# Build preview tooling binary archives for reviewers. These artifacts are not releases.
agov:tooling:preview:
  extends: .elixir-base
  stage: build
  script:
    - mix agov.tooling.build
  artifacts:
    name: "agov-preview-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/agov-*.tar.gz
      - dist/agov-*.sha256
      - dist/agov-*-provenance.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build preview bundle archives from preview framework and tooling artifacts.
agf:bundle:preview:
  extends: .elixir-base
  stage: deploy
  script:
    - mix agov.bundle.build
  artifacts:
    name: "agf-bundle-preview-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/agf-*-bundle.tar.gz
      - dist/agf-*-bundle.sha256
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: agf:dist:preview
      artifacts: true
    - job: agov:tooling:preview
      artifacts: true

# Build release tooling binary archives only on tag pipelines.
# The tag must match agf/VERSION or this job fails before any archive is written.
agov:tooling:release:
  extends: .elixir-base
  stage: deploy
  script:
    - mix agov.dist.check_tag
    - mix agov.tooling.build
  artifacts:
    name: "agov-$CI_COMMIT_TAG"
    paths:
      - dist/agov-*.tar.gz
      - dist/agov-*.sha256
      - dist/agov-*-provenance.json
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: agf:dist:release
      artifacts: true

# Build release bundle archives only on tag pipelines.
# The tag must match agf/VERSION or this job fails before any archive is written.
agf:bundle:release:
  extends: .elixir-base
  stage: deploy
  script:
    - mix agov.dist.check_tag
    - mix agov.bundle.build
  artifacts:
    name: "agf-bundle-$CI_COMMIT_TAG"
    paths:
      - dist/agf-*-bundle.tar.gz
      - dist/agf-*-bundle.sha256
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: agf:dist:release
      artifacts: true
    - job: agov:tooling:release
      artifacts: true

# Publish all release archives to the generic package registry and create the
# GitLab release entry with download links. Runs after all three release jobs.
release:create:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: agf:dist:release
      artifacts: true
    - job: agov:tooling:release
      artifacts: true
    - job: agf:bundle:release
      artifacts: true
  script:
    - apk add --no-cache curl
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKG_BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agf/$CI_COMMIT_TAG"
    # Upload every release artifact to the generic package registry.
    # The glob covers framework archives, tooling archive, bundle, checksums, and provenance.
    - |
      for f in dist/agf-*.tar.gz dist/agf-*.zip dist/agov-*.tar.gz \
                dist/agf-*-bundle.tar.gz dist/*.sha256 dist/*-provenance.json \
                dist/SHA256SUMS; do
        [ -f "$f" ] || continue
        fname=$(basename "$f")
        echo "Uploading $fname"
        curl --silent --fail --show-error \
             --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$f" \
             "$PKG_BASE/$fname"
      done
    # Resolve the tooling binary filename (OTP version is derived at build time).
    - TOOLING_TAR=$(ls dist/agov-${VERSION}-linux-x86_64-otp-*.tar.gz 2>/dev/null | head -1 | xargs basename)
    # Create the GitLab release entry with links to the uploaded packages.
    - |
      release-cli create \
        --name "agents-govern $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "See [CHANGELOG](https://gitlab.com/$CI_PROJECT_PATH/-/blob/$CI_COMMIT_TAG/agf/CHANGELOG.md) for release notes." \
        --assets-link "{\"name\":\"agf-${VERSION}.tar.gz\",\"url\":\"${PKG_BASE}/agf-${VERSION}.tar.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"agf-${VERSION}.zip\",\"url\":\"${PKG_BASE}/agf-${VERSION}.zip\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"${TOOLING_TAR}\",\"url\":\"${PKG_BASE}/${TOOLING_TAR}\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"agf-${VERSION}-bundle.tar.gz\",\"url\":\"${PKG_BASE}/agf-${VERSION}-bundle.tar.gz\",\"link_type\":\"package\"}"

# ── Rust tooling (Phase 1) ─────────────────────────────────────────────────────
# Path-scoped per ci-trigger-scoping-rule.md: only fire when tooling/rust/ changes.
# rust:tooling:build:release is NOT authorised in Phase 1 — see plan §10.

# Scan dependency licenses and advisories. Blocks on GPL/AGPL/LGPL/SSPL and known
# vulnerabilities. deny.toml defines the allowed-license allow-list.
rust:tooling:deny:
  extends: .rust-base
  stage: test
  script:
    - cargo install cargo-deny --locked --version "^0.19" --force
    - cargo deny check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/**/*
    - if: $CI_COMMIT_TAG

# Compile and test the Rust workspace on every push touching tooling/rust/.
rust:tooling:test:
  extends: .rust-base
  stage: test
  script:
    - cargo test --workspace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/**/*
    - if: $CI_COMMIT_TAG
      changes:
        - tooling/rust/**/*

# Lint the Rust workspace. Warnings are treated as errors.
rust:tooling:clippy:
  extends: .rust-base
  stage: test
  script:
    - rustup component add clippy
    - cargo clippy --workspace -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/**/*

# Parity test: diff Rust and Elixir CLI output on the same fixture set.
# Blocking CI check during the Phase 1 transition period.
rust:tooling:parity:
  image: hexpm/elixir:1.20.1-erlang-29.0.2-debian-bookworm-20260610-slim
  stage: test
  variables:
    AGOV_ALLOW_ROOT: "1"
    AGOV_SCHEMA_DIR: "$CI_PROJECT_DIR/agf/schemas"
    AGOV_MANIFEST_PATH: "$CI_PROJECT_DIR/agf/agents/MANIFEST.yaml"
  before_script:
    - apt-get update -qq && apt-get install -y -qq build-essential curl
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - source "$HOME/.cargo/env"
    - cd tooling/elixir && mix deps.get && cd ../..
  script:
    - (cd tooling/rust && cargo build)
    - bash tooling/rust/tests/parity/run.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/**/*

# Build preview binaries for Phase 1 Linux platform targets using `cross`.
# Artifacts expire after one week; not a release build.
rust:tooling:build:preview:
  extends: .rust-base
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    CROSS_REMOTE: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io
    - cd tooling/rust
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo install cross --git https://github.com/cross-rs/cross --force
  script:
    - cross build --release --target x86_64-unknown-linux-musl
    - cross build --release --target aarch64-unknown-linux-musl
  artifacts:
    name: "agov-rust-preview-$CI_COMMIT_SHORT_SHA"
    paths:
      - tooling/rust/target/x86_64-unknown-linux-musl/release/agov
      - tooling/rust/target/aarch64-unknown-linux-musl/release/agov
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - tooling/rust/**/*
