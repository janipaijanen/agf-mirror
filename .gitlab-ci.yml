# ── Rust tooling ───────────────────────────────────────────────────────────────
# Jobs are path-scoped per ci-trigger-scoping-rule.md unless their own comment
# records an approved full-tree safety-net reason.

# Validate changed coordination messages and Gate 1 plans, and validate every
# projection manifest's owner lifecycle. The latter makes this job deliberately
# unconditional: a newly created owner can stale an unchanged manifest.
agov:governance:validate:
  extends: .rust-base
  stage: test
  interruptible: true
  variables:
    # This job compares a range against the target branch, which needs a
    # real merge base. The project default is 20 (see the note on
    # commercial-corpus:validate below); a branch more than ~20 commits past
    # its base would have no merge base in a depth-20 checkout. Before the
    # fail-closed contract that produced a SILENT PASS -- the failed
    # `git diff` was masked by `xargs -0r`. The contract now fails closed on
    # a missing merge base, so full depth is what keeps that failure meaning
    # "something is wrong" rather than "this branch got long".
    GIT_DEPTH: "0"
  script:
    - |
      set -eu

      # Build agov from source using provenance env vars set by .rust-base before_script.
      # This avoids stale cached binaries carrying incorrect dirty/unknown provenance.
      # .rust-base before_script has already cd'd to tooling/rust.
      cargo build --quiet --release -p agov
      agov_bin="$PWD/target/release/agov"
      echo "agov: $($agov_bin --version)"

      # Return to repo root for git operations.
      cd "$CI_PROJECT_DIR"

      # A coordination-titled candidate is the security-sensitive path (per
      # coordination-publication-rule.md, condition 1: an unresolvable base
      # must fail closed, not skip open). Resolve the base deterministically
      # by fetching the real target ref, rather than trusting possibly-empty
      # CI predefined SHA variables -- CI_MERGE_REQUEST_TARGET_BRANCH_SHA and
      # CI_COMMIT_BEFORE_SHA are both empty/unset in real, common pipeline
      # shapes (first pipeline on a branch, force-push, shallow clone).
      is_coordination_candidate=0
      if printf '%s' "$CI_COMMIT_TITLE" | grep -qE '^coordination:'; then
        is_coordination_candidate=1
      fi

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        target_ref="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
      else
        target_ref="$CI_DEFAULT_BRANCH"
      fi

      # The fail-closed changed-file contract. See
      # .gitlab/scripts/changed-files.sh for the two silent-pass modes it
      # closes, and tests/changed-files-failclosed.sh for the negative tests
      # that prove each failure mode exits non-zero. This is gate mechanics:
      # per agf/rules/always/gate-self-test-rule.md, modifying it requires
      # Gate 1 and a re-run of those tests, not a one-line fix.
      . "$CI_PROJECT_DIR/.gitlab/scripts/changed-files.sh"

      base=""
      if base="$(cf_resolve_base "$target_ref")"; then
        :
      else
        base=""
      fi

      if [ -z "$base" ]; then
        if [ "$is_coordination_candidate" -eq 1 ]; then
          echo "ERR: could not resolve comparison base against '$target_ref' for a coordination-titled candidate; failing closed (coordination-publication-rule.md condition 1)." >&2
          exit 1
        fi
        echo "No comparison base available; skipping changed-file governance validation for this non-coordination commit."
        exit 0
      fi

      # Step 2 of the contract, and it fails closed for EVERY candidate, not
      # only coordination-titled ones. A missing merge base means this
      # checkout cannot compare the range at all; the previous code let that
      # pass silently because the failed `git diff` was masked by `xargs`.
      # GIT_DEPTH is 0 for this job so a genuine merge base is present --
      # reaching this error means something is actually wrong, not merely
      # shallow.
      cf_require_merge_base "$base"

      changed_list="$(mktemp)"
      deleted_list="$(mktemp)"
      # shellcheck disable=SC2064
      trap "rm -f '$changed_list' '$deleted_list'" EXIT

      # Coordination records are append-only (see
      # agf/rules/workflow/coordination-publication-rule.md, condition 3).
      # Deleting one was previously blocked only by accident -- `agov coord
      # validate` reported `file not found` for the vanished path, which
      # explains nothing. This replaces that accident with an intentional
      # check and a diagnostic that names the rule.
      #
      # cf_deleted_files disables rename detection deliberately. A plain
      # --diff-filter=D is blind to rename-and-rewrite: Git reports R, the
      # deletion list comes back empty, and a validly-shaped destination
      # sails through `coord validate` while the original record is gone.
      # Review 13rh (GCD-G2-2) demonstrated that bypass.
      cf_deleted_files "$base" "$deleted_list" 'docs/coordination/*.md' \
          ':!docs/coordination/README.md' \
          ':!docs/coordination/feedback-coordination-messages.md'
      if [ -s "$deleted_list" ]; then
        echo "ERR: this range removes coordination records from their published paths:" >&2
        tr '\0' '\n' < "$deleted_list" | sed 's/^/  - /' >&2
        echo "ERR: coordination records are append-only. Correct a stale, wrong, or superseded record by adding a NEW record that references and supersedes it -- never by deleting, renaming, or rewriting the original (agf/rules/workflow/coordination-publication-rule.md, condition 3)." >&2
        echo "ERR: renaming a record counts. A rename removes the published path other records cite by name, so it is reported here even when the destination file is itself valid." >&2
        echo "ERR: if a record was committed onto the wrong branch, the fix is to rebuild the branch without that commit, not to add a deletion or rename commit on top." >&2
        exit 1
      fi

      # README.md and feedback-coordination-messages.md are documentation
      # that lives in docs/coordination/ by convention, not coordination
      # messages -- they carry no YAML front matter by design and must be
      # excluded from the message-shape check, mirroring the MANIFEST.yaml
      # filename exclusion already used for the analogous case in
      # agov-validators (agents.rs, adoption.rs, readme_stats.rs).
      cf_changed_files "$base" "$changed_list" d 'docs/coordination/*.md' \
          ':!docs/coordination/README.md' \
          ':!docs/coordination/feedback-coordination-messages.md'
      cf_run_on_list "$changed_list" "$agov_bin" coord validate

      # Deletions are excluded here for the opposite reason to coordination:
      # removing a plan file is legitimate (revert, supersession, cleanup),
      # and feeding the deleted path to `agov plan validate` failed at
      # blocking severity with `file not found` (plan_validator.rs:24). That
      # is what blocked MR !2206, a governor-ordered revert.
      cf_changed_files "$base" "$changed_list" d 'docs/plans/*.md'
      cf_run_on_list "$changed_list" "$agov_bin" plan validate

      # Per agf/rules/workflow/documentation-rule-projection-rule.md: check
      # every manifest's repository-contained paths and planned-owner
      # lifecycle on every pipeline. Changed-manifest Pages/runbook coverage
      # stays diff-scoped inside the command; deciding whether a Pages change
      # is normative remains human/role judgment under the rule.
      "$agov_bin" plan projection-check-all --base-ref "$base"

      # gate-self-test-rule.md grants this check blocking authority. A gate
      # surface change must carry a declared test-path change; active
      # registry paths must resolve; gate IDs remain permanent after
      # retirement. This is a review-attention proxy, not proof that a CI job
      # executes or that the changed test is substantively adequate.
      "$agov_bin" gate change-check --base-ref "$base"

      # Per agf/rules/workflow/coordination-publication-rule.md: a candidate
      # using the coordination fast-path commit convention gets its whole
      # commit range mechanically verified as coordination-only, not merely
      # its tip diff (MR !692). The commit title selects which candidates
      # get this stricter check; the check itself does not trust the title
      # (publication-check independently inspects every commit's subject
      # and diff, not just HEAD's).
      if [ "$is_coordination_candidate" -eq 1 ]; then
        "$agov_bin" coord publication-check --base-ref "$base" --subject-prefix "coordination:"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Row 6 S4 (#123): MR-blocking plan-vs-plan collision gate.
# agf/rules/workflow/development-workflow-rule.md's "Affected-paths
# collision blocking" subsection is the named rule granting this check
# blocking authority (agf/rules/always/tool-authority-boundary-rule.md).
# MR-pipeline-source-only, single rule, no push-sourced variant -- a plan
# branch's first push (before GitLab registers the MR) never triggers this
# job, so no push/merge_request_event duplicate pair is possible.
#
# S4-I2 fix: the trigger path list also names this gate's own
# behavior-bearing surfaces (schema, authorizing rule, command source,
# CI config), not only docs/plans/**/*.md -- ci-trigger-scoping-rule.md's
# own instruction is not to scope a CI check out of changes to its own
# configuration. Without this, a change to the gate's own mechanics (like
# this slice's own introducing MR) never triggers the job that is
# supposed to prove those mechanics work.
agov:governance:plan-collision-gate:
  extends: .rust-base
  stage: test
  interruptible: true
  script:
    - |
      set -eu
      cargo build --quiet --release -p agov
      agov_bin="$PWD/target/release/agov"
      cd "$CI_PROJECT_DIR"

      # S4-I2 fix: prove the gate actually fires on a known-bad input
      # BEFORE evaluating the real candidate. A gate that silently stopped
      # firing must not be trusted to clear the real candidate either.
      "$CI_PROJECT_DIR/.gitlab/scripts/plan-collision-self-test.sh" "$agov_bin"

      # Deterministic, fail-closed base resolution (S4-G1-R2-1): a real MR
      # pipeline checks out a detached HEAD with no local target branch ref.
      # Reuse the same fetch/resolve contract agov:governance:validate
      # already uses, rather than trusting a local ref that may not exist.
      . "$CI_PROJECT_DIR/.gitlab/scripts/changed-files.sh"
      target_ref="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:?target branch required in an MR pipeline}"
      if ! base="$(cf_resolve_base "$target_ref")"; then
        echo "ERR: could not resolve comparison base against '$target_ref'; failing closed (this gate never silently passes an unevaluated plan)." >&2
        exit 1
      fi

      "$agov_bin" plan collision-check --plans-only --changed-only --fail-on-unacknowledged-collision --base-ref "$base"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "docs/plans/**/*.md"
        - "agf/schemas/gate1-plan.schema.json"
        - "agf/rules/workflow/development-workflow-rule.md"
        - "tooling/rust/crates/agov/src/plan_collision.rs"
        - "tooling/rust/crates/agov/src/plan_collision_forge.rs"
        - "tooling/rust/crates/agov/src/main.rs"
        - ".gitlab/scripts/plan-collision-self-test.sh"
        - ".gitlab-ci.yml"

# Negative-test suite for the fail-closed changed-file contract used by
# agov:governance:validate. Required by
# agf/rules/always/gate-self-test-rule.md: a gate ships with a
# reviewer-visible transcript proving it fires on known-bad input, and --
# since that rule now covers modification as well as introduction -- the
# transcript must be reproduced on every later change to the contract.
# "I tested it locally" is explicitly insufficient, which is why this runs
# here rather than only in a developer shell.
governance:changed-files:selftest:
  extends: .rust-base
  stage: test
  interruptible: true
  variables:
    # The suite builds its own throwaway repositories; it needs no history
    # from this one. The default depth is fine.
    GIT_STRATEGY: fetch
  script:
    - |
      set -eu
      cargo build --quiet --release -p agov
      agov_bin="$PWD/target/release/agov"
      cd "$CI_PROJECT_DIR"
      AGOV_BIN="$agov_bin" sh tests/changed-files-failclosed.sh
  rules:
    # Path-scoped per agf/rules/workflow/ci-trigger-scoping-rule.md. The CI
    # configuration itself is included deliberately: a change to the job that
    # consumes the contract must re-prove the contract still fires.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ".gitlab/scripts/changed-files.sh"
        - "tests/changed-files-failclosed.sh"
        - "tests/fixtures/changed-files/**/*"
        - ".gitlab-ci.yml"
        - "tooling/rust/crates/agov-validators/**/*"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Validate AGF framework content with the Rust agov CLI.
rust:agov:validate:
  extends: .rust-base
  stage: test
  interruptible: true
  script:
    - cargo run --quiet -p agov -- validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &rust_agov_validate_paths
        - agf/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      changes:
        compare_to: 'refs/heads/$CI_DEFAULT_BRANCH'
        paths: *rust_agov_validate_paths
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      when: never
    - if: $CI_COMMIT_BRANCH
      changes: *rust_agov_validate_paths
    - if: $CI_COMMIT_TAG

# Scan dependency licenses and advisories. Blocks on GPL/AGPL/LGPL/SSPL and known
# vulnerabilities. deny.toml defines the allowed-license allow-list.
rust:tooling:deny:
  extends: .rust-base
  stage: test
  interruptible: true
  script:
    - cargo install --list 2>/dev/null | grep -qE "^cargo-deny v0\.19\.[0-9]+:" || cargo install cargo-deny --locked --version "^0.19" --force
    # cargo-deny's advisory-db clone lives under $CARGO_HOME but is not a
    # cached path (only .cargo/registry, .cargo/bin, and tooling/rust/target
    # are). Observed 2026-09-12 (pipeline 2842901098): cargo-deny crashed
    # trying to read an existing clone's FETCH_HEAD -- it misparsed git's
    # "No such file or directory" fatal message as an ISO-8601 timestamp
    # instead of cloning fresh -- even though the directory should not
    # persist across runs on this non-cached path. The precise mechanism
    # (e.g. a prior run's partial/torn state vs. something else) is an
    # unproven hypothesis, not a demonstrated cause; see the Gate 1 plan
    # (docs/plans/20260912T112252Z-cargo-deny-advisory-db-clean-clone-
    # gate1.md, governor decision jhaq) for the disclosed validation limit.
    # Force a clean clone every run rather than depend on a directory this
    # job never persists -- a reasonable mitigation for the observed crash
    # regardless of the exact precondition.
    - rm -rf "$CARGO_HOME/advisory-dbs"
    - cargo deny check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &rust_tooling_deny_paths
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      changes:
        compare_to: 'refs/heads/$CI_DEFAULT_BRANCH'
        paths: *rust_tooling_deny_paths
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      when: never
    - if: $CI_COMMIT_BRANCH
      changes: *rust_tooling_deny_paths
    - if: $CI_COMMIT_TAG

# Validate the active commercial-corpus manifest on every pipeline. Manifest
# schema defects are blocking; content drift and numbered-path mutation are
# advisory findings emitted by the command with exit 0.
commercial-corpus:validate:
  extends: .rust-base
  stage: test
  interruptible: true
  variables:
    # This job's --base-ref comparison needs a real merge base against
    # CI_MERGE_REQUEST_DIFF_BASE_SHA. The project default GIT_DEPTH (20)
    # truncates history before that merge base on any branch more than
    # ~20 commits past its target, producing a `no merge base` failure
    # unrelated to any actual commercial-corpus defect. Same fix as
    # agov:governance:validate above, for the same underlying reason.
    GIT_DEPTH: "0"
  script:
    - |
      set -eu
      base_ref="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD^}"
      cargo run --quiet -p agov -- commercial-corpus validate \
        --repo-root "$CI_PROJECT_DIR" \
        --base-ref "$base_ref"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Compile and test the Rust workspace on tooling changes and release tags.
#
# The sole designated shared-cache writer (Slice B). Every other
# .rust-base inheritor stays pull-only regardless of context; this is
# the only job that overrides RUST_CACHE_ROLE and consumes
# RUST_CACHE_WRITER_POLICY. Only the cache policy and role are
# overridden here -- key, fallback_keys, and paths are inherited from
# .rust-base via extends' hash-key deep-merge (verified empirically
# against GitLab CI Lint's merged YAML at implementation time; extends
# replaces array keys like before_script wholesale but deep-merges hash
# keys like cache). See docs/plans/ci-rust-cache-policy-slice-b.md.
rust:tooling:test:
  extends: .rust-base
  stage: test
  interruptible: true
  variables:
    RUST_CACHE_ROLE: "writer"
    # commercial_corpus::tests::real_mr1712_generation_acceptance_is_142_
    # included_plus_50_excluded reads historical repository state via
    # `git show <revision>:<path>` against a commit that recedes further
    # into history over time (461 commits behind HEAD at introduction).
    # The project's default GIT_DEPTH (20, confirmed via the GitLab
    # project API) truncates the checkout long before that commit,
    # failing the test with a missing-object error unrelated to any
    # actual code defect. Only this job exercises that test, so only
    # this job needs the full clone (issue #112, MR !1965 round-1 audit
    # `CA-ADV-R1-4`).
    GIT_DEPTH: "0"
  cache:
    policy: $RUST_CACHE_WRITER_POLICY
  script:
    - apt-get update -qq && apt-get install -y -qq jq
    - sh tests/agov-wrapper-freshness.sh
    - sh tests/tooling-provenance-verifier.sh
    - cargo test --workspace
    # Gate 2 negative CLI demonstration (issue #112, MR !1965 round-2
    # audit CA-ADV-R2-3): the passing integration test above asserts on
    # captured output internally, which a reviewer cannot see in this
    # job's own trace. Reproduce the exact scenario directly in the
    # visible job log: a checkout_role: live record whose
    # framework_version has drifted from agf/VERSION must be rejected.
    - |
      echo "=== Gate 2 negative CLI demonstration (issue #112) ==="
      FIXTURE=$(mktemp -d)
      mkdir -p "$FIXTURE/agf/learnings" "$FIXTURE/agf/schemas" "$FIXTURE/tooling"
      cp ../../agf/schemas/learning.schema.json "$FIXTURE/agf/schemas/"
      printf '2.6.1' > "$FIXTURE/agf/VERSION"
      cat > "$FIXTURE/agf/learnings/mismatched.yaml" <<'FIXTURE_EOF'
      project:
        codename: gate2-demo-fixture
      adoption:
        checkout_role: live
        framework_version: "2.0.0-provisional"
      FIXTURE_EOF
      echo "+ agov validate learnings $FIXTURE/agf/learnings"
      set +e
      ./target/debug/agov validate learnings "$FIXTURE/agf/learnings"
      DEMO_EXIT=$?
      set -e
      echo "+ echo \$?"
      echo "$DEMO_EXIT"
      if [ "$DEMO_EXIT" -ne 1 ]; then
        echo "FATAL: expected exit 1 (blocking), got $DEMO_EXIT -- the version-drift gate no longer blocks a known-bad input"
        exit 1
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &rust_tooling_test_paths
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      changes:
        compare_to: 'refs/heads/$CI_DEFAULT_BRANCH'
        paths: *rust_tooling_test_paths
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      when: never
    - if: $CI_COMMIT_BRANCH
      changes: *rust_tooling_test_paths
    - if: $CI_COMMIT_TAG

# Composed real-registry/real-binary evidence tests: requires a real
# `podman` and real network access, so these tests are `#[ignore]`d in the
# ordinary rust:tooling:test job (plain rust:1, no podman) and run here
# instead, on the same podman image agov:oci:release/release:verify
# already use. A missing podman or failed pull is a hard failure in this
# job -- there is no silent-pass fallback, per !351 Gate 2 finding kaka
# BLOCK B (a green generic pipeline must not be able to claim OCI evidence
# it never actually gathered).
rust:tooling:oci-pull-test:
  tags:
    - podman
    - linux
    - amd64
  image: quay.io/podman/stable:v5.6.0
  stage: test
  interruptible: true
  variables:
    STORAGE_DRIVER: vfs
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: rust-oci-pull-test
    paths:
      - .cargo/registry
      - .cargo/bin
      - tooling/rust/target
  before_script:
    - dnf install -y gcc || true
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
    - source "$CARGO_HOME/env"
    - cd tooling/rust
  script:
    - cargo build --release -p agov
    - cargo test -p agov --test oci_pull -- --ignored --nocapture
    - cargo test -p agov --bin agov -- --ignored --nocapture composed_
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/crates/agov/tests/oci_pull.rs
        - tooling/rust/crates/agov/src/provenance.rs
        - tooling/rust/crates/agov/src/main.rs
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - tooling/rust/crates/agov/tests/oci_pull.rs
        - tooling/rust/crates/agov/src/provenance.rs
        - tooling/rust/crates/agov/src/main.rs
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# Lint the Rust workspace on tooling changes and release tags. Warnings are
# treated as errors.
rust:tooling:clippy:
  extends: .rust-base
  stage: test
  interruptible: true
  script:
    - rustup component add clippy
    - cargo clippy --workspace -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &rust_tooling_clippy_paths
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      changes:
        compare_to: 'refs/heads/$CI_DEFAULT_BRANCH'
        paths: *rust_tooling_clippy_paths
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      when: never
    - if: $CI_COMMIT_BRANCH
      changes: *rust_tooling_clippy_paths
    - if: $CI_COMMIT_TAG

.rust-tooling-package:
  extends: .rust-base
  stage: build
  before_script:
    # extends does not merge before_script arrays -- redefining this key
    # here would otherwise silently drop .rust-base's cache-policy
    # assertion for every job built on this template.
    - !reference [.rust-base, before_script]
    # .rust-base's referenced before_script already cd's into tooling/rust.
    - apt-get update -qq && apt-get install -y -qq binutils jq musl-tools zip
    # The repository config preserves Cross's prefixed linker name. Debian's
    # musl-tools package exposes the native wrapper as musl-gcc, so override
    # only the mandatory native x86_64 target in this job environment.
    - export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
  script:
    - VERSION="$(cat ../../agf/VERSION)"
    - export AGOV_BUILD_COMMIT="${CI_COMMIT_SHA:-unknown}"
    - export AGOV_BUILD_DIRTY=false
    - export AGOV_BUILD_SOURCE_DIRTY=false
    # Validate the complete manifest before any target build, staging, or
    # archive write. Every later consumer can safely iterate it only after
    # this fail-closed pass succeeds.
    - |
      awk '
        function reject(message) {
          printf "invalid release-target manifest %s:%d: %s\n", FILENAME, NR, message > "/dev/stderr"
          failed = 1
        }
        function unsafe(value) {
          return value ~ /[\\\/]/ || index(value, "..") || value ~ /^-/ || value ~ /[[:cntrl:]]/
        }
        /^[[:space:]]*$/ { next }
        /^#/ { next }
        {
          if (NF != 2) { reject("expected exactly two fields: <rust-triple> <public-slug>"); next }
          if (unsafe($1) || unsafe($2)) {
            reject("fields must be safe path-component tokens (no slash, backslash, .., leading -, whitespace, or control characters)")
            next
          }
          if (targets[$1]++) { reject("duplicate target: " $1); next }
          if (slugs[$2]++) { reject("duplicate slug: " $2); next }
          count++
        }
        END {
          if (failed) exit 1
          if (count == 0) { print "invalid release-target manifest: no target records" > "/dev/stderr"; exit 1 }
        }
      ' release-targets.txt
    - scripts/stage-tooling-runbook.sh selftest
    - scripts/check-release-self-sufficiency.sh selftest
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_VERSION="${CI_COMMIT_TAG#v}"
        if [ "$TAG_VERSION" != "$VERSION" ]; then
          echo "Tag $CI_COMMIT_TAG does not match agf/VERSION $VERSION" >&2
          exit 1
        fi
      fi
    - mkdir -p ../../dist
    # Host-native (non-cross) agov binary, used only to generate
    # schema-valid provenance records for the cross-compiled archives
    # below -- it never needs to execute target-platform code, only read
    # each archive's bytes and write JSON per the unified release-
    # provenance contract (agf/schemas/release-provenance.schema.json).
    - cargo build --quiet --release -p agov
    - AGOV_BIN="$PWD/target/release/agov"
    - |
      # The validated manifest is the sole mandatory Linux target/slug list.
      # Reinstating aarch64 requires a governed one-line manifest change and
      # adequate sponsored runner capacity; no hardcoded target arm lives here.
      while IFS=' ' read -r target slug extra; do
        [ -n "$target" ] || continue
        case "$target" in \#*) continue ;; esac
        rustup target add "$target"
        cargo clean --release --target "$target" -p agov -p agov-mcp
        cargo build --release --target "$target" -p agov -p agov-mcp
        sh scripts/verify-tooling-provenance.sh --binary "$VERSION" "$CI_COMMIT_SHA" \
          "target/${target}/release/agov" "target/${target}/release/agov-mcp"
        archive="agov-${VERSION}-${slug}.tar.gz"
        staging="$(mktemp -d)"
        mkdir -p "$staging/agov-${VERSION}-${slug}"
        cp "target/${target}/release/agov" "$staging/agov-${VERSION}-${slug}/agov"
        cp "target/${target}/release/agov-mcp" "$staging/agov-${VERSION}-${slug}/agov-mcp"
        cmp "target/${target}/release/agov" "$staging/agov-${VERSION}-${slug}/agov"
        cmp "target/${target}/release/agov-mcp" "$staging/agov-${VERSION}-${slug}/agov-mcp"
        chmod 0755 "$staging/agov-${VERSION}-${slug}/agov"
        chmod 0755 "$staging/agov-${VERSION}-${slug}/agov-mcp"
        mkdir -p "$staging/agov-${VERSION}-${slug}/examples/claude"
        cp ../../examples/claude/.mcp.json "$staging/agov-${VERSION}-${slug}/examples/claude/.mcp.json"
        cmp ../../examples/claude/.mcp.json "$staging/agov-${VERSION}-${slug}/examples/claude/.mcp.json"
        printf "AGF agov Rust tooling\nVersion: %s\nTarget: %s\n\nagov-mcp is the stdio MCP server for agov. Install by placing both agov and agov-mcp on PATH. To configure Claude Code, copy examples/claude/.mcp.json to the project root as .mcp.json, review it, and approve the project-scoped agov server when prompted. AGOV_MCP_AGOV_BIN may optionally point agov-mcp at a specific agov executable.\n\nDocumentation: https://gitlab.com/janipaijanen/agents-govern-framework/-/blob/main/agf/docs/site/docs/adopt/mcp-server.md\n" \
          "$VERSION" "$target" > "$staging/agov-${VERSION}-${slug}/README.txt"
        scripts/stage-tooling-runbook.sh stage "$staging/agov-${VERSION}-${slug}"
        tar -C "$staging" -czf "../../dist/${archive}" "agov-${VERSION}-${slug}"
        (cd ../../dist && sha256sum "${archive}" > "${archive}.sha256")
        "$AGOV_BIN" dist provenance-record file \
          --product agov --version "$VERSION" --source-commit "${CI_COMMIT_SHA:-unknown}" \
          --tag "${CI_COMMIT_TAG:-untagged}" \
          --build-timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --pipeline-id "${CI_PIPELINE_ID:-unknown}" --job-id "${CI_JOB_ID:-unknown}" \
          --implementation rust --packaging tar.gz --target-platform "$target" \
          --artifact "../../dist/${archive}" \
          --output "../../dist/${archive}-provenance.json"
        rm -rf "$staging"
      done < release-targets.txt
    # Windows packaging is optional preview evidence. It runs only on demand
    # via AGOV_PACKAGE_WINDOWS_PREVIEW=1 (the
    # rust:tooling:preview:windows-package manual job), never as part of a tag
    # release. Tag releases publish the mandatory Linux tooling archives.
    - |
      if [ "${AGOV_PACKAGE_WINDOWS_PREVIEW:-}" = "1" ]; then
        target="x86_64-pc-windows-gnu"
        slug="windows-x86_64"
        cargo clean --release --target "$target" -p agov -p agov-mcp
        cross build --release --target "$target" -p agov -p agov-mcp
        sh scripts/verify-tooling-provenance.sh --binary "$VERSION" "$CI_COMMIT_SHA" \
          "target/${target}/release/agov.exe" "target/${target}/release/agov-mcp.exe"
        archive="agov-${VERSION}-${slug}.zip"
        staging="$(mktemp -d)"
        dist_dir="$(cd ../../dist && pwd)"
        mkdir -p "$staging/agov-${VERSION}-${slug}"
        cp "target/${target}/release/agov.exe" "$staging/agov-${VERSION}-${slug}/agov.exe"
        cp "target/${target}/release/agov-mcp.exe" "$staging/agov-${VERSION}-${slug}/agov-mcp.exe"
        cmp "target/${target}/release/agov.exe" "$staging/agov-${VERSION}-${slug}/agov.exe"
        cmp "target/${target}/release/agov-mcp.exe" "$staging/agov-${VERSION}-${slug}/agov-mcp.exe"
        mkdir -p "$staging/agov-${VERSION}-${slug}/examples/claude"
        cp ../../examples/claude/.mcp.json "$staging/agov-${VERSION}-${slug}/examples/claude/.mcp.json"
        cmp ../../examples/claude/.mcp.json "$staging/agov-${VERSION}-${slug}/examples/claude/.mcp.json"
        printf "AGF agov Rust tooling\nVersion: %s\nTarget: %s\n\nagov-mcp.exe is the stdio MCP server for agov.exe. Install by placing both agov.exe and agov-mcp.exe on PATH. To configure Claude Code, copy examples/claude/.mcp.json to the project root as .mcp.json, review it, and approve the project-scoped agov server when prompted. AGOV_MCP_AGOV_BIN may optionally point agov-mcp at a specific agov executable.\n\nDocumentation: https://gitlab.com/janipaijanen/agents-govern-framework/-/blob/main/agf/docs/site/docs/adopt/mcp-server.md\n" \
          "$VERSION" "$target" > "$staging/agov-${VERSION}-${slug}/README.txt"
        scripts/stage-tooling-runbook.sh stage "$staging/agov-${VERSION}-${slug}"
        (cd "$staging" && zip -qr "$dist_dir/${archive}" "agov-${VERSION}-${slug}")
        (cd ../../dist && sha256sum "${archive}" > "${archive}.sha256")
        "$AGOV_BIN" dist provenance-record file \
          --product agov --version "$VERSION" --source-commit "${CI_COMMIT_SHA:-unknown}" \
          --tag "${CI_COMMIT_TAG:-untagged}" \
          --build-timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --pipeline-id "${CI_PIPELINE_ID:-unknown}" --job-id "${CI_JOB_ID:-unknown}" \
          --implementation rust --packaging zip --target-platform "$target" \
          --artifact "../../dist/${archive}" \
          --output "../../dist/${archive}-provenance.json"
        rm -rf "$staging"
      fi
    - ../../tooling/rust/scripts/check-no-elixir-artifacts.sh check ../../dist/agov-*.tar.gz
    - scripts/check-release-self-sufficiency.sh check ../../dist/agov-*.tar.gz
    - |
      if find ../../dist -maxdepth 1 -name 'agov-*.zip' -print -quit | grep -q .; then
        ../../tooling/rust/scripts/check-no-elixir-artifacts.sh check ../../dist/agov-*.zip
        scripts/check-release-self-sufficiency.sh check ../../dist/agov-*.zip
      fi
  artifacts:
    paths:
      - dist/agov-*.tar.gz
      - dist/agov-*.tar.gz.sha256
      - dist/agov-*.zip
      - dist/agov-*.zip.sha256
      - dist/agov-*-provenance.json

# The optional Windows packaging preview still needs Cross and a container
# engine for its MinGW sysroot. Keep that dependency isolated from mandatory
# Linux previews and tag releases so a DinD failure cannot block publication.
.rust-tooling-windows-package:
  extends: .rust-tooling-package
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    CROSS_REMOTE: "1"
  before_script:
    # extends does not merge before_script arrays. Preserve the cache-policy
    # assertion and install both the common archive tools and Windows Cross.
    - !reference [.rust-base, before_script]
    - apt-get update -qq && apt-get install -y -qq binutils docker.io jq zip
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo install --list 2>/dev/null | grep -qE "^cross v0\.2\.[0-9]+:" || cargo install cross --locked --version "^0.2" --force

# Build preview Rust tooling archives for Linux platform targets. These
# artifacts are not releases.
rust:tooling:preview:
  extends: .rust-tooling-package
  interruptible: true
  artifacts:
    name: "agov-rust-preview-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &rust_tooling_preview_paths
        - tooling/rust/**/*
        - .gitlab-ci.yml
        # agf/VERSION names the produced archive (dist/agov-$VERSION-*.tar.gz)
        # and is consumed by agov:oci:mr-build-scan via `needs`. Without it
        # here, a VERSION-only change would trigger that job while leaving
        # its dependency unbuilt.
        - agf/VERSION
        - agf/docs/site/docs/operate/poll-and-coordinate.md
        - examples/claude/.mcp.json
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      changes:
        compare_to: 'refs/heads/$CI_DEFAULT_BRANCH'
        paths: *rust_tooling_preview_paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *rust_tooling_preview_paths

# Manual evidence job: run the full .rust-tooling-package script including
# the Windows packaging block (AGOV_PACKAGE_WINDOWS_PREVIEW=1) so the
# packaged agov-<version>-windows-x86_64.zip, its .sha256 sidecar, and its
# provenance record are producible and inspectable from an MR pipeline
# without creating a release tag.
rust:tooling:preview:windows-package:
  tags:
    - dind
  extends: .rust-tooling-windows-package
  interruptible: true
  variables:
    AGOV_PACKAGE_WINDOWS_PREVIEW: "1"
  artifacts:
    name: "agov-rust-windows-package-preview-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
        # agf/VERSION names the produced archive (dist/agov-$VERSION-*.tar.gz)
        # and is consumed by agov:oci:mr-build-scan via `needs`. Without it
        # here, a VERSION-only change would trigger that job while leaving
        # its dependency unbuilt.
        - agf/VERSION
        - agf/docs/site/docs/operate/poll-and-coordinate.md
        - examples/claude/.mcp.json
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
        # agf/VERSION names the produced archive (dist/agov-$VERSION-*.tar.gz)
        # and is consumed by agov:oci:mr-build-scan via `needs`. Without it
        # here, a VERSION-only change would trigger that job while leaving
        # its dependency unbuilt.
        - agf/VERSION
        - agf/docs/site/docs/operate/poll-and-coordinate.md
        - examples/claude/.mcp.json
      when: manual
      allow_failure: true

# Build mandatory Linux Rust tooling archives only on tag pipelines. Windows
# packaging remains available through the optional manual preview job above.
rust:tooling:release:
  extends: .rust-tooling-package
  artifacts:
    name: "agov-rust-$CI_COMMIT_TAG"
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# Phase 1 release gate: verify every framework and mandatory tooling artifact
# before OCI publication is allowed to start. OCI provenance is necessarily
# excluded here because it records the digest produced by the later push.
release:assets-verify-pre-oci:
  image: alpine:3.22
  stage: deploy
  needs:
    - job: agf:dist:release
      artifacts: true
    - job: rust:tooling:release
      artifacts: true
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - tooling/rust/scripts/release-assets.sh verify-pre-oci dist "$VERSION"
  rules:
    - if: $CI_COMMIT_TAG

agov:oci:release:
  tags:
    - podman
    - linux
    - amd64
  image: quay.io/podman/stable:v5.6.0
  stage: deploy
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: oci
  needs:
    - job: rust:tooling:release
      artifacts: true
    - job: release:assets-verify-pre-oci
  script:
    - export AGOV_VERSION="$(cat agf/VERSION)"
    - tooling/rust/scripts/agov-oci-image.sh check-tag
    - tooling/rust/scripts/agov-oci-image.sh build
    - tooling/rust/scripts/agov-oci-image.sh scan
    - tooling/rust/scripts/agov-oci-image.sh push
    - tooling/rust/scripts/agov-oci-image.sh provenance
  artifacts:
    paths:
      - dist/agov-oci-*-provenance.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# Manual Windows x64 preview build. This is intentionally separate from the
# default Rust preview job so ordinary MRs do not pay the Windows cross-build
# cost, while release preparation can still request Windows artifacts.
rust:tooling:build:windows:preview:
  tags:
    - dind
  extends: .rust-base
  stage: build
  interruptible: true
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    CROSS_REMOTE: "1"
  before_script:
    # extends does not merge before_script arrays -- redefining this key
    # here would otherwise silently drop .rust-base's cache-policy
    # assertion.
    - !reference [.rust-base, before_script]
    # .rust-base's referenced before_script already cd's into tooling/rust.
    - apt-get update -qq && apt-get install -y -qq docker.io
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo install --list 2>/dev/null | grep -qE "^cross v0\.2\.[0-9]+:" || cargo install cross --locked --version "^0.2" --force
  script:
    - cross build --release --target x86_64-pc-windows-gnu -p agov -p agov-mcp
  artifacts:
    name: "agov-rust-windows-preview-$CI_COMMIT_SHORT_SHA"
    paths:
      - tooling/rust/target/x86_64-pc-windows-gnu/release/agov.exe
      - tooling/rust/target/x86_64-pc-windows-gnu/release/agov-mcp.exe
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
