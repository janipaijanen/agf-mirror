#
# AGF v2.0 CI pipeline
#
# Jobs run from the repository root. Paths are prefixed with agf/ or
# tooling/rust/ accordingly (local commands run from within those
# subdirectories instead — see agf/docs/build/README.md).
#
# Pipeline structure:
#   site-html-build   — MkDocs strict build; review artifact on MRs and branches
#   pages             — publish to GitLab Pages from the default branch
#   agf:flyer:verify  — check the committed nutshell-flyer PNG isn't stale vs. its source
#   agf:dist:validate — validate the manifest-driven framework package with Rust agov
#   agf:dist:preview  — build review-only framework archives with Rust agov
#   agf:dist:release  — tag pipelines only; Rust tag/VERSION guard then build archives
#   dependency:cve-scan — scan dependency lockfiles for known vulnerabilities
#   rust:tooling:*    — Rust tooling: validation, tests, clippy, parity, archives
#   release:create    — upload archives to package registry; create GitLab release entry

variables:
  # Fail-safe default: every pipeline context is pull-only for the shared
  # Rust cache unless the workflow rule below identifies an ordinary
  # default-branch push. A context that fails to match that rule -- an
  # unset/future CI_PIPELINE_SOURCE included -- must never accidentally
  # resolve to a writer. See docs/plans/ci-rust-cache-policy-slice-a.md
  # and issue #101 (child scope of #53).
  #
  # RUST_CACHE_POLICY governs every .rust-base consumer and is never
  # overridden away from "pull" -- Slice B narrows the default-branch
  # write path to a single designated writer via the separate
  # RUST_CACHE_WRITER_POLICY variable below, so a new inheritor is
  # pull-only by construction rather than by remembering to opt out.
  # See docs/plans/ci-rust-cache-policy-slice-b.md.
  RUST_CACHE_POLICY: "pull"
  RUST_CACHE_WRITER_POLICY: "pull"

workflow:
  rules:
    # Coordination-only candidates are NOT suppressed at the workflow level.
    # A commit title or [ci skip] convention is an unverified claim about the
    # branch, not a safety mechanism -- MR !692 demonstrated a branch titled
    # and described as coordination-only can still carry implementation
    # history. Coordination candidates instead run a real, lightweight
    # mechanical check (agov:governance:validate's `coord publication-check`
    # call) while expensive implementation jobs skip themselves via their own
    # path-scoped `rules:` (most already exclude docs/coordination/**-only
    # changes by construction). See
    # agf/rules/workflow/coordination-publication-rule.md and issue #72.
    #
    # Suppress a redundant branch-push pipeline when this branch already has
    # an open MR (the MR pipeline covers the same commit). Never matches the
    # default branch (no MR sources from it), a tag push (CI_COMMIT_BRANCH is
    # unset), or the MR pipeline itself (CI_PIPELINE_SOURCE != "push" there).
    # See docs/plans/ci-pipeline-deduplication.md for the full acceptance
    # matrix and rationale.
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    # The sole Rust-cache writer context: an ordinary default-branch push.
    # The conjunction is intentional -- push excludes schedule/api/web/
    # trigger/pipeline sources, a truthy branch excludes tag pipelines
    # (CI_COMMIT_BRANCH is unset there), and equality selects only the
    # default branch. Every other context falls through to the catch-all
    # below and keeps the fail-safe "pull" default set above. This rule
    # only ever overrides RUST_CACHE_WRITER_POLICY, never RUST_CACHE_POLICY
    # -- Slice B's single designated writer (rust:tooling:test) is the only
    # job that consumes RUST_CACHE_WRITER_POLICY; every other consumer stays
    # on the fail-safe RUST_CACHE_POLICY="pull" set above regardless of
    # context. See docs/plans/ci-rust-cache-policy-slice-b.md's context
    # acceptance matrix and .gitlab/scripts/check-rust-cache-policy.sh.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        RUST_CACHE_WRITER_POLICY: "pull-push"
    - when: always

# ── Shared templates ──────────────────────────────────────────────────────────

.rust-base:
  # Immutable image-index pin, not a floating tag -- a digest always
  # resolves to exactly one manifest. Re-resolved live against the Docker
  # Hub registry API at implementation time (2026-08-02): rust:1 and
  # rust:1.97.1 both report this digest, whose linux/amd64 config declares
  # RUST_VERSION=1.97.1. See docs/plans/ci-rust-cache-policy-slice-b.md.
  image: rust:1.97.1@sha256:1bcff4befb740599103a2c7cb51058e14479b2e35e3a34a3f0dc4ede09927488
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    # Every .rust-base inheritor is a cache consumer by default. Only
    # rust:tooling:test overrides this to "writer" -- see Slice B's plan
    # for why a second override anywhere else is a plan violation, not a
    # local judgment call.
    RUST_CACHE_ROLE: "consumer"
  cache:
    # Versioned shared key: non-default consumers read the main-fed
    # namespace directly instead of preferring a stale branch-specific
    # cache they can no longer refresh. v2/legacy remain as fallbacks so
    # the first post-Slice-B default-branch pipeline can still restore a
    # prior generation while rust-v3-main populates under the pinned
    # image. See docs/plans/ci-rust-cache-policy-slice-b.md.
    key: rust-v3-main
    fallback_keys:
      - rust-v2-main
      - rust-main
    paths:
      - .cargo/registry
      - .cargo/bin
      - tooling/rust/target
    policy: $RUST_CACHE_POLICY
  before_script:
    - sh .gitlab/scripts/check-rust-cache-policy.sh assert-current
    - cd tooling/rust
    - export AGOV_BUILD_COMMIT="${CI_COMMIT_SHA:-unknown}"
    - export AGOV_BUILD_DIRTY=false
    - export AGOV_BUILD_SOURCE_DIRTY=false

.mkdocs-base:
  image: python:3.14-slim
  before_script:
    # python:3.14-slim has no git; release_info.py's unit tests build a real
    # git repo, and both docs jobs run `git fetch --tags` for release-tag
    # resolution. Both need a working `git` on PATH before the build step.
    - apt-get update -qq && apt-get install -y --no-install-recommends git >/dev/null
    - >-
      pip install --quiet
      'mkdocs>=1.6,<2'
      'mkdocs-material>=9.5,<10'
      'mkdocs-awesome-pages-plugin>=2.9,<3'
      'mkdocs-gen-files>=0.5,<1'
      'pymdown-extensions>=10.7,<11'

# ── Dependency vulnerability scanning ─────────────────────────────────────────

# Scan committed dependency manifests and lockfiles for known CVEs.
# Trivy filesystem scanning detects language lockfiles, including Cargo.lock
# and mix.lock, without building project artifacts. The JSON report is kept for
# review; HIGH and CRITICAL findings with fixes available block the pipeline.
dependency:cve-scan:
  image:
    name: aquasec/trivy:0.66.0
    entrypoint: [""]
  stage: test
  interruptible: true
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths:
      - .trivy-cache/
  script:
    - trivy --version
    - >-
      trivy fs
      --scanners vuln
      --skip-dirs agents-govern/.venv
      --skip-dirs agf/site-html
      --skip-dirs tooling/rust/target
      --format json
      --output trivy-dependency-vulnerabilities.json
      .
    - >-
      trivy fs
      --scanners vuln
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --dependency-tree
      --skip-dirs agents-govern/.venv
      --skip-dirs agf/site-html
      --skip-dirs tooling/rust/target
      --exit-code 1
      .
  artifacts:
    name: "dependency-cve-scan-$CI_COMMIT_SHORT_SHA"
    paths:
      - trivy-dependency-vulnerabilities.json
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &dependency_cve_scan_paths
        - .gitlab-ci.yml
        - mise.toml
        - tooling/rust/Cargo.lock
        - tooling/rust/**/*.toml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      changes:
        compare_to: 'refs/heads/$CI_DEFAULT_BRANCH'
        paths: *dependency_cve_scan_paths
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      when: never
    - if: $CI_COMMIT_BRANCH
      changes: *dependency_cve_scan_paths
    - if: $CI_COMMIT_TAG

# ── Documentation ─────────────────────────────────────────────────────────────

# Build the MkDocs site on every push and MR for review.
# Strict mode fails on broken internal links.
site-html-build:
  extends: .mkdocs-base
  stage: build
  interruptible: true
  script:
    - python3 agf/docs/build/hooks/check_palette_contrast.py --self-test
    - python3 agf/docs/build/hooks/check_palette_contrast.py
    - python3 agf/docs/build/hooks/check_stale_version_labels.py --self-test
    - python3 agf/docs/build/hooks/check_stale_version_labels.py
    - python3 agf/docs/build/hooks/check_commissioning_first_screen.py --self-test
    - python3 agf/docs/build/hooks/check_commissioning_links.py --self-test
    - python3 -m unittest discover -s agf/docs/build/hooks -p 'test_*.py' -v
    - python3 -m unittest discover -s tooling/tests -p 'test_*.py' -v
    # Shallow checkouts do not fetch tags by default, and a depth-limited tag
    # fetch alone is not enough: release_info.py's `git merge-base
    # --is-ancestor` check needs the full commit graph between the release
    # tag and HEAD to classify a later build as "after" the release rather
    # than "diverged/unknown" (fact-check: docs/coordination/
    # 20260726T130159Z-fact-checker-8ka5.md finding 1). Unshallow first (a
    # no-op if the checkout is already complete), then fetch tags. Depth-1
    # tag fetch feasibility was separately confirmed:
    # docs/coordination/20260726T122556Z-planner-architect-smh3.md
    - |
      if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
        git fetch --force --unshallow origin
      fi
    - git fetch --force --tags origin
    - mkdocs build -f agf/docs/build/mkdocs.yml --strict
    # These two run against agf/site-html/ (rendered DOM order, hero CTA
    # resolution) -- they require the strict build above to have already
    # run. See 20260808T140046Z-coder-tester-qnbd.md (GS-B-1, GS-B-3): an
    # earlier version ran them before the build against Markdown source
    # instead.
    - python3 agf/docs/build/hooks/check_commissioning_first_screen.py
    - python3 agf/docs/build/hooks/check_commissioning_links.py
  artifacts:
    name: "docs-$CI_COMMIT_SHORT_SHA"
    paths:
      - agf/site-html/
    expire_in: 1 day
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &site_html_build_paths
        - agf/docs/**/*
        - agf/VERSION
        - agf/CHANGELOG.md
        - agf/ADOPTING.md
        - agf/framework.md
        - mkdocs.yml
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      changes:
        compare_to: 'refs/heads/$CI_DEFAULT_BRANCH'
        paths: *site_html_build_paths
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes: *site_html_build_paths

# Publish to GitLab Pages from the default branch.
# The pages job must produce a public/ artifact.
pages:
  extends: .mkdocs-base
  stage: deploy
  script:
    # Shallow checkouts do not fetch tags by default, and a depth-limited tag
    # fetch alone is not enough: release_info.py's `git merge-base
    # --is-ancestor` check needs the full commit graph between the release
    # tag and HEAD to classify a later build as "after" the release rather
    # than "diverged/unknown" (fact-check: docs/coordination/
    # 20260726T130159Z-fact-checker-8ka5.md finding 1). Unshallow first (a
    # no-op if the checkout is already complete), then fetch tags. Depth-1
    # tag fetch feasibility was separately confirmed:
    # docs/coordination/20260726T122556Z-planner-architect-smh3.md
    - |
      if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
        git fetch --force --unshallow origin
      fi
    - git fetch --force --tags origin
    - mkdocs build -f agf/docs/build/mkdocs.yml --strict --site-dir ../../../public
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - agf/docs/**/*
        - agf/VERSION
        - agf/CHANGELOG.md
        - agf/ADOPTING.md
        - agf/framework.md
        - mkdocs.yml
        - .gitlab-ci.yml

# Verify the committed nutshell-flyer PNG (agf/docs/figures/agf-nutshell-flyer.png
# and its byte-identical site copy) is not stale relative to its source.
# Same convention as the Graphviz diagrams: source + rendered output are both
# committed, nothing auto-regenerates. This job re-renders from source and
# compares against the committed copies:
#   - hard-fails if the generator errors, if the two committed copies have
#     diverged from each other, or if the rendered dimensions differ (catches
#     structural/layout regressions);
#   - prints an advisory (non-blocking) note if the freshly-rendered PNG's
#     content hash differs from the committed one, since a headless-browser
#     PNG encode is not guaranteed byte-identical across Chromium versions —
#     a hard pixel-diff gate here would be flaky, not meaningful.
agf:flyer:verify:
  image: python:3.14-slim
  stage: test
  interruptible: true
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends chromium >/dev/null
  script:
    - |
      set -eu
      cd agf/docs/figures/src/agf-nutshell-flyer
      python3 build_flyer.py -o /tmp/agf-nutshell-flyer-verify.html
      chromium --headless --disable-gpu --no-sandbox --window-size=1600,1131 \
        --screenshot=/tmp/agf-nutshell-flyer-verify.png \
        "file:///tmp/agf-nutshell-flyer-verify.html"
      cd "$CI_PROJECT_DIR"

      python3 - <<'PY'
      import hashlib
      import pathlib
      import struct
      import sys

      def dimensions(path):
          data = pathlib.Path(path).read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              sys.exit(f"{path}: not a PNG file")
          width, height = struct.unpack(">II", data[16:24])
          return width, height, hashlib.sha256(data).hexdigest()

      committed = "agf/docs/figures/agf-nutshell-flyer.png"
      site_copy = "agf/docs/site/reference/figures/agf-nutshell-flyer.png"
      fresh = "/tmp/agf-nutshell-flyer-verify.png"

      cw, ch, chash = dimensions(committed)
      sw, sh, shash = dimensions(site_copy)
      fw, fh, fhash = dimensions(fresh)

      if (cw, ch) != (sw, sh) or chash != shash:
          sys.exit(
              f"{committed} and {site_copy} have diverged — the dual-copy "
              "convention requires them to be byte-identical."
          )

      if (cw, ch) != (fw, fh):
          sys.exit(
              f"Committed flyer PNG is {cw}x{ch}, a fresh render from the "
              f"current source is {fw}x{fh} — likely a structural/layout "
              "regression. Regenerate and commit (see "
              "agf/docs/figures/src/agf-nutshell-flyer/README.md)."
          )

      if chash != fhash:
          print(
              "ADVISORY: committed flyer PNG content hash differs from a "
              "fresh render (dimensions match). This can be normal "
              "Chromium-version rendering drift, or the flyer may be stale "
              "(e.g. after an agf/VERSION bump). Not blocking; regenerate "
              "if the content actually changed."
          )
      else:
          print("Flyer PNG matches a fresh render exactly.")
      PY
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &agf_flyer_verify_paths
        - agf/docs/figures/src/agf-nutshell-flyer/**/*
        - agf/docs/figures/agf-nutshell-flyer.png
        - agf/docs/site/reference/figures/agf-nutshell-flyer.png
        - agf/VERSION
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      changes:
        compare_to: 'refs/heads/$CI_DEFAULT_BRANCH'
        paths: *agf_flyer_verify_paths
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      when: never
    - if: $CI_COMMIT_BRANCH
      changes: *agf_flyer_verify_paths
    - if: $CI_COMMIT_TAG

# ── Framework package artifacts ───────────────────────────────────────────────

# Validate the manifest-driven framework package on merge requests, branches,
# and tags without writing archives.
agf:dist:validate:
  extends: .rust-base
  stage: test
  interruptible: true
  script:
    - cargo run --quiet -p agov -- dist validate
    - scripts/check-release-self-sufficiency.sh check ../..
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &agf_dist_validate_paths
        - agf/**/*
        - .gitlab-ci.yml
        - docs/reviews/agf-framework-assessment-codex-sol-high.md
        - docs/reviews/todo-and-sol-high-synthesis-prioritized-actions.md
        - tooling/rust/scripts/check-release-self-sufficiency.sh
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      changes:
        compare_to: 'refs/heads/$CI_DEFAULT_BRANCH'
        paths: *agf_dist_validate_paths
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      when: never
    - if: $CI_COMMIT_BRANCH
      changes: *agf_dist_validate_paths
    - if: $CI_COMMIT_TAG

# Build preview archives for reviewers. These artifacts are not releases.
agf:dist:preview:
  extends: .rust-base
  stage: build
  interruptible: true
  script:
    - cargo run --quiet -p agov -- dist validate
    - cargo run --quiet -p agov -- dist build
    - scripts/check-no-elixir-artifacts.sh check ../../dist/agf-*.tar.gz ../../dist/agf-*.zip
    - scripts/check-release-self-sufficiency.sh check ../../dist/agf-*.tar.gz ../../dist/agf-*.zip
  artifacts:
    name: "agf-preview-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/*.sha256
      - dist/*-provenance.json
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agf/**/*
        - .gitlab-ci.yml
        - docs/reviews/agf-framework-assessment-codex-sol-high.md
        - docs/reviews/todo-and-sol-high-synthesis-prioritized-actions.md
        - tooling/rust/scripts/check-release-self-sufficiency.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - agf/**/*
        - .gitlab-ci.yml
        - docs/reviews/agf-framework-assessment-codex-sol-high.md
        - docs/reviews/todo-and-sol-high-synthesis-prioritized-actions.md
        - tooling/rust/scripts/check-release-self-sufficiency.sh

# Build release archives only on tag pipelines.
# The tag must match agf/VERSION or this job fails before any archive is written.
agf:dist:release:
  extends: .rust-base
  stage: deploy
  script:
    - cargo run --quiet -p agov -- dist check-tag
    - cargo run --quiet -p agov -- dist validate
    - cargo run --quiet -p agov -- dist build
    - scripts/check-no-elixir-artifacts.sh check ../../dist/agf-*.tar.gz ../../dist/agf-*.zip
    - scripts/check-release-self-sufficiency.sh check ../../dist/agf-*.tar.gz ../../dist/agf-*.zip
  artifacts:
    name: "agf-$CI_COMMIT_TAG"
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/*.sha256
      - dist/*-provenance.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# Publish all release archives to the generic package registry and create the
# GitLab release entry with download links. Tooling links are Rust-only,
# platform-specific archives.
release:create:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: agf:dist:release
      artifacts: true
    - job: rust:tooling:release
      artifacts: true
    - job: agov:oci:release
      artifacts: true
  script:
    - apk add --no-cache curl unzip
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKG_BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agf/$CI_COMMIT_TAG"
    # Fail fast on a partial build/publish -- a real assembled `dist/` is
    # checked against the exact mandatory asset set before anything is
    # uploaded or a Release entry is created, so a missing archive or
    # sidecar blocks the pipeline instead of shipping an incomplete release.
    - tooling/rust/scripts/release-assets.sh verify dist "$VERSION"
    - tooling/rust/scripts/check-no-elixir-artifacts.sh check dist/agf-*.tar.gz dist/agf-*.zip dist/agov-*.tar.gz
    - |
      if find dist -maxdepth 1 -name 'agov-*.zip' -print -quit | grep -q .; then
        tooling/rust/scripts/check-no-elixir-artifacts.sh check dist/agov-*.zip
      fi
    # Validate the complete assembled release set -- schema, cross-record
    # cardinality bijection (every primary artifact exactly one record, no
    # stale/extra records), and artifact/sha256/checksum-sidecar agreement
    # -- before anything is uploaded. This image has no agov of its own;
    # extract it from the already-built musl tooling archive, matching the
    # pattern agov-oci-image.sh already uses for the same reason.
    - apk add --no-cache tar gzip
    - |
      staging="$(mktemp -d)"
      tar -xzf "dist/agov-${VERSION}-linux-x86_64.tar.gz" -C "$staging"
      AGOV_BIN="$staging/agov-${VERSION}-linux-x86_64/agov"
      "$AGOV_BIN" dist validate-provenance dist/*-provenance.json --artifact-dir dist
      rm -rf "$staging"
    # Upload every release artifact to the generic package registry.
    # The glob covers framework archives, Rust tooling archives, checksums, and provenance.
    - |
      for f in dist/agf-*.tar.gz dist/agf-*.zip dist/agov-*.tar.gz dist/agov-*.zip \
                dist/*.sha256 dist/*-provenance.json \
                dist/SHA256SUMS; do
        [ -f "$f" ] || continue
        fname=$(basename "$f")
        echo "Uploading $fname"
        curl --silent --fail --show-error \
             --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$f" \
             "$PKG_BASE/$fname"
      done
    # Create the GitLab release entry, linking every archive AND its checksum/
    # provenance sidecars directly -- consumers must not have to guess generic-
    # package URLs. tooling/rust/scripts/release-assets.sh enumerates exactly
    # the files release:create just uploaded above (same glob); its `selftest`
    # subcommand is exercised in CI on every change (job release:assets-selftest).
    - |
      set -- \
        --name "agents-govern $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "See [CHANGELOG](https://gitlab.com/$CI_PROJECT_PATH/-/blob/$CI_COMMIT_TAG/agf/CHANGELOG.md) for release notes."
      for fname in $(tooling/rust/scripts/release-assets.sh list dist); do
        set -- "$@" --assets-link "{\"name\":\"${fname}\",\"url\":\"${PKG_BASE}/${fname}\",\"link_type\":\"package\"}"
      done
      release-cli create \
        "$@"

# Composed post-publication verification: re-fetches the just-created
# GitLab Release from its public API (not this pipeline's `dist/` copy),
# downloads every linked asset fresh, and runs the full composed check --
# schema/hash/sidecar agreement, cardinality bijection, real OCI-registry
# pull-by-digest evidence, and real packaged-binary self-report execution
# -- against those downloaded bytes. `release:create`'s own
# `validate-provenance` call is a build-time pre-upload gate; this job is
# the public-lifecycle counterpart per !351 Gate 2 acceptance matrix row D
# ("the tag/release path must exercise this composed check"). Runs on the
# podman image so the OCI pull-by-digest evidence check has a real
# `podman` to shell out to, matching `agov:oci:release`'s own image choice.
release:verify:
  image: quay.io/podman/stable:v5.6.0
  stage: deploy
  variables:
    STORAGE_DRIVER: vfs
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: release:create
    - job: rust:tooling:release
      artifacts: true
  script:
    - command -v curl >/dev/null || dnf install -y curl
    - command -v tar >/dev/null || dnf install -y tar gzip
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      staging="$(mktemp -d)"
      tar -xzf "dist/agov-${VERSION}-linux-x86_64.tar.gz" -C "$staging"
      AGOV_BIN="$staging/agov-${VERSION}-linux-x86_64/agov"
      "$AGOV_BIN" dist post-publication-check \
        --releases-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG" \
        --download-dir "$(mktemp -d)"
      rm -rf "$staging"

# Host-preflight self-test for tooling/rust/scripts/release-assets.sh: exercises
# its file-enumeration logic against dummy artifacts so a missing sidecar-link
