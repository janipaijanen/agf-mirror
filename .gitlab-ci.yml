#
# AGF v2.0 CI pipeline
#
# Jobs run from the repository root. Paths are prefixed with agf/ or
# tooling/rust/ accordingly (local commands run from within those
# subdirectories instead — see agf/docs/build/README.md).
#
# Pipeline structure:
#   site-html-build   — MkDocs strict build; review artifact on MRs and branches
#   pages             — publish to GitLab Pages from the default branch
#   agf:flyer:verify  — check the committed nutshell-flyer PNG isn't stale vs. its source
#   agf:dist:validate — validate the manifest-driven framework package with Rust agov
#   agf:dist:preview  — build review-only framework archives with Rust agov
#   agf:dist:release  — tag pipelines only; Rust tag/VERSION guard then build archives
#   dependency:cve-scan — scan dependency lockfiles for known vulnerabilities
#   rust:tooling:*    — Rust tooling: validation, tests, clippy, parity, archives
#   release:create    — upload archives to package registry; create GitLab release entry

workflow:
  rules:
    # Coordination-only commits update the durable governance trail. They should
    # not invalidate the last green code pipeline for an MR. Use this only when
    # the commit changes coordination records and each record was locally
    # validated with agov coord validate; mixed commits must run normal CI.
    - if: '$CI_COMMIT_TITLE =~ /^coordination:/'
      when: never
    - when: always

# ── Shared templates ──────────────────────────────────────────────────────────

.rust-base:
  image: rust:1
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: rust-$CI_COMMIT_REF_SLUG
    fallback_keys:
      - rust-main
    paths:
      - .cargo/registry
      - .cargo/bin
      - tooling/rust/target
  before_script:
    - cd tooling/rust
    - export AGOV_BUILD_COMMIT="${CI_COMMIT_SHA:-unknown}"
    - export AGOV_BUILD_DIRTY=false

.mkdocs-base:
  image: python:3.14-slim
  before_script:
    - >-
      pip install --quiet
      'mkdocs>=1.6,<2'
      'mkdocs-material>=9.5,<10'
      'mkdocs-awesome-pages-plugin>=2.9,<3'
      'mkdocs-gen-files>=0.5,<1'
      'pymdown-extensions>=10.7,<11'

# ── Dependency vulnerability scanning ─────────────────────────────────────────

# Scan committed dependency manifests and lockfiles for known CVEs.
# Trivy filesystem scanning detects language lockfiles, including Cargo.lock
# and mix.lock, without building project artifacts. The JSON report is kept for
# review; HIGH and CRITICAL findings with fixes available block the pipeline.
dependency:cve-scan:
  image:
    name: aquasec/trivy:0.66.0
    entrypoint: [""]
  stage: test
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db
    paths:
      - .trivy-cache/
  script:
    - trivy --version
    - >-
      trivy fs
      --scanners vuln
      --skip-dirs agents-govern/.venv
      --skip-dirs agf/site-html
      --skip-dirs tooling/rust/target
      --format json
      --output trivy-dependency-vulnerabilities.json
      .
    - >-
      trivy fs
      --scanners vuln
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --dependency-tree
      --skip-dirs agents-govern/.venv
      --skip-dirs agf/site-html
      --skip-dirs tooling/rust/target
      --exit-code 1
      .
  artifacts:
    name: "dependency-cve-scan-$CI_COMMIT_SHORT_SHA"
    paths:
      - trivy-dependency-vulnerabilities.json
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - mise.toml
        - tooling/rust/Cargo.lock
        - tooling/rust/**/*.toml
    - if: $CI_COMMIT_BRANCH
      changes:
        - .gitlab-ci.yml
        - mise.toml
        - tooling/rust/Cargo.lock
        - tooling/rust/**/*.toml
    - if: $CI_COMMIT_TAG

# ── Documentation ─────────────────────────────────────────────────────────────

# Build the MkDocs site on every push and MR for review.
# Strict mode fails on broken internal links.
site-html-build:
  extends: .mkdocs-base
  stage: build
  script:
    - mkdocs build -f agf/docs/build/mkdocs.yml --strict
  artifacts:
    name: "docs-$CI_COMMIT_SHORT_SHA"
    paths:
      - agf/site-html/
    expire_in: 1 day
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agf/docs/**/*
        - agf/VERSION
        - agf/CHANGELOG.md
        - agf/ADOPTING.md
        - agf/framework.md
        - mkdocs.yml
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - agf/docs/**/*
        - agf/VERSION
        - agf/CHANGELOG.md
        - agf/ADOPTING.md
        - agf/framework.md
        - mkdocs.yml
        - .gitlab-ci.yml

# Publish to GitLab Pages from the default branch.
# The pages job must produce a public/ artifact.
pages:
  extends: .mkdocs-base
  stage: deploy
  script:
    - mkdocs build -f agf/docs/build/mkdocs.yml --strict --site-dir ../../../public
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - agf/docs/**/*
        - agf/VERSION
        - agf/CHANGELOG.md
        - agf/ADOPTING.md
        - agf/framework.md
        - mkdocs.yml
        - .gitlab-ci.yml

# Verify the committed nutshell-flyer PNG (agf/docs/figures/agf-nutshell-flyer.png
# and its byte-identical site copy) is not stale relative to its source.
# Same convention as the Graphviz diagrams: source + rendered output are both
# committed, nothing auto-regenerates. This job re-renders from source and
# compares against the committed copies:
#   - hard-fails if the generator errors, if the two committed copies have
#     diverged from each other, or if the rendered dimensions differ (catches
#     structural/layout regressions);
#   - prints an advisory (non-blocking) note if the freshly-rendered PNG's
#     content hash differs from the committed one, since a headless-browser
#     PNG encode is not guaranteed byte-identical across Chromium versions —
#     a hard pixel-diff gate here would be flaky, not meaningful.
agf:flyer:verify:
  image: python:3.14-slim
  stage: test
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends chromium >/dev/null
  script:
    - |
      set -eu
      cd agf/docs/figures/src/agf-nutshell-flyer
      python3 build_flyer.py -o /tmp/agf-nutshell-flyer-verify.html
      chromium --headless --disable-gpu --no-sandbox --window-size=1600,1131 \
        --screenshot=/tmp/agf-nutshell-flyer-verify.png \
        "file:///tmp/agf-nutshell-flyer-verify.html"
      cd "$CI_PROJECT_DIR"

      python3 - <<'PY'
      import hashlib
      import pathlib
      import struct
      import sys

      def dimensions(path):
          data = pathlib.Path(path).read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              sys.exit(f"{path}: not a PNG file")
          width, height = struct.unpack(">II", data[16:24])
          return width, height, hashlib.sha256(data).hexdigest()

      committed = "agf/docs/figures/agf-nutshell-flyer.png"
      site_copy = "agf/docs/site/reference/figures/agf-nutshell-flyer.png"
      fresh = "/tmp/agf-nutshell-flyer-verify.png"

      cw, ch, chash = dimensions(committed)
      sw, sh, shash = dimensions(site_copy)
      fw, fh, fhash = dimensions(fresh)

      if (cw, ch) != (sw, sh) or chash != shash:
          sys.exit(
              f"{committed} and {site_copy} have diverged — the dual-copy "
              "convention requires them to be byte-identical."
          )

      if (cw, ch) != (fw, fh):
          sys.exit(
              f"Committed flyer PNG is {cw}x{ch}, a fresh render from the "
              f"current source is {fw}x{fh} — likely a structural/layout "
              "regression. Regenerate and commit (see "
              "agf/docs/figures/src/agf-nutshell-flyer/README.md)."
          )

      if chash != fhash:
          print(
              "ADVISORY: committed flyer PNG content hash differs from a "
              "fresh render (dimensions match). This can be normal "
              "Chromium-version rendering drift, or the flyer may be stale "
              "(e.g. after an agf/VERSION bump). Not blocking; regenerate "
              "if the content actually changed."
          )
      else:
          print("Flyer PNG matches a fresh render exactly.")
      PY
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agf/docs/figures/src/agf-nutshell-flyer/**/*
        - agf/docs/figures/agf-nutshell-flyer.png
        - agf/docs/site/reference/figures/agf-nutshell-flyer.png
        - agf/VERSION
    - if: $CI_COMMIT_BRANCH
      changes:
        - agf/docs/figures/src/agf-nutshell-flyer/**/*
        - agf/docs/figures/agf-nutshell-flyer.png
        - agf/docs/site/reference/figures/agf-nutshell-flyer.png
        - agf/VERSION
    - if: $CI_COMMIT_TAG

# ── Framework package artifacts ───────────────────────────────────────────────

# Validate the manifest-driven framework package on merge requests, branches,
# and tags without writing archives.
agf:dist:validate:
  extends: .rust-base
  stage: test
  script:
    - cargo run --quiet -p agov -- dist validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agf/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - agf/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# Build preview archives for reviewers. These artifacts are not releases.
agf:dist:preview:
  extends: .rust-base
  stage: build
  script:
    - cargo run --quiet -p agov -- dist validate
    - cargo run --quiet -p agov -- dist build
  artifacts:
    name: "agf-preview-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/*.sha256
      - dist/*-provenance.json
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agf/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - agf/**/*
        - .gitlab-ci.yml

# Build release archives only on tag pipelines.
# The tag must match agf/VERSION or this job fails before any archive is written.
agf:dist:release:
  extends: .rust-base
  stage: deploy
  script:
    - cargo run --quiet -p agov -- dist check-tag
    - cargo run --quiet -p agov -- dist validate
    - cargo run --quiet -p agov -- dist build
  artifacts:
    name: "agf-$CI_COMMIT_TAG"
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/*.sha256
      - dist/*-provenance.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# Publish all release archives to the generic package registry and create the
# GitLab release entry with download links. Tooling links are Rust-only,
# platform-specific archives.
release:create:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: agf:dist:release
      artifacts: true
    - job: rust:tooling:release
      artifacts: true
    - job: agov:oci:release
      artifacts: true
  script:
    - apk add --no-cache curl
    - VERSION="${CI_COMMIT_TAG#v}"
    - PKG_BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agf/$CI_COMMIT_TAG"
    # Fail fast on a partial build/publish -- a real assembled `dist/` is
    # checked against the exact mandatory asset set before anything is
    # uploaded or a Release entry is created, so a missing archive or
    # sidecar blocks the pipeline instead of shipping an incomplete release.
    - tooling/rust/scripts/release-assets.sh verify dist "$VERSION"
    # Validate the complete assembled release set -- schema, cross-record
    # cardinality bijection (every primary artifact exactly one record, no
    # stale/extra records), and artifact/sha256/checksum-sidecar agreement
    # -- before anything is uploaded. This image has no agov of its own;
    # extract it from the already-built musl tooling archive, matching the
    # pattern agov-oci-image.sh already uses for the same reason.
    - apk add --no-cache tar gzip
    - |
      staging="$(mktemp -d)"
      tar -xzf "dist/agov-${VERSION}-x86_64-unknown-linux-musl.tar.gz" -C "$staging"
      AGOV_BIN="$staging/agov-${VERSION}-x86_64-unknown-linux-musl/agov"
      "$AGOV_BIN" dist validate-provenance dist/*-provenance.json --artifact-dir dist
      rm -rf "$staging"
    # Upload every release artifact to the generic package registry.
    # The glob covers framework archives, Rust tooling archives, checksums, and provenance.
    - |
      for f in dist/agf-*.tar.gz dist/agf-*.zip dist/agov-*.tar.gz dist/agov-*.zip \
                dist/*.sha256 dist/*-provenance.json \
                dist/SHA256SUMS; do
        [ -f "$f" ] || continue
        fname=$(basename "$f")
        echo "Uploading $fname"
        curl --silent --fail --show-error \
             --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$f" \
             "$PKG_BASE/$fname"
      done
    # Create the GitLab release entry, linking every archive AND its checksum/
    # provenance sidecars directly -- consumers must not have to guess generic-
    # package URLs. tooling/rust/scripts/release-assets.sh enumerates exactly
    # the files release:create just uploaded above (same glob); its `selftest`
    # subcommand is exercised in CI on every change (job release:assets-selftest).
    - |
      set -- \
        --name "agents-govern $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "See [CHANGELOG](https://gitlab.com/$CI_PROJECT_PATH/-/blob/$CI_COMMIT_TAG/agf/CHANGELOG.md) for release notes."
      for fname in $(tooling/rust/scripts/release-assets.sh list dist); do
        set -- "$@" --assets-link "{\"name\":\"${fname}\",\"url\":\"${PKG_BASE}/${fname}\",\"link_type\":\"package\"}"
      done
      release-cli create \
        "$@"

# Composed post-publication verification: re-fetches the just-created
# GitLab Release from its public API (not this pipeline's `dist/` copy),
# downloads every linked asset fresh, and runs the full composed check --
# schema/hash/sidecar agreement, cardinality bijection, real OCI-registry
# pull-by-digest evidence, and real packaged-binary self-report execution
# -- against those downloaded bytes. `release:create`'s own
# `validate-provenance` call is a build-time pre-upload gate; this job is
# the public-lifecycle counterpart per !351 Gate 2 acceptance matrix row D
# ("the tag/release path must exercise this composed check"). Runs on the
# podman image so the OCI pull-by-digest evidence check has a real
# `podman` to shell out to, matching `agov:oci:release`'s own image choice.
release:verify:
  image: quay.io/podman/stable:v5.6.0
  stage: deploy
  variables:
    STORAGE_DRIVER: vfs
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: release:create
    - job: rust:tooling:release
      artifacts: true
  script:
    - command -v curl >/dev/null || dnf install -y curl
    - command -v tar >/dev/null || dnf install -y tar gzip
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      staging="$(mktemp -d)"
      tar -xzf "dist/agov-${VERSION}-x86_64-unknown-linux-musl.tar.gz" -C "$staging"
      AGOV_BIN="$staging/agov-${VERSION}-x86_64-unknown-linux-musl/agov"
      "$AGOV_BIN" dist post-publication-check \
        --releases-url "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$CI_COMMIT_TAG" \
        --download-dir "$(mktemp -d)"
      rm -rf "$staging"

# Host-preflight self-test for tooling/rust/scripts/release-assets.sh: exercises
# its file-enumeration logic against dummy artifacts so a missing sidecar-link
# pattern is caught before a tag pipeline runs, not discovered post-publication.
# Cheap and dependency-free -- runs on every branch/MR change to the script or
# this file, and always on tag pipelines as a real pre-flight gate.
release:assets-selftest:
  image: alpine:3.22
  stage: test
  script:
    - tooling/rust/scripts/release-assets.sh selftest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/scripts/release-assets.sh
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/scripts/release-assets.sh
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# ── Rust tooling ───────────────────────────────────────────────────────────────
# Path-scoped per ci-trigger-scoping-rule.md: only fire when relevant inputs change.

# Validate only changed coordination messages and Gate 1 plans.
agov:governance:validate:
  extends: .rust-base
  stage: test
  script:
    - |
      set -eu

      # Build agov from source using provenance env vars set by .rust-base before_script.
      # This avoids stale cached binaries carrying incorrect dirty/unknown provenance.
      # .rust-base before_script has already cd'd to tooling/rust.
      cargo build --quiet --release -p agov
      agov_bin="$PWD/target/release/agov"
      echo "agov: $($agov_bin --version)"

      # Return to repo root for git operations.
      cd "$CI_PROJECT_DIR"

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-}" ]; then
        base="$CI_MERGE_REQUEST_TARGET_BRANCH_SHA"
      else
        base="${CI_COMMIT_BEFORE_SHA:-}"
      fi

      case "$base" in
        ""|0000000000000000000000000000000000000000)
          echo "No comparison base available; skipping changed-file governance validation."
          exit 0
          ;;
      esac

      if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
        git fetch --no-tags origin "$CI_DEFAULT_BRANCH"
      fi
      git rev-parse --verify "$base^{commit}" >/dev/null

      git diff --name-only -z "$base"...HEAD -- 'docs/coordination/*.md' \
        | xargs -0r "$agov_bin" coord validate
      git diff --name-only -z "$base"...HEAD -- 'docs/plans/*.md' \
        | xargs -0r "$agov_bin" plan validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/coordination/*.md
        - docs/plans/*.md
        - .gitlab-ci.yml
        - tooling/agov
        - tooling/rust/**/*
        - agf/schemas/**/*
        - agf/agents/MANIFEST.yaml
    - if: $CI_COMMIT_BRANCH
      changes:
        - docs/coordination/*.md
        - docs/plans/*.md
        - .gitlab-ci.yml
        - tooling/agov
        - tooling/rust/**/*
        - agf/schemas/**/*
        - agf/agents/MANIFEST.yaml

# Validate AGF framework content with the Rust agov CLI.
rust:agov:validate:
  extends: .rust-base
  stage: test
  script:
    - cargo run --quiet -p agov -- validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agf/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - agf/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# Scan dependency licenses and advisories. Blocks on GPL/AGPL/LGPL/SSPL and known
# vulnerabilities. deny.toml defines the allowed-license allow-list.
rust:tooling:deny:
  extends: .rust-base
  stage: test
  script:
    - cargo install --list 2>/dev/null | grep -qE "^cargo-deny v0\.19\.[0-9]+:" || cargo install cargo-deny --locked --version "^0.19" --force
    - cargo deny check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# Compile and test the Rust workspace on tooling changes and release tags.
rust:tooling:test:
  extends: .rust-base
  stage: test
  script:
    - cargo test --workspace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

# Lint the Rust workspace on tooling changes and release tags. Warnings are
# treated as errors.
rust:tooling:clippy:
  extends: .rust-base
  stage: test
  script:
    - rustup component add clippy
    - cargo clippy --workspace -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_TAG

.rust-tooling-package:
  extends: .rust-base
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    CROSS_REMOTE: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io zip
    - cd tooling/rust
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo install --list 2>/dev/null | grep -qE "^cross v0\.2\.[0-9]+:" || cargo install cross --locked --version "^0.2" --force
  script:
    - VERSION="$(cat ../../agf/VERSION)"
    - export AGOV_BUILD_COMMIT="${CI_COMMIT_SHA:-unknown}"
    - export AGOV_BUILD_DIRTY=false
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_VERSION="${CI_COMMIT_TAG#v}"
        if [ "$TAG_VERSION" != "$VERSION" ]; then
          echo "Tag $CI_COMMIT_TAG does not match agf/VERSION $VERSION" >&2
          exit 1
        fi
      fi
    - mkdir -p ../../dist
    # Host-native (non-cross) agov binary, used only to generate
    # schema-valid provenance records for the cross-compiled archives
    # below -- it never needs to execute target-platform code, only read
    # each archive's bytes and write JSON per the unified release-
    # provenance contract (agf/schemas/release-provenance.schema.json).
    - cargo build --quiet --release -p agov
    - AGOV_BIN="$PWD/target/release/agov"
    - |
      for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
        cross build --release --target "$target" -p agov -p agov-mcp
        archive="agov-${VERSION}-${target}.tar.gz"
        staging="$(mktemp -d)"
        mkdir -p "$staging/agov-${VERSION}-${target}"
        cp "target/${target}/release/agov" "$staging/agov-${VERSION}-${target}/agov"
        cp "target/${target}/release/agov-mcp" "$staging/agov-${VERSION}-${target}/agov-mcp"
        chmod 0755 "$staging/agov-${VERSION}-${target}/agov"
        chmod 0755 "$staging/agov-${VERSION}-${target}/agov-mcp"
        printf "AGF agov Rust tooling\nVersion: %s\nTarget: %s\n\nInstall by placing the agov and agov-mcp executables on PATH.\n" \
          "$VERSION" "$target" > "$staging/agov-${VERSION}-${target}/README.txt"
        tar -C "$staging" -czf "../../dist/${archive}" "agov-${VERSION}-${target}"
        (cd ../../dist && sha256sum "${archive}" > "${archive}.sha256")
        "$AGOV_BIN" dist provenance-record file \
          --product agov --version "$VERSION" --source-commit "${CI_COMMIT_SHA:-unknown}" \
          --tag "${CI_COMMIT_TAG:-untagged}" \
          --build-timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --pipeline-id "${CI_PIPELINE_ID:-unknown}" --job-id "${CI_JOB_ID:-unknown}" \
          --implementation rust --packaging tar.gz --target-platform "$target" \
          --artifact "../../dist/${archive}" \
          --output "../../dist/${archive}-provenance.json"
        rm -rf "$staging"
      done
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        target="x86_64-pc-windows-gnu"
        cross build --release --target "$target" -p agov -p agov-mcp
        archive="agov-${VERSION}-${target}.zip"
        staging="$(mktemp -d)"
        dist_dir="$(cd ../../dist && pwd)"
        mkdir -p "$staging/agov-${VERSION}-${target}"
        cp "target/${target}/release/agov.exe" "$staging/agov-${VERSION}-${target}/agov.exe"
        cp "target/${target}/release/agov-mcp.exe" "$staging/agov-${VERSION}-${target}/agov-mcp.exe"
        printf "AGF agov Rust tooling\nVersion: %s\nTarget: %s\n\nInstall by placing agov.exe and agov-mcp.exe on PATH.\n" \
          "$VERSION" "$target" > "$staging/agov-${VERSION}-${target}/README.txt"
        (cd "$staging" && zip -qr "$dist_dir/${archive}" "agov-${VERSION}-${target}")
        (cd ../../dist && sha256sum "${archive}" > "${archive}.sha256")
        "$AGOV_BIN" dist provenance-record file \
          --product agov --version "$VERSION" --source-commit "${CI_COMMIT_SHA:-unknown}" \
          --tag "${CI_COMMIT_TAG:-untagged}" \
          --build-timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --pipeline-id "${CI_PIPELINE_ID:-unknown}" --job-id "${CI_JOB_ID:-unknown}" \
          --implementation rust --packaging zip --target-platform "$target" \
          --artifact "../../dist/${archive}" \
          --output "../../dist/${archive}-provenance.json"
        rm -rf "$staging"
      fi
  artifacts:
    paths:
      - dist/agov-*.tar.gz
      - dist/agov-*.tar.gz.sha256
      - dist/agov-*.zip
      - dist/agov-*.zip.sha256
      - dist/agov-*-provenance.json

# Build preview Rust tooling archives for Linux platform targets. These
# artifacts are not releases.
rust:tooling:preview:
  extends: .rust-tooling-package
  artifacts:
    name: "agov-rust-preview-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml

# Build release Rust tooling archives only on tag pipelines.
rust:tooling:release:
  extends: .rust-tooling-package
  artifacts:
    name: "agov-rust-$CI_COMMIT_TAG"
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

agov:oci:release:
  image: quay.io/podman/stable:v5.6.0
  stage: deploy
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: oci
  needs:
    - job: rust:tooling:release
      artifacts: true
  script:
    - export AGOV_VERSION="$(cat agf/VERSION)"
    - tooling/rust/scripts/agov-oci-image.sh check-tag
    - tooling/rust/scripts/agov-oci-image.sh build
    - tooling/rust/scripts/agov-oci-image.sh scan
    - tooling/rust/scripts/agov-oci-image.sh push
    - tooling/rust/scripts/agov-oci-image.sh provenance
  artifacts:
    paths:
      - dist/agov-oci-*-provenance.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

# Manual Windows x64 preview build. This is intentionally separate from the
# default Rust preview job so ordinary MRs do not pay the Windows cross-build
# cost, while release preparation can still request Windows artifacts.
rust:tooling:build:windows:preview:
  extends: .rust-base
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    CROSS_REMOTE: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq docker.io
    - cd tooling/rust
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo install --list 2>/dev/null | grep -qE "^cross v0\.2\.[0-9]+:" || cargo install cross --locked --version "^0.2" --force
  script:
    - cross build --release --target x86_64-pc-windows-gnu -p agov -p agov-mcp
  artifacts:
    name: "agov-rust-windows-preview-$CI_COMMIT_SHORT_SHA"
    paths:
      - tooling/rust/target/x86_64-pc-windows-gnu/release/agov.exe
      - tooling/rust/target/x86_64-pc-windows-gnu/release/agov-mcp.exe
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - tooling/rust/**/*
        - .gitlab-ci.yml
      when: manual
      allow_failure: true
