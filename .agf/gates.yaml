schema_version: 1
gates:
  - id: gate-change-check
    status: active
    surfaces:
      - .agf/gates.yaml
      - .gitlab-ci.yml
      - agf/dist/release-manifest.yaml
      - agf/examples/gates.yaml
      - agf/schemas/gate-registry.schema.json
      - tooling/rust/crates/agov-validators/src/gate_change.rs
      - tooling/rust/crates/agov-validators/src/lib.rs
      - tooling/rust/crates/agov/src/main.rs
    tests:
      - tooling/rust/crates/agov/tests/gate_change_check.rs
      - tooling/rust/crates/agov/tests/fixtures/gate-change/**
  - id: ci-needs-implication
    status: active
    surfaces:
      - .agf/gates.yaml
      - .gitlab-ci.yml
    tests:
      - tooling/rust/crates/agov/tests/ci_needs_implication.rs
      - tooling/rust/crates/agov/tests/fixtures/ci-needs/**
  - id: plan-collision-block
    status: active
    surfaces:
      - agf/schemas/gate1-plan.schema.json
      - agf/rules/workflow/development-workflow-rule.md
      - .gitlab-ci.yml
      - .gitlab/scripts/plan-collision-self-test.sh
      - tooling/rust/crates/agov/src/plan_collision.rs
      - tooling/rust/crates/agov/src/plan_collision_forge.rs
      - tooling/rust/crates/agov/src/main.rs
    tests:
      - tooling/rust/crates/agov/tests/plan_collision.rs
      - .gitlab/scripts/plan-collision-self-test.sh
