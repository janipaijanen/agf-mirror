[workspace]
resolver = "2"
members = [
    "crates/agov-core",
    "crates/agov-coord",
    "crates/agov-validators",
    "crates/agov",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jani Päijänen"]
license = "CC-BY-SA-4.0 OR LicenseRef-AgentsGovern-Commercial"

[workspace.dependencies]
agov-core = { path = "crates/agov-core", version = "0.1.0" }
agov-coord = { path = "crates/agov-coord", version = "0.1.0" }
agov-validators = { path = "crates/agov-validators", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_norway: maintained fork of serde_yaml (serde_yml is unsound, RUSTSEC-2025-0068)
serde_norway = "0.9"
# Draft-07 JSON schema validation; no remote-reference fetching, no async features
jsonschema = { version = "0.18", default-features = false }
ulid = "1"
regex = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

insta = { version = "1", features = ["yaml"] }
