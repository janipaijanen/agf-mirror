[package]
name = "agov-mcp"
description = "stdio MCP adapter for agov governance tooling"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "agov-mcp"
path = "src/main.rs"

[dependencies]
agov-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# No dev-dependency on the `agov` crate: it is bin-only (no lib target),
# so a path dependency on it is invalid and Cargo silently ignores it
# with a warning (Gate 2 review d8h5 BLOCK 2) -- it does NOT make Cargo
# build the binary as a side effect. tests/roi_transport_attribution.rs
# instead explicitly runs `cargo build -p agov` itself before locating
# the binary, so the test is hermetic from a clean target directory.
